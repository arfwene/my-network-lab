# =============================================================================
#  site.yml — "우리 환경"에 대한 모든 것
# =============================================================================
#  이 파일 하나만 고치면 랩 전체의 주소가 따라 바뀐다.
#  Terraform · Ansible · 문서 · SSH 설정 · 랩 지도가 전부 여기서 파생된다.
#
#  ▸ 공개 저장소에는 **안전한 기본값만** 둔다.
#    - 공인 IP 자리에는 RFC5737 문서 전용 대역 (203.0.113.0/24, 198.51.100.0/24, 192.0.2.0/24)
#    - IPv6 는 RFC3849 문서 전용 대역 (2001:db8::/32)
#    - 사무실/Proxmox 주소는 예시값
#
#  ▸ 실제 환경 값은 `config/site.local.yml` 에 쓴다. 이 파일은 git 에 올라가지 않는다.
#    site.local.yml 의 값이 이 파일 위에 병합된다 (깊은 병합).
#    → 사내 대역이 공개 저장소에 실려 나가는 사고를 구조적으로 막는다.
#
#  ▸ 배포 전 반드시 검사한다:  python3 tools/validate-site.py
# =============================================================================

site:
  name: my-network-lab
  domain: lab.local
  timezone: Asia/Seoul

# -----------------------------------------------------------------------------
# 1. 랩이 사용할 주소 블록
#    이 블록들 안에서 세부 대역이 자동으로 계산된다 (design/ipam.yml 의 배분 규칙 참조).
# -----------------------------------------------------------------------------
networks:
  # 랩 서비스망. 전 랩(교육생) 공통으로 동일하게 쓴다.
  # 브리지가 분리돼 있어 섞이지 않으며, 교재·정답을 하나로 유지할 수 있다.
  lab_block: 10.10.0.0/16

  # 관리망(OOB). 랩마다 /24 씩 잘라 쓴다 → lab N = <management> 의 N 번째 /24
  # 랩 서비스망과 라우팅으로 연결하지 않는다.
  management: 172.30.0.0/16

  # "공인 IP" 역할. 실제 인터넷 주소가 아니라 문서 전용 대역을 쓴다.
  public_transit: 203.0.113.0/30    # ISP 회선 구간 (edge ↔ inet)
  public_service: 203.0.113.8/29    # ISP 가 라우팅해 주는 공인 서비스 블록 (공개 서버용)
  external_net:   198.51.100.0/24   # "외부 인터넷" 흉내

  ipv6:
    ula:          fd00:10:10::/48   # 사설 IPv6 (IPv4 의 RFC1918 대응)
    gua_transit:  2001:db8:cafe::/64
    gua_external: 2001:db8:beef::/64
    # ⚠ 실무 규칙: ULA 의 fd 뒤 40bit 는 무작위 생성해야 한다 (조직 간 충돌 방지).
    #   이 값은 교육용 가독성을 위해 의도적으로 규칙적으로 만든 것이다.
    #   tools/validate-site.py 가 이 점을 경고로 알려준다.

# -----------------------------------------------------------------------------
# 2. 교육생이 랩에 접근하는 경로
#    ※ 실제 값은 config/site.local.yml 에. 아래는 예시(RFC5737 TEST-NET-1)다.
# -----------------------------------------------------------------------------
access:
  office_lan: 192.0.2.0/24          # 교육생 PC 가 있는 네트워크

  # Proxmox 접속 정보 — **기본값은 localhost** (콘솔을 Proxmox 위에서 돌리는 경우).
  #
  # 다른 서버에서 원격 Proxmox 에 붙는다면 여기를 고치는 대신
  # 웹 콘솔 [관리자 → 연결 설정] 에서 입력한다. 입력한 값은 var/runtime.yml 로
  # 저장되어 이 파일 위에 병합되고, Terraform·Ansible·문서가 모두 그 값을 쓴다.
  # (API 토큰만은 파일에 쓰지 않는다. var/console.db 에 두고 실행 시 환경변수로 넘긴다)
  proxmox:
    host_ip:      127.0.0.1
    api_endpoint: "https://127.0.0.1:8006/"
    node_name:    pve               # Proxmox 노드 이름 (hostname -s)
    datastore:    local-lvm
    insecure_tls: true              # 사설 인증서 사용 시

  # 랩 운영 서버 = 점프 호스트. 같은 장비다.
  #   · 교육생 브라우저 → 이 주소:8080 (웹 콘솔)
  #   · 교육생 ssh      → 이 주소를 ProxyJump 로 거쳐 랩 노드로 (tools/gen-ssh-config.py)
  #   · Terraform · Ansible 도 여기서 돈다
  jump_host:
    # 사무실 LAN 쪽 주소. **교육생 PC 에서 닿는 주소**를 쓴다.
    # 관리망 주소(172.30.N.9)가 아니다 — 그쪽은 host_octet 으로 자동 계산된다.
    # DHCP 로 받지 말 것. 이 주소가 바뀌면 배포해 둔 교육생 ssh 설정이 전부 죽는다.
    office_ip: 192.0.2.11
    host_octet: 9                   # 각 랩 관리망에서의 마지막 옥텟 (172.30.N.9)
    user: trainee                   # 교육생이 이 서버에 ssh 할 때 쓰는 계정

    # Ansible 이 랩 관리망에 **직접 닿지 못할 때** Proxmox 호스트를 SSH 로 경유한다.
    #   랩 운영 서버를 관리망 브리지(labs.naming.mgmt_bridge)의 트렁크에 물릴 수 있으면
    #   false 로 둔다 — 그게 정상 구성이다.
    #   물리 서버라 브리지에 발을 걸칠 수 없다면 true 로 켠다. 이 값은 Ansible 에만 적용되며
    #   Terraform 은 어차피 API(8006)로만 붙으므로 영향이 없다.
    #   ※ 켜려면 이 서버의 공개키가 Proxmox 호스트의 root(또는 아래 계정)에 등록돼 있어야 한다.
    proxy_via_proxmox: false
    proxmox_ssh_user: root

  lab_user: lab                     # 랩 노드 로그인 계정

  # **운영 서버(Ansible)의 공개키만** 넣는다. 교육생 키를 여기 넣지 말 것.
  #   여기 넣은 키는 cloud-init 으로 **전 랩 전 노드**에 박힌다. 그래서
  #     · 교육생 A 가 교육생 B 의 랩 노드에 로그인할 수 있게 되고
  #     · 명단이 바뀔 때마다 VM 을 다시 만들어야 한다 (cloud-init 은 최초 부팅 때만 돈다)
  #   교육생 키는 콘솔 [접속 키] 에서 본인이 등록한다 → var/console.db →
  #   배정된 랩의 인벤토리에만 실려 Ansible 이 authorized_keys 를 쓴다. (근거: PLAN 7.9.2)
  #
  #   install.sh 가 운영 서버 키를 만들고 화면에 찍어 준다. 그 한 줄을 여기 넣으면 된다.
  ssh_public_keys: []

# -----------------------------------------------------------------------------
# 3. 랩 인스턴스 (1인 1랩)
# -----------------------------------------------------------------------------
labs:
  id_range: [1, 9]                  # 브리지 이름이 vmbr9999 를 넘지 않도록 최대 9
  default_count: 6                  # 호스트 RAM 64GB 기준 권장 (랩당 약 9GB)
  # VMID = vmid_start + lab_id * vmid_base + 노드번호   (lab1 = 900101 ~ 900113)
  #  ▸ vmid_start 를 100~999 밖에 두는 이유:
  #    Proxmox 는 새 VM 에 100 번부터 번호를 준다. 랩이 그 대역을 쓰면
  #    사내 운영 VM 과 번호가 섞여 "목록에서 헷갈려 잘못 지우는" 사고가 난다.
  #    배포 전 충돌 검사도 하지만, 애초에 겹치지 않는 대역을 쓰는 편이 안전하다.
  vmid_start: 900000
  vmid_base: 100
  template_vmid: 9000               # 골든 템플릿. 관리자가 미리 만들어 둔다
  naming:
    bridge:   "vmbr{lab_id}{bridge_id}"
    # 관리망(OOB)은 **전 랩 공용 브리지 하나**를 VLAN 으로 나눠 쓴다.
    #   랩마다 브리지를 따로 두면 랩을 만들 때마다 운영 서버에 NIC 을 붙여야 한다.
    #   VLAN 이면 운영 서버는 트렁크 NIC 하나만 있으면 되고, 랩이 늘어도 줄어도
    #   Proxmox 와 VM 하드웨어를 건드리지 않는다. (근거: PLAN 7.9.1)
    mgmt_bridge: "vmbr9"
    vm_name:  "lab{lab_id}-{node}"
    hostname: "{node}"              # 게스트 안에서는 랩 번호가 보이지 않는다 (교재 일관성)

# -----------------------------------------------------------------------------
# 3-1. 웹 콘솔 계정 정책
# -----------------------------------------------------------------------------
console:
  roles:
    admin: "모든 랩 + 계정 관리 + 해설 열람"
    user:  "배정받은 랩 하나에 대한 생성·실행·삭제"

  # 최초 기동 시 계정이 하나도 없으면 이 관리자 계정을 만든다.
  # 첫 로그인에서 비밀번호 변경을 강제하며, 변경 전에는 아무 화면도 볼 수 없다.
  bootstrap_admin:
    username: admin
    password: admin

  password_policy:
    min_length: 8
    require_special: true          # 영문·숫자가 아닌 문자 1개 이상
    special_chars: "!@#$%^&*()-_=+[]{};:,.<>/?\\|~`'\""

  login:
    max_attempts: 5                # 연속 실패 허용 횟수
    lockout_minutes: 5             # 초과 시 잠금 시간
    # 아무 요청도 없이 이만큼 지나면 로그인이 풀린다.
    #   콘솔은 사내망에서 평문 HTTP 로 열려 있고 관리자 계정이 같은 문을 쓴다.
    #   자리를 비운 브라우저가 그대로 열려 있으면 그것이 곧 관리자 권한이다.
    #   시험 화면은 30초마다 상태를 물으므로 응시 중에는 풀리지 않는다.
    idle_minutes: 240

  # 캡스톤 시험 세션 — 제한 시간과 그 끝에서의 **점수 동결**.
  #
  #   교육생은 SSH 로 노드에 직접 붙을 수 있고 그 경로는 콘솔을 지나지 않는다.
  #   그래서 "고치지 못하게 막는" 것은 성립하지 않는다. 대신 마감 시각의 검사 결과를
  #   확정본으로 못 박아 **그 뒤에 고쳐도 성적이 바뀌지 않게** 한다.
  # 중간 점검 — 캡스톤 전에 "증상만 보고 진단" 을 한 번 겪게 한다.
  #   랩은 혼자 하는 것을 전제로 한다. 그래서 **서버가 고르고 가린다** —
  #   교육생이 직접 고르면 답을 아는 채로 시작하게 되어 훈련이 되지 않는다.
  #   캡스톤과 달리 시계도 성적도 없다. 틀려도 남는 것이 없어야 부담 없이 여러 번 한다.
  drill:
    faults: 1                      # 한 번에 주입할 장애 개수
    checkpoints:
      - id: cp1
        stage: m3                  # 이 단계의 모듈을 보고 있을 때 버튼이 나온다
        label: "중간 점검 ① — L1~L3"
        minutes: 15                # 목표 시간(안내용. 강제하지 않는다)
        # 이 단계에서 **실제로 깨지는** 것만 고른다.
        pool: [m01-01, m01-02, m01-03, m02-01, m02-03, m03-01, m03-04]
      - id: cp2
        stage: m6
        label: "중간 점검 ② — 경로 · 전송"
        minutes: 20
        pool: [m04-02, m04-03, m05-01, m06-01, m06-02, m06-03]

  # 교육생이 **직접 만드는** 단계.
  #   여기 적힌 단계에서는 [이 모듈 적용] 이 그 모듈의 목표 설정을 올리지 않고
  #   **한 단계 앞의 설정**만 올린다 — 장비와 주소는 다 있고, 그 모듈에서 배울
  #   것만 비어 있는 상태다. 교재 3절이 그것을 만드는 과정이다.
  #   검증은 그대로 목표를 보므로, 직접 만들어야 검증이 통과한다.
  #   장애 실습·중간 점검·시험은 목표 구성을 기준으로 돈다 (여기와 무관).
  #   교재가 준비된 모듈만 넣을 것. 넣어 놓고 교재가 없으면 교육생은
  #   무엇을 하라는 것인지 알 수 없는 랩을 받는다.
  build_stages: [m2, m3, m4]

  # 장애 실습(과제)에서 **인정하지 않는** 시나리오.
  #   판정은 "주입한 채로 그 모듈의 검사가 전부 통과했는가" 로 한다. 그러려면
  #   그 장애가 검사에 잡혀야 한다. 아래 둘은 잡히지 않는다 — 고쳐도 티가 나지
  #   않으므로, 그대로 두면 주입만 하고 아무것도 안 해도 통과한다.
  #   좋은 연습거리이므로 메뉴에는 남기고, 인정만 하지 않는다.
  ungraded_scenarios:
    - m07-01   # netem 패킷 손실. 통신은 되므로 검사가 감지하지 못한다
    - m09-05   # 세션 수명 단축. 검사는 짧은 요청뿐이라 같은 이유로 감지되지 않는다

  capstone:
    module: m10                    # 시험 세션을 쓰는 모듈
    minutes: 45                    # 제한 시간
    faults: 3                      # 무작위로 주입할 장애 개수 (교육생에게 보이지 않는다)
    sweep_seconds: 20              # 마감 확정을 시도하는 주기.
                                   # 콘솔이 꺼져 있던 동안 지난 마감도 재시작 때 처리한다.
    # 시험에 뽑을 수 있는 장애. **비워 두면 안 된다.**
    #   scenarios/ 전체에서 고르면 캡스톤 단계(m10)에서 의미가 없는 것까지 뽑힌다.
    #   빠진 것과 그 이유:
    #     m03-01·m03-02  정적 경로를 지우거나 바꾼다. m10 은 OSPF 라우팅이라
    #                    지울 정적 경로가 없다 — 아무것도 깨지지 않는 장애가 된다
    #     m07-01         netem 패킷 손실. 통신은 되므로 **검사로 감지되지 않는다**.
    #                    고쳐도 티가 나지 않아 채점이 성립하지 않는다
    #     m09-05         세션 수명 단축. 검사는 짧은 요청뿐이라 같은 이유로 감지되지 않는다
    #     m08-05         게이트웨이 주소 도용. 회복 뒤 이웃 캐시가 정리될 때까지 수십 초가
    #                    걸려, 채점 시점에 따라 결과가 흔들린다
    #   여기 있는 것은 전부 M10 검사 중 최소 하나가 잡아낸다 (대응표: M10 answers.md)
    pool:
      - m01-01   # pc2 링크 admin down
      - m01-02   # sw1 포트가 브리지에서 빠짐
      - m01-03   # 잘못된 정적 ARP
      - m02-01   # pc1 기본 경로 삭제
      - m02-02   # 트렁크에서 VLAN20 제거
      - m02-03   # r1 VLAN20 게이트웨이 주소 오설정
      - m02-04   # native VLAN 불일치
      - m03-03   # 라우팅 루프 (정적 경로가 OSPF 를 이긴다)
      - m03-04   # web 서버 기본 경로 삭제
      - m04-01   # 백업 경로 Area 불일치 (무증상)
      - m04-02   # 주 경로 MTU 불일치
      - m04-03   # OSPF 인증 불일치
      - m04-04   # Hello 타이머 불일치
      - m05-01   # IPv6 기본 경로 삭제
      - m05-02   # OSPFv3 area 누락
      - m05-03   # IPv6 주소 중복 (DAD 실패)
      - m06-01   # web 80 DROP
      - m06-02   # nginx 중지
      - m06-03   # nginx SIGSTOP (서비스 행)
      - m06-04   # ephemeral 포트 고갈
      - m07-02   # r4 에서 특정 출발지 HTTP 만 DROP
      - m08-01   # DNS A 레코드 오류
      - m08-02   # DNS 서버 중지
      - m08-03   # resolv.conf 오류
      - m08-04   # FTP Passive 비활성
      - m09-01   # SNAT 규칙 제거
      - m09-02   # web DNAT 규칙 제거
      - m09-03   # stateful 허용 규칙 제거
      - m09-04   # FTP 가 사설 주소를 밖에 알린다

# -----------------------------------------------------------------------------
# 4. 사용하면 안 되는 대역
# -----------------------------------------------------------------------------
#  위 networks 의 어느 대역이라도 여기와 겹치면 tools/validate-site.py 가 배포를 막는다.
#
#  ▸ 사내에서 이미 쓰고 있는 대역을 반드시 config/site.local.yml 의 forbidden 에 추가할 것.
#    랩 관리망이 사내 대역과 겹치면 점프 호스트의 라우팅이 충돌해 랩 접속 자체가 안 된다.
#    (이 검사 자체가 M2 의 C8 "사설 대역 중복 리스크" 교재다)
forbidden:
  - {cidr: 192.168.0.0/16, severity: error, reason: "공유기 기본 대역. VPN·재택 접속과 거의 확실히 충돌한다"}
  - {cidr: 169.254.0.0/16, severity: error, reason: "Link-local (APIPA). DHCP 실패 진단 신호로 써야 하므로 점유 금지"}
  - {cidr: 127.0.0.0/8,    severity: error, reason: "루프백"}
  - {cidr: 100.64.0.0/10,  severity: warn,  reason: "CGNAT. ISP 가 쓰는 대역이라 회선에 따라 충돌 가능"}
  - {cidr: 224.0.0.0/4,    severity: error, reason: "멀티캐스트"}

# -----------------------------------------------------------------------------
# 5. 공개 저장소 안전장치
# -----------------------------------------------------------------------------
publish_guard:
  # 문서·생성물에 이 문자열들이 들어가면 tools/validate-site.py 가 경고한다.
  # 사내 도메인·호스트명 등을 여기에 등록해 두면 공개 전 유출을 잡을 수 있다.
  forbidden_strings: []
  # 이 대역들은 문서에 등장해도 안전하다 (RFC5737/RFC3849 문서 전용).
  documentation_ranges:
    - 192.0.2.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 2001:db8::/32

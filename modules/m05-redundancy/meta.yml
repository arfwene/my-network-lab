id: m05
title: "게이트웨이 이중화 — VRRP"
stage: m5
duration: "3시간"
competencies: [C3, C4, B3, B4, D1, D3]
summary: "경로가 둘이어도 게이트웨이가 한 대면 그 한 대가 죽을 때 다 멈춥니다. 두 라우터가 하나의 가상 IP 를 나눠 들게 만들고, 한 대를 꺼서 실제로 넘어가는지 눈으로 확인합니다."
objectives:
  - "단일 장애점(SPOF)이 어디인지 구성도에서 짚어 낼 수 있습니다 (C3)"
  - "VRRP 의 가상 IP · 가상 MAC · 우선순위가 각각 무엇을 하는지 설명할 수 있습니다 (C4)"
  - "두 라우터에 VRRP 를 설정해 하나의 게이트웨이처럼 동작하게 만들 수 있습니다 (B3)"
  - "MASTER 를 내려 페일오버를 일으키고, 잃은 패킷 수로 전환 시간을 잽니다 (B4, D3)"
  - "페일오버 때 단말의 ARP 캐시가 왜 그대로여도 되는지 캡처로 증명할 수 있습니다 (D1)"
  - "우선순위·preempt 를 조절해 의도한 라우터가 MASTER 가 되게 할 수 있습니다 (C4)"

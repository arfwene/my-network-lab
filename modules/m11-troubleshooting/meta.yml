id: m11
title: "트러블슈팅 방법론"
stage: m11
duration: "4시간"
competencies: [I1, I2, I3, I4, I5, I6]
summary: "지금까지 배운 것을 순서로 만듭니다. 영향 범위를 먼저 규정하고, 표준 3-step 으로 절단 지점을 좁히고, 증거로 원인을 입증합니다. 무엇이 주입됐는지 모르는 장애를 셋 이상 풀고, 그 과정을 산출물 셋(PPT)으로 남깁니다 — 못 고친 것은 인계 보고서에 씁니다."
objectives:
  - "장애 신고를 받으면 영향 범위를 먼저 규정할 수 있습니다 — 누가 / 어디서 / 언제부터 / 전부인가 일부인가 / 최근 변경 (I1)"
  - "Bottom-up · Top-down · Divide-and-Conquer 를 상황에 맞게 고르고, 표준 3-step 으로 절단 지점을 격리할 수 있습니다 (I2)"
  - "추측이 아니라 명령어 출력과 패킷 캡처로 원인을 입증할 수 있습니다 (I3)"
  - "변경 전 상태를 저장하고 롤백 계획을 세운 뒤 작업할 수 있습니다 — 고치려다 더 크게 만들지 않습니다 (I4)"
  - "장애 보고서를 쓸 수 있습니다 — 현상 / 영향 범위 / 타임라인 / 원인 / 조치 / 재발 방지 (I5)"
  - "못 고친 것을 인계할 수 있습니다 — 무엇을 배제했고 남은 후보는 무엇이며 다음 사람이 어디서 시작하면 되는가 (I5)"
  - "최종 네트워크 구성을 문서로 남길 수 있습니다 — 토폴로지 · 주소 대장 · 변경 이력 (I6)"

id: m10
title: "NAT 와 방화벽 — 사설과 공인의 경계"
stage: m10
duration: "3시간"
competencies: [G1, G2, G3, E3, E4, F5, C7]
summary: "사설 IP 가 공인 IP 로 바뀌는 순간을 경계 장비 양쪽에서 동시에 캡처합니다. 그리고 NAT 가 보안 기능이 아니라는 것을 라우팅 테이블로 증명합니다."
objectives:
  - "SNAT / DNAT / PAT 를 구분해 설명하고, NAT 테이블로 주소 변환을 추적할 수 있습니다 (G1)"
  - "Stateful 방화벽이 리턴 트래픽을 자동으로 허용하는 원리를 설명하고 정책 방향성을 올바르게 설계할 수 있습니다 (G2)"
  - "정책 순서·방향 오류로 인한 통신 실패를 진단할 수 있습니다 (G3)"
  - "사설 IP 가 인터넷에서 라우팅되지 않는다는 것을 라우팅 테이블과 캡처로 증명할 수 있습니다 (C7)"
  - "NAT 는 보안 기능이 아니며 실제 통제는 방화벽 정책이 한다는 것을 설명할 수 있습니다"
  - "FTP 가 NAT 환경에서 깨지는 지점을 캡처로 특정하고 해결책을 말할 수 있습니다 (F5)"

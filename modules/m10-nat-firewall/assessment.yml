# M10 평가 — 퀴즈(NAT 종류 · stateful · 오해 교정) + 검사(양방향 NAT · **음성 검사** · 뒷정리)
#   ※ 검사 순서가 중요하다. pc1 의 SNAT 검사가 먼저 돌아야 edge 의 conntrack 검사에
#      볼 만한 세션이 남는다. 항목 순서를 바꾸지 말 것.
quiz:
  pass_score: 100
  questions:
    - id: q1
      type: single
      text: |
        내부 PC 여러 대가 **공인 IP 하나**로 인터넷에 나갑니다.
        이때 서로 다른 PC 의 통신이 섞이지 않는 이유는?
      choices:
        - "내부 PC 마다 IP 주소가 달라 그대로 구분되기 때문"
        - "출발지 포트를 함께 바꿔 세션마다 다른 번호를 주기 때문 (PAT)"
        - "경계 장비가 시간을 나눠 순서대로 내보내기 때문"
        - "프레임의 MAC 주소가 그대로 남아 있어 경계 장비가 그것으로 구분해 주기 때문"
      answer: [1]
      explain: |
        주소만 바꾸면 돌아온 응답을 누구에게 줄지 알 수 없습니다.
        그래서 **출발지 포트까지** 바꾸고, 그 대응 관계를 표에 기록합니다 — 이것이 PAT(=NAPT)다.
        보통 "NAT" 라고 부르는 것의 실체가 이것입니다.
        → 그래서 **한 공인 IP 로 동시에 열 수 있는 세션 수는 포트 수만큼**이 상한입니다 (M7 의 그 이야기).

    - id: q2
      type: multi
      text: "SNAT 과 DNAT 의 설명으로 **옳은 것**을 모두 고르시오."
      choices:
        - "SNAT — 나가는 패킷의 출발지를 바꿉니다. 내부에서 외부로 나갈 때"
        - "DNAT — 들어오는 패킷의 목적지를 바꿉니다. 외부에 서버를 공개할 때"
        - "SNAT 과 DNAT — 같은 것이며 이름만 다릅니다"
        - "DNAT — 포트 포워딩이라고도 부릅니다"
      answer: [0, 1, 3]
      explain: |
        **방향이 반대입니다.** 나갈 때는 출발지를, 들어올 때는 목적지를 바꿉니다.
        이 랩에서 `{{ public.nat_pool.snat_address }}` 는 SNAT 주소이고,
        `{{ (public.nat_pool.dnat | selectattr('node','equalto','web') | first).public }}` 는 web 을 공개하는 DNAT 주소입니다.

    - id: q3
      type: single
      text: |
        경계 장비의 방화벽 정책에 **"외부 → 내부" 를 허용하는 규칙이 두 개뿐**입니다.
        그런데 내부 PC 가 외부 웹사이트에 접속하면 응답이 정상적으로 돌아옵니다. 왜인가?
      choices:
        - "규칙이 잘못 적혀 있습니다. 의도보다 넓게 허용됐습니다"
        - "웹 트래픽(80·443)은 방화벽이 기본으로 통과시키도록 정책에 미리 들어가 있기 때문입니다"
        - "NAT 가 방화벽보다 먼저 처리돼 정책을 우회하기 때문"
        - "나갈 때 만들어진 세션의 리턴 트래픽은 `ct state established` 로 자동 허용되기 때문"
      answer: [3]
      explain: |
        **이것이 stateful 방화벽의 전부입니다.**
        나갈 때 세션을 기록해 두고, 그 세션에 속하는 패킷은 정책 없이 통과시킵니다.
        그래서 **정책은 "먼저 연결을 거는 방향" 으로만 씁니다.** 역방향 규칙을 따로 쓰면
        오히려 필요 이상으로 열어 주는 셈이 됩니다.

    - id: q4
      type: single
      text: |
        "NAT 를 쓰니까 외부에서 내부로 못 들어옵니다. 그래서 NAT 는 보안 기능입니다."
        무엇이 틀렸는가?
      choices:
        - "NAT 는 주소를 바꾸는 변환일 뿐입니다. 외부 접속이 막힌 것은 부작용이고, 통제는 방화벽이 합니다"
        - "틀린 것이 없습니다. 외부에서 못 들어오면 그것이 곧 보안입니다"
        - "NAT 는 주소만 바꾸고 내용을 암호화하지 않아 보안이라 할 수 없습니다"
        - "NAT 는 IPv4 에서만 보안 역할을 하고 IPv6 에서는 하지 않으므로 반쪽만 맞는 설명입니다"
      answer: [0]
      explain: |
        "변환 표에 항목이 없어서 못 들어온" 것이지 **막기로 결정해서 막은 것이 아닙니다.**
        증거: 이 랩에서 DNAT 를 하나 넣는 순간 외부에서 내부 서버로 바로 들어옵니다.
        의도적으로 열고 닫는 것은 **방화벽 정책**입니다.
        → M6 에서 본 IPv6 에는 NAT 가 없습니다. 그래도 안전한 이유는 **방화벽이 있기 때문**입니다.


    - id: q5
      type: single
      text: |
        외부에서 공개 IP 의 **열려 있지 않은 포트**로 접속하니 `Connection refused` 가 아니라
        **한참 매달리다 타임아웃**이 났습니다. 무엇을 뜻하는가?
      choices:
        - "서버가 죽었습니다 — 응답할 프로세스가 아예 없습니다"
        - "방화벽이 버리고 있습니다 — DROP 은 응답을 돌려주지 않습니다"
        - "포트가 닫혀 있습니다 — 듣는 프로그램이 없어 거부된 것입니다"
        - "경로가 없습니다 — 그 주소로 가는 길 자체가 없습니다"
      answer: [1]
      explain: |
        DNAT 대상이 아닌 포트는 경계에서 **정책 drop** 됩니다. 아무 응답도 주지 않으므로 매달립니다.
        만약 서버까지 도달했다면 커널이 RST 를 줘서 **즉시 거부**였을 것입니다.
        → **실패까지 걸린 시간이 "어디서 막혔는지" 를 말해 줍니다.** M7 감별표가 여기서 그대로 쓰입니다.

    - id: q6
      type: single
      text: |
        방화벽 정책을 "외부 → 내부: 전부 허용, 그 앞줄에 특정 IP 차단" 순서로 썼습니다.
        차단이 동작하지 않는다면 가장 유력한 이유는?
      choices:
        - "차단 규칙의 문법이 틀려 규칙이 적재되지 않았습니다"
        - "방화벽을 재시작하지 않아 새 규칙이 반영되지 않았습니다"
        - "허용 규칙이 먼저 매칭돼 버렸습니다. 규칙은 위에서부터 순서대로 평가됩니다"
        - "NAT 가 출발지 주소를 먼저 바꾸는 바람에 차단하려던 IP 와 달라졌기 때문입니다"
      answer: [2]
      explain: |
        대부분의 방화벽은 **첫 번째로 매칭되는 규칙**에서 판정을 끝냅니다.
        그래서 **좁은 규칙(예외)이 위, 넓은 규칙이 아래**여야 합니다.
        정책이 많아질수록 순서 사고가 늘어나며, 이것이 G3 의 핵심입니다.
        (참고: 이 랩의 nftables 는 마지막까지 안 걸리면 chain 의 `policy` 로 판정합니다)

    - id: q7
      type: single
      text: |
        FTP 서버가 NAT 뒤에 있습니다. 외부 클라이언트가 Passive 모드로 접속했더니
        제어 채널(21)은 되는데 **파일 전송만** 안 됩니다. 캡처를 보니 `227` 응답에
        **사설 IP** 가 들어 있었습니다. 원인은?
      choices:
        - "서버가 자기 사설 주소를 그대로 알려 줬고, 외부 클라이언트는 그 주소로 갈 수 없습니다"
        - "방화벽이 Passive 데이터 포트 범위를 열어 두지 않았습니다"
        - "서버에서 Passive 모드가 꺼져 있어 데이터 채널을 아예 열지 못한 것입니다"
        - "오래된 FTP 클라이언트라 227 응답을 해석하지 못합니다"
      answer: [0]
      explain: |
        FTP 는 **주소를 패킷 본문(payload)에 실어 보냅니다.** NAT 는 헤더만 바꾸므로 본문의 주소는 그대로입니다.
        그래서 서버에 **"밖에는 이 공개 IP 로 알려라"**(`pasv_address`)를 따로 설정해야 합니다.
        → **"FTP 가 NAT 를 싫어한다" 는 말의 실체**가 이것입니다.
        같은 이유로 데이터 포트 대역도 고정해야 방화벽 정책을 쓸 수 있습니다.

    - id: q8
      type: single
      text: |
        경계 장비에서 `conntrack -L` 을 실행했습니다. 여기서 볼 수 있는 것으로 옳은 것은?
      choices:
        - "라우팅 테이블 — 어느 경로로 나가는지"
        - "ARP·NDP 테이블 — 같은 세그먼트 이웃의 링크 계층 주소 목록"
        - "추적 중인 세션 목록 — 변환 전후 주소가 한 줄에 나옵니다"
        - "인터페이스별 송수신 통계와 오류 카운터 — `ip -s link` 로 보는 값"
      answer: [2]
      explain: |
        방화벽·로드밸런서가 말하는 **"세션" 의 실체**가 이 표입니다 (M7 의 4-tuple + 프로토콜).
        변환 전후 주소가 한 줄에 같이 나오므로 **"이 내부 PC 가 지금 어느 공인 포트를 쓰는지"** 를 즉시 알 수 있습니다.
        → 외부에서 온 로그의 공인 IP·포트로 **내부 사용자를 역추적**할 때 쓰는 것이 이 표입니다.

    - id: q9
      type: single
      text: |
        같은 목적지로 가는 통신이 **경로에 따라 방화벽을 한쪽 방향만 지나간다**(비대칭 경로).
        무슨 일이 생기는가?
      choices:
        - "방화벽이 세션의 절반만 보게 되어, 나머지를 `invalid` 로 판단해 끊습니다"
        - "경로가 길어진 만큼 지연이 늘어 속도만 느려집니다"
        - "방화벽은 방향과 무관하게 판단하므로 아무 일도 없습니다"
        - "NAT 가 반대 방향 세션을 새로 만들어 자동으로 보정하므로 통신은 유지됩니다"
      answer: [0]
      explain: |
        stateful 장비는 **양방향을 다 봐야** 세션을 유지할 수 있습니다.
        M4 에서 cost 를 한쪽만 바꿔 비대칭을 만들어 봤는데, **그 경로에 방화벽이 있으면 통신이 깨집니다.**
        → 이중화 설계에서 방화벽을 어디에 둘지가 까다로운 이유입니다.

    # ── 2.7 헤어핀 · 2.8 상태 만료 ─────────────────────────────────────
    - id: q10
      type: single
      text: |
        외부에서는 공개 주소로 잘 접속됩니다. 그런데 **사내에서 같은 공개 주소로** 접속하면 실패합니다.
        출발지에서 캡처하니 SYN-ACK 이 **서버의 사설 주소**에서 왔습니다. 무엇이 문제인가?
      choices:
        - "리턴 트래픽이 경계 장비를 거치지 않아 역번역이 끝나지 않았습니다"
        - "DNAT 규칙이 빠져 있습니다. 목적지가 바뀌지 않았습니다"
        - "서버가 죽었습니다. 응답이 오지 않는 것은 서비스 문제입니다"
        - "방화벽이 리턴 트래픽을 막고 있습니다. stateful 규칙을 확인해야 합니다"
      answer: [0]
      explain: |
        **응답이 왔다는 것 자체가 서버 무죄의 증거입니다.** DNAT 도 동작했습니다 — 목적지가 사설로 바뀌어 서버에 닿았으니까요.
        문제는 **출발지가 사내 주소 그대로**라, 서버가 경계를 거치지 않고 곧장 돌아간 것입니다.
        걸었던 상대와 답한 상대가 다르니 커널이 버립니다.
        한 문장으로: **번역이 낀 세션의 왕복은 같은 번역기를 지나야 합니다.**

    - id: q11
      type: single
      text: |
        헤어핀을 **헤어핀 SNAT** 으로 고쳤습니다. 무엇을 잃는가?
      choices:
        - "서버가 진짜 클라이언트 IP 를 못 봅니다. 로그가 경계 장비 주소로 남습니다"
        - "외부에서 오는 접속이 함께 막힙니다. 사내와 외부 중 하나만 됩니다"
        - "DNAT 이 무효가 되어 포트 공개 규칙을 다시 써야 합니다"
        - "잃는 것이 없습니다. 그래서 표준 처방으로 권장됩니다"
      answer: [0]
      explain: |
        출발지를 경계 장비로 바꿔야 응답이 돌아오는 길에 그 장비를 지납니다. 대가가 **출발지 정보**입니다.
        접속 로그·감사·IP 차단이 전부 출발지에 걸려 있으므로 가볍지 않습니다.
        그래서 실무에서는 **스플릿 DNS**(사내 DNS 가 같은 이름에 사설 IP 를 돌려주는 것)를 더 선호합니다.
        규칙에 출발지 대역·목적지·포트 조건을 붙여 범위를 좁히는 이유도 이 대가를 줄이려는 것입니다.

    - id: q12
      type: single
      text: |
        잘 되던 연결이 **한동안 조용히 두면** 그 뒤로 데이터가 가지 않습니다.
        양쪽 `ss` 에는 아직 `ESTAB` 으로 보이고, 짧은 요청은 전부 정상입니다. 무엇을 의심하는가?
      choices:
        - "중간 상태형 장비의 세션 항목이 수명을 다해 지워졌습니다"
        - "서버 프로세스가 죽었습니다. 재기동하면 되돌아옵니다"
        - "경로가 바뀌었습니다. 라우팅 테이블을 확인해야 합니다"
        - "포트가 고갈됐습니다. ephemeral 범위를 넓혀야 합니다"
      answer: [0]
      explain: |
        상태 테이블의 항목에는 **수명**이 있습니다. 조용하면 지워지는데, **양 끝의 소켓은 그걸 모릅니다.**
        그래서 애플리케이션 로그에는 아무 단서가 없습니다 — 소켓은 멀쩡히 열려 있으니까요.
        처방은 재기동이 아니라 **keepalive** 입니다. 조용한 연결에 주기적으로 한 바이트를 흘려
        중간 장비의 기억을 갱신합니다. 커넥션 풀·DB 연결이 단골 피해자입니다.
        (포트 고갈은 **신규 연결만** 실패하고 기존은 멀쩡하다는 점에서 다릅니다.)


checks:
  required: true
  items:
    # --- SNAT 계열 (이 검사가 먼저 돌아야 아래 conntrack 검사에 세션이 남는다) ---
    - id: snat-outbound
      kind: connectivity
      title: "pc1 → 외부 사이트 HTTP 200 (SNAT) ★"
      host: pc1
      run: "curl -sS -m5 -o /dev/null -w '%{http_code}' http://{{ public.external_site.inet_loopback }}/"
      expect: "200"
      hint: |
        순서대로 봐 주세요.
          ① ip route show default              내부 라우터가 기본 경로를 배웠는가
          ② traceroute -n {{ public.external_site.inet_loopback }}   어디까지 가는가
          ③ edge 에서 sudo nft list ruleset     snat 규칙이 있는가
          ④ edge 의 eth2 에서 캡처              출발지가 공인으로 바뀌었는가

    - id: default-via-ospf
      kind: config
      title: "내부 라우터가 기본 경로를 OSPF 로 배웠는가"
      host: r1
      run: "vtysh -c 'show ip route ospf'"
      expect: "0.0.0.0/0"
      hint: |
        r4 의 `default-information originate` 가 내부에 기본 경로를 배포합니다 (M4).
        이것이 없으면 내부에서 인터넷 방향을 아예 모릅니다.

    # --- DNAT 계열 (외부에서 들어오는 방향) ---
    - id: dnat-web
      kind: connectivity
      title: "외부 → web 공개 IP HTTP 200 (DNAT)"
      host: inet
      run: "curl -sS -m5 -i http://{{ (public.nat_pool.dnat | selectattr('node','equalto','web') | first).public }}/health"
      expect_all: ["200", "X-Lab-Node: web", "ok"]
      hint: |
        edge 에서 sudo nft list ruleset 의 prerouting 체인에 dnat 규칙이 있는지 봐 주세요.
        규칙은 있는데 안 되면 forward 체인의 허용 규칙을 봅니다 (DNAT 과 정책은 별개입니다).

    - id: dnat-ftp-passive
      kind: connectivity
      title: "외부 → FTP 공개 IP 로 Passive 전송이 되는가 ★"
      host: inet
      run: "curl -sS -m10 -u ftpuser:labpass ftp://{{ (public.nat_pool.dnat | selectattr('node','equalto','ftp') | first).public }}/hello.txt"
      expect: "my-network-lab"
      hint: |
        21 은 되는데 전송만 안 되면 두 가지를 봅니다.
          ① 227 응답에 **공개 IP** 가 들어 있는가 (ftp 의 pasv_address)
          ② 데이터 포트 대역({{ services.ftp.passive_range }})이 DNAT·정책에 포함돼 있는가

    # --- 음성 검사 : 되면 안 되는 것이 안 되는가 ---
    - id: private-not-routable
      kind: state
      title: "외부에서 **사설 IP 로는 닿지 않는가** (음성 검사) ★"
      host: inet
      run: >-
        ip route get {{ ip.web }} >/dev/null 2>&1; echo route_rc=$?;
        timeout 5 ping -c1 -W2 {{ ip.web }} >/dev/null 2>&1; echo ping_rc=$?
      expect_none: ["route_rc=0", "ping_rc=0"]
      hint: |
        **되면 안 되는 것이 되고 있습니다.** inet 에 사내 대역 경로가 생겼는지 확인할 것:
          ip route show | grep {{ lab_block }}
        실습 중에 임시로 넣은 경로가 남아 있을 수 있습니다. 지울 것.

    - id: closed-port-dropped
      kind: state
      title: "공개 IP 의 열지 않은 포트는 **조용히 버려지는가**"
      host: inet
      run: >-
        timeout 5 bash -c 'echo > /dev/tcp/{{ (public.nat_pool.dnat | selectattr('node','equalto','web') | first).public }}/22' 2>/dev/null;
        echo rc=$?
      expect: "rc=124"
      hint: |
        rc=124 → 타임아웃 = 정책 drop (M7 감별표 ②). 정상입니다.
        rc=1   → 즉시 거부 = 패킷이 서버까지 갔다는 뜻 → 정책이 열려 있습니다.
        rc=0   → **연결됐습니다.** 공개하면 안 되는 포트가 열려 있습니다.

    # --- 설정 · 상태 ---
    - id: nat-rules
      kind: config
      title: "경계 장비에 SNAT · DNAT 규칙이 다 있는가"
      host: edge
      become: true
      run: "nft list ruleset"
      expect_all:
        - "snat to {{ public.nat_pool.snat_address }}"
        - "{{ (public.nat_pool.dnat | selectattr('node','equalto','web') | first).public }}"
        - "{{ (public.nat_pool.dnat | selectattr('node','equalto','ftp') | first).public }}"
        - "ct state established,related accept"
      hint: |
        sudo nft -f /etc/nftables.conf 로 설정 파일 기준으로 되돌릴 수 있습니다.
        (파일 첫 줄이 flush ruleset 이라 전체가 원래대로 돌아옵니다)

    - id: conntrack-session
      kind: state
      title: "세션 테이블에 방금 나간 통신이 기록돼 있는가"
      host: edge
      become: true
      run: "conntrack -L 2>/dev/null | grep -c '{{ public.external_site.inet_loopback }}' || true"
      expect_regex: "^[1-9]"
      hint: |
        이 검사는 **바로 앞의 SNAT 검사가 만든 세션**을 봅니다.
        직접 확인하려면 pc1 에서 외부로 접속한 직후 edge 에서:
          sudo conntrack -L | grep {{ ip.pc1 }}
        비어 있다면 애초에 나가지 못한 것입니다 — SNAT 검사부터 봐 주세요.

    - id: ftp-pasv-address
      kind: config
      title: "FTP 서버가 밖에 알려 줄 **공개 주소**를 설정하고 있는가"
      host: ftp
      run: "grep -c '^pasv_address=' /etc/vsftpd.conf || true"
      expect: "1"
      hint: |
        이 줄이 없으면 227 응답에 **사설 IP** 가 실려 나가 외부 클라이언트가 데이터 채널을 못 엽니다.
        [장애 연습] 에서 m10-04 를 골라 [복구], 또는 [이 모듈 적용].

written:
  items:
    - id: nat-diagnosis
      title: "장애 원인 서술 — 경계에서 무슨 일이 일어났는가 ★"
      kind: text
      review: optional
      auto_pass: true
      min_chars: 260          # 다섯 항목을 다 짚은 완결된 답이 286자였습니다
      prompt: |
        장애 주입(m10-01 ~ m10-04) 중 하나를 골라 적을 것.
        **경계 장비의 어느 단계에서 무슨 일이 일어났는지**가 드러나야 합니다.

          1. 증상 — 무엇이 안 되고 무엇은 됐는가 (되는 것도 중요한 단서입니다)
          2. 어디서 캡처했는가 — **경계 장비의 안쪽과 바깥쪽 중 어디를 봤는가** (M8)
          3. 캡처에서 무엇이 보였는가 — 주소가 바뀌었는가 · 나갔는데 안 돌아왔는가
          4. 원인 — NAT 인가 정책인가 라우팅인가. 그렇게 판단한 근거
          5. 조치와 원복
      rubric:
        - key: 증상범위
          desc: "되는 것과 안 되는 것을 나눠 적었는가"
          any: ["되는데", "만 안", "은 되고", "정상인데", "되는 것은", "안 되는 것은",
                 "내부는", "외부에서는", "안에서는", "밖에서는"]
        - key: 캡처지점
          desc: "경계의 어느 쪽에서 봤는지 밝혔는가"
          any: ["eth1", "eth2", "안쪽", "바깥", "inside", "outside", "edge 에서", "양쪽"]
        - key: 변환관찰
          desc: "주소 변환 여부를 관찰했는가"
          any: ["출발지", "목적지", "바뀌", "변환", "snat", "dnat", "SNAT", "DNAT", "공인", "사설"]
        - key: 원인구분
          desc: "NAT · 정책 · 라우팅 중 무엇인지 가렸는가"
          any: ["정책", "방화벽", "라우팅", "경로", "NAT", "conntrack", "세션", "established"]
        - key: 조치
          desc: "고친 방법과 되돌린 사실을 적었는가"
          any: ["복구", "추가", "삭제", "원복", "되돌", "다시 넣", "규칙을 다시", "nft -f", "nft add"]

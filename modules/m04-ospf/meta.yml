id: m04
title: "동적 라우팅 — OSPF"
stage: m4
duration: "4시간"
competencies: [D5, D6, D7, C5]
summary: "정적 경로를 걷어내고 라우터들이 스스로 길을 찾게 한다. 링크를 끊어 수렴을 측정하고, 인접이 안 맺히는 원인 네 가지를 순서대로 점검한다."
objectives:
  - "OSPF 인접(Neighbor) 형성 조건을 알고 설정·검증할 수 있다 (D5)"
  - "인접이 안 맺히는 원인 상위 4가지(Area / 서브넷·마스크 / MTU / 인증·타이머)를 순서대로 점검할 수 있다 (D5)"
  - "링크 장애 시 경로 수렴을 관측하고, cost 조정으로 의도한 경로로 트래픽을 유도할 수 있다 (D6)"
  - "제어 평면(인접·LSDB)과 데이터 평면(실제 전달)이 어떻게 다른지 설명할 수 있다 (D6)"
  - "AS 와 BGP 의 역할, 사내망(IGP)과 인터넷 경로(EGP)의 구분을 설명할 수 있다 (D7)"
  - "MTU 불일치가 OSPF 인접을 어디서 멈추게 하는지 재현하고 진단할 수 있다 (C5)"

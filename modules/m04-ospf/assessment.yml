# M4 평가 — 퀴즈(인접 조건·수렴·cost) + 검사(정적이 사라지고 O 로 학습하는가 · 뒷정리) + 서술
quiz:
  pass_score: 100
  questions:
    - id: q1
      type: multi
      text: |
        OSPF 인접(Neighbor)이 맺히지 않을 때 **점검해야 할 항목**을 모두 고르시오.
      choices:
        - "양쪽 인터페이스의 Area ID 가 같은가"
        - "양쪽 인터페이스의 MTU 가 같은가"
        - "양쪽이 같은 서브넷/마스크에 있는가"
        - "Hello / Dead 타이머와 인증 설정이 같은가"
        - "양쪽 라우터의 hostname 이 같은가"
      answer: [0, 1, 2, 3]
      explain: |
        **이 네 가지를 순서대로 외워 둘 것 — D5 체크리스트입니다.**
          ① Area ID  ② 서브넷·마스크  ③ MTU  ④ 인증·타이머
        hostname 은 아무 상관이 없습니다. router-id 는 달라야 합니다(같으면 오히려 문제입니다).
        현장에서 "OSPF 가 안 붙어요" 의 90% 가 이 네 가지 안에서 끝납니다.

    - id: q2
      type: single
      text: |
        OSPF 인접 상태가 `ExStart` 또는 `Exchange` 에서 더 나아가지 않습니다.
        가장 먼저 의심할 것은?
      choices:
        - "Area ID 불일치"
        - "인증 실패"
        - "케이블 불량"
        - "MTU 불일치"
      answer: [3]
      explain: |
        Area 나 인증이 다르면 아예 `Init` 이하에서 멈추거나 인접 자체가 안 보입니다.
        `ExStart`/`Exchange` 는 **DBD(데이터베이스 요약)를 주고받는 단계**이고,
        이때 서로의 MTU 값을 확인합니다. 여기서 멈췄다면 MTU 입니다.
        → M2 에서 배운 MTU 가 여기서 다시 나옵니다. **증상의 위치가 원인을 말해 줍니다.**

    - id: q3
      type: single
      text: |
        r1 에서 `show ip ospf neighbor` 를 보니 r2 가 **`Full`** 입니다.
        그런데 `show ip route` 를 보면 Site-B 로 가는 경로가 **r3 를 거치고 있습니다.**
        **cost 는 양쪽 다 설계값 그대로다** (주 경로 {{ p2p['r1-r2'].ospf_cost }}, 백업 {{ p2p['r1-r3'].ospf_cost }}).
        무엇이 일어난 것인가?
      choices:
        - "r2 너머의 링크가 끊겨, LSDB 상 r2 를 통한 경로가 유효하지 않게 됐습니다"
        - "출력이 잘못된 것입니다. show 를 다시 쳐서 확인해야 합니다"
        - "r2 와의 cost 가 내부적으로 재계산돼 백업이 더 싸졌습니다"
        - "인접이 Full 이면 항상 그 이웃을 경유하므로 두 출력이 서로 모순입니다. 다시 확인해야 합니다"
      answer: [0]
      explain: |
        **인접 상태와 경로 선택은 다른 이야기입니다.**
        인접은 "이 이웃과 대화가 되는가", 경로는 "LSDB 전체를 보고 계산한 결과"다.
        이웃이 살아 있어도 그 너머가 끊겼으면 그쪽으로 보내지 않습니다.
        → cost 를 올려도 똑같은 증상이 납니다(6.2 에서 직접 해 봅니다). 그래서 지문이
        **cost 는 설계값 그대로**라고 못 박은 것입니다 — 그 가능성을 지우면 남는 것은 이것뿐입니다.
        → 제어 평면과 데이터 평면을 구분하는 감각. 6.3 에서 직접 봅니다.

    - id: q4
      type: single
      text: |
        r1 의 `eth2`(주 경로) cost 를 10 에서 200 으로 올렸습니다.
        pc1 → web 트래픽은 r3 를 경유하게 됐습니다. **web → pc1 방향**은 어떻게 되는가?
      choices:
        - "같이 r3 를 경유합니다. cost 는 링크 양쪽에 함께 적용되므로 경로는 항상 대칭이 됩니다"
        - "돌아올 경로가 없어져 통신이 끊깁니다"
        - "바뀌지 않습니다. cost 는 그 인터페이스로 나가는 방향에만 적용되므로 비대칭 경로가 됩니다"
        - "OSPF 가 LSA 로 알려 반대편 cost 도 자동으로 맞춥니다"
      answer: [2]
      explain: |
        **cost 는 인터페이스에서 나가는 방향의 비용**입니다. 한쪽만 바꾸면 경로가 비대칭이 됩니다.
        비대칭 자체가 장애는 아니지만, 방화벽·NAT 처럼 **상태를 기억하는 장비**가 경로에 있으면
        한쪽 방향만 지나가 세션이 깨집니다. 그래서 실무에서는 **양쪽을 함께** 조정합니다.

    - id: q5
      type: single
      text: "수렴(convergence)이란 무엇인가?"
      choices:
        - "경로 재계산이 끝나 라우터들의 CPU 사용률이 다시 안정되는 것"
        - "중복 경로가 정리돼 라우팅 테이블이 가장 작아진 상태가 되는 것"
        - "토폴로지 변화 후, 모든 라우터가 같은 그림을 갖고 각자 경로 계산을 마친 상태가 되는 것"
        - "모든 인접이 Full 이 되어 LSA 교환이 끝난 시점을 가리키는 것. 경로 계산과는 무관합니다"
      answer: [2]
      explain: |
        수렴이 끝나기 전에는 라우터마다 다른 그림을 갖고 있어 **루프나 블랙홀**이 생길 수 있습니다.
        그래서 "얼마나 빨리 수렴하는가"가 설계 품질의 핵심 지표입니다.
        측정 방법: 통신 중 링크를 끊고 **잃어버린 패킷 수를 센다** (6.1).

    - id: q6
      type: single
      text: |
        M3 에서 넣은 정적 경로를 **걷어내지 않은 채** OSPF 를 켰습니다. 무슨 일이 생기는가?
      choices:
        - "OSPF 가 학습한 경로가 정적 경로를 덮어써 정적 설정은 무시됩니다"
        - "AD 가 같아져 두 경로로 부하가 분산되고 트래픽이 절반씩 나뉩니다"
        - "같은 목적지에 경로가 둘이라 충돌로 판단해 OSPF 프로세스가 아예 켜지지 않고 오류 로그를 남깁니다"
        - "정적 경로(AD 1)가 OSPF(AD 110)를 이겨서 계속 쓰입니다. 링크가 끊겨도 우회하지 않습니다"
      answer: [3]
      explain: |
        AD 가 낮은 쪽이 이깁니다 (M3 의 D4).
        그래서 "OSPF 를 켰는데 왜 예전 경로로 가지?" 라는 상황이 생기고,
        원인이 OSPF 설정에 없기 때문에 **가장 찾기 어려운 부류**가 됩니다.
        전환 작업에서는 **정적을 걷어내는 것이 OSPF 를 켜는 것과 같은 작업 단위**다.

    - id: q7
      type: single
      text: "사용자망·서버망 쪽 인터페이스에 `ip ospf passive` 를 거는 이유는?"
      choices:
        - "그 대역은 광고하되 Hello 는 보내지 않기 위해 — 이웃이 없는 곳에 보낼 이유가 없습니다"
        - "그 대역을 OSPF 광고 대상에서 빼기 위해 — 사용자망은 밖에 알릴 필요가 없기 때문입니다"
        - "보안상 사용자망을 숨기기 위해 — 다른 AS 에 대역이 드러나지 않게 합니다"
        - "대역폭을 아끼기 위해 — Hello 와 LSA 가 사용자망을 잠식하는 것을 막습니다"
      answer: [0]
      explain: |
        광고는 그대로 됩니다(안 하면 아무도 그 대역을 모릅니다). **Hello 만 멈춥니다.**
        이유는 둘입니다 — ① 사용자망에 라우터가 없으니 낭비입니다
        ② **누군가 사용자망에 라우터를 꽂아 인접을 맺는 것을 막는다**(보안).

    - id: q8
      type: single
      text: "IGP 와 EGP(BGP)의 구분으로 가장 정확한 것은?"
      choices:
        - "IGP 는 수렴이 빠르고 EGP 는 느립니다. 속도 차이로 나눈 구분입니다"
        - "IGP 는 IPv4 용, EGP(BGP)는 IPv6 용으로 다루는 주소 체계에 따라 나뉩니다. 그래서 함께 씁니다"
        - "둘 다 최적 경로를 계산하며 이름과 표준 번호만 다를 뿐입니다"
        - "IGP 는 하나의 조직(AS) 안에서 최적 경로를, BGP 는 AS 와 AS 사이에서 정책에 따라 경로를 정합니다"
      answer: [3]
      explain: |
        OSPF 는 "가장 빠른 길"을 찾습니다. BGP 는 "**어느 길로 보낼 것인가**" 라는 정책을 다룹니다
        (계약·비용·경유 거부 등). 그래서 사내망에 BGP 를 쓰는 일은 드뭅니다.
        인터넷 경로는 전부 BGP 로 오갑니다 — M9 에서 경계를 다룰 때 다시 나옵니다.

    - id: q9
      type: single
      text: |
        경계 라우터에만 인터넷 기본 경로(`0.0.0.0/0`)가 있습니다.
        내부 라우터들이 그 기본 경로를 **OSPF 로 배우게** 하려면 무엇이 필요한가?
      choices:
        - "내부 라우터마다 기본 경로를 손으로 넣습니다. OSPF 로는 전달되지 않습니다"
        - "경계 라우터에서 `default-information originate` 를 설정합니다"
        - "OSPF 는 0.0.0.0/0 을 다룰 수 없으므로 기본 경로만은 정적으로 배포해야 합니다"
        - "BGP 를 켜서 외부 경로를 받아 와야 기본 경로가 전파됩니다"
      answer: [1]
      explain: |
        "나에게 default 가 있으니 내게 보내라" 를 OSPF 로 알리는 것입니다.
        이 한 줄이 없으면 내부 라우터들은 인터넷 방향을 모릅니다.
        → M9 에서 edge 를 붙일 때 실제로 씁니다.

    - id: q10
      type: short
      text: |
        r1 의 `eth2`(주 경로) cost 가 10, `eth3`(백업) cost 가 100 입니다.
        평상시 Site-B 트래픽은 어느 라우터를 경유하는가? (노드 이름 하나)
      answer: ["r2", "r2 라우터", "라우터 r2"]
      explain: |
        cost 가 작은 쪽이 이깁니다. 주 경로 합(10+10)이 백업(100+100)보다 훨씬 작습니다.
        **cost 는 "비용"이지 "속도"가 아니다** — 사람이 정하는 값이고, 그래서 설계 의도를 담을 수 있습니다.

checks:
  required: true
  items:
    - id: ospf-neighbors-r1
      kind: state
      title: "r1 의 OSPF 인접 2개(r2 · r3)가 모두 Full 인가 ★"
      host: r1
      run: "vtysh -c 'show ip ospf neighbor' | grep -c Full"
      expect: "2"
      hint: |
        인접이 안 서면 **순서대로** 볼 것 — ① Area ② 서브넷·마스크 ③ MTU ④ 인증·타이머
          vtysh -c 'show ip ospf neighbor'          현재 상태
          vtysh -c 'show ip ospf interface eth2'    area · cost · MTU · 타이머
        실습에서 내린 링크를 되돌리지 않았을 수도 있다: sudo ip link set eth2 up

    - id: ospf-neighbors-r4
      kind: state
      title: "r4 의 OSPF 인접 2개(r2 · r3)가 모두 Full 인가"
      host: r4
      run: "vtysh -c 'show ip ospf neighbor' | grep -c Full"
      expect: "2"
      hint: "반대편 끝도 봐야 합니다. 한쪽만 Full 인 상태는 존재하지 않습니다 — 양쪽 다 확인해 주세요."

    - id: ospf-learned
      kind: config
      title: "Site-B 대역을 OSPF(O)로 학습했는가 ★"
      host: r1
      run: "vtysh -c 'show ip route ospf'"
      expect_all: ["{{ cidr.vlan40 }}", "{{ p2p['r1-r2'].addresses.r2 }}"]
      hint: |
        정적으로 적어 준 것이 아니라 **배워 온** 경로여야 합니다.
        아무것도 안 나오면 인접부터 확인해 주세요.

    - id: no-static-left
      kind: config
      title: "손으로 넣은 정적 경로가 남아 있지 않은가 ★"
      host: r1
      run: "vtysh -c 'show ip route static'"
      expect_none: ["{{ zone['site-b'] }}", "blackhole"]
      hint: |
        정적(AD 1)이 남아 있으면 OSPF(AD 110)를 이겨서 **링크가 끊겨도 우회하지 않습니다.**
        sudo vtysh -c "conf t" -c "no ip route {{ zone['site-b'] }} {{ p2p['r1-r2'].addresses.r2 }}"
        또는 sudo systemctl restart frr (설정 파일 기준 원복)

    - id: primary-cost
      kind: config
      title: "주 경로 cost 가 설계값(10)인가"
      host: r1
      run: "vtysh -c 'show ip ospf interface eth2' | grep -oE 'Cost: [0-9]+'"
      # 부분 문자열로 비교하면 100 이 10 으로 통과한다. 줄 전체를 정확히 맞춘다.
      expect_regex: "(?m)^Cost: {{ p2p['r1-r2'].ospf_cost }}$"
      hint: |
        6.2 에서 올린 cost 를 되돌리지 않았을 수 있습니다.
        sudo vtysh -c "conf t" -c "interface eth2" -c "ip ospf cost {{ p2p['r1-r2'].ospf_cost }}"

    - id: backup-cost
      kind: config
      title: "백업 경로 cost 가 설계값(100)인가"
      host: r1
      run: "vtysh -c 'show ip ospf interface eth3' | grep -oE 'Cost: [0-9]+'"
      expect_regex: "(?m)^Cost: {{ p2p['r1-r3'].ospf_cost }}$"
      hint: |
        백업이 주 경로보다 싸면 평상시에도 백업으로 흐릅니다.
        sudo vtysh -c "conf t" -c "interface eth3" -c "ip ospf cost {{ p2p['r1-r3'].ospf_cost }}"

    - id: backup-mtu
      kind: config
      title: "6.4 에서 줄인 백업 링크 MTU 를 되돌렸는가"
      host: r1
      run: "cat /sys/class/net/eth3/mtu"
      expect: "1500"
      hint: |
        sudo ip link set eth3 mtu 1500
        MTU 가 다르면 인접이 ExStart/Exchange 에서 멈춥니다. 주 경로가 살아 있으면 **증상이 보이지 않는다** —
        이중화가 조용히 죽어 있는 상태로 다음 모듈에 갑니다.

    - id: primary-path
      kind: state
      title: "평상시 트래픽이 주 경로(r2)를 지나는가 ★"
      host: pc1
      run: "traceroute -n -w1 -q1 -m6 {{ ip.web }}"
      expect_all:
        - "{{ p2p['r1-r2'].addresses.r2 }}"
        - "{{ p2p['r2-r4'].addresses.r4 }}"
        - "{{ ip.web }}"
      expect_none:
        - "{{ p2p['r1-r3'].addresses.r3 }}"
        - "{{ p2p['r3-r4'].addresses.r4 }}"
      hint: |
        백업(r3)을 지나고 있다면 주 경로가 죽었거나 cost 가 뒤집힌 것입니다.
        r1 에서 show ip ospf neighbor 와 show ip ospf interface eth2 를 봐 주세요.

    - id: cross-site-http
      kind: connectivity
      title: "pc1 → web HTTP 응답이 오는가"
      host: pc1
      run: "curl -sS -m5 -i http://{{ ip.web }}/health"
      expect_all: ["200", "X-Lab-Node: web", "ok"]
      hint: "경로가 바뀌어도 통신은 유지돼야 합니다. 끊겼다면 수렴이 끝나지 않았거나 경로가 없습니다."

written:
  items:
    - id: static-to-ospf
      title: "정적 경로였다면 — OSPF 와 무엇이 다른가 ★"
      kind: text
      review: optional
      auto_pass: true
      min_chars: 300
      prompt: |
        지금 이 랩은 라우터 4대가 OSPF 로 서로를 배우고 있습니다.
        **OSPF 없이 정적 경로만으로** 같은 도달성을 만든다고 가정하고 비교해 적을 것.
        교과서 정의가 아니라 **이 랩에서 직접 본 것**을 근거로 씁니다.

          1. 설정량 — 정적이라면 라우터마다 몇 줄이 필요한가, 지금은 무엇을 적었는가
          2. 링크를 끊었을 때 — 정적이라면 어떻게 되는가, 실제로는 어떻게 됐는가
          3. 수렴 — 몇 개의 패킷을 잃었는가, 무엇으로 측정했는가
          4. cost — 경로를 의도대로 바꿔 본 결과와, 그때 **반대 방향**은 어떻게 됐는가
          5. 정적 경로가 남아 있는 채로 OSPF 를 켜면 어느 쪽이 쓰이는가, 그 이유는
      rubric:
        - key: 설정량
          desc: "설정 방식의 차이를 구체적으로 적었는가"
          any: ["정적", "static", "줄", "직접 적", "손으로", "자동"]

# M4 평가 — 퀴즈(만들면서 본 화면) + 검사(정적이 사라지고 O 로 학습하는가 · 뒷정리) + 서술
quiz:
  pass_score: 100
  questions:
    # ── 3장에서 한 대씩 켜며 직접 본 화면을 그대로 지문으로 쓴다 ──────────
    - id: q1
      type: single
      text: |
        3.1 에서 아직 아무것도 안 켠 `r1` 에 `show ip ospf neighbor` 를 쳤더니
        표가 아니라 이 한 줄이 나왔습니다.
        `% OSPF is not enabled in vrf default.`
        이 화면이 뜻하는 것은?
      choices:
        - "이웃이 하나도 없다는 뜻입니다. 켜져는 있으므로 상대 쪽을 봐야 합니다"
        - "OSPF 를 아직 켜지 않았다는 뜻입니다. 인접이 없는 것과는 다른 화면입니다"
        - "vrf 설정이 빠져 있다는 뜻입니다. 기본 vrf 를 먼저 만들어야 합니다"
        - "인접이 서는 중이라는 뜻입니다. 잠시 뒤에 다시 치면 표가 나옵니다"
      answer: [1]
      explain: |
        켜고 나면 같은 명령이 **표**를 내놓습니다. 그때 비어 있는 표가 "이웃이 없다" 입니다.
        지금은 표 자체가 없습니다 — 프로세스가 없다는 뜻입니다.
        이 둘을 구분하지 못하면 3.3 에서 인접이 안 설 때 엉뚱한 곳을 팝니다 (3.1).

    - id: q2
      type: multi
      text: |
        OSPF 인접(Neighbor)이 맺히지 않을 때 **양쪽에서 같아야 하는 것**을 모두 고르시오.
      choices:
        - "인터페이스의 area ID"
        - "인터페이스의 MTU"
        - "서브넷과 마스크"
        - "Hello · Dead 타이머와 인증"
        - "라우터의 router-id"
      answer: [0, 1, 2, 3]
      explain: |
        확인 순서까지 함께 외워 둘 것 — 위쪽일수록 흔하고, 위쪽일수록 확인이 쌉니다.
          ① area  ② 서브넷·마스크  ③ MTU  ④ 인증·타이머
        router-id 는 반대로 **달라야** 합니다. 겹치면 인접이 붙었다 끊겼다 합니다 (2.3 · 5.6).

    - id: q3
      type: single
      text: |
        인접 상태가 `ExStart` 또는 `Exchange` 에서 더 나아가지 않습니다.
        가장 먼저 의심할 것은?
      choices:
        - "area ID 불일치"
        - "인증 실패"
        - "케이블 불량"
        - "MTU 불일치"
      answer: [3]
      explain: |
        area 나 인증이 다르면 아예 `Init` 이하에서 멈추거나 인접이 목록에 안 보입니다.
        `ExStart`/`Exchange` 는 지도 요약(DBD)을 주고받는 단계이고, 이때 서로의 MTU 를 확인합니다.
        **멈춘 위치가 원인을 말해 줍니다** — 이것이 OSPF 진단의 가장 강력한 단서입니다 (2.3 · 6.4).

    - id: q4
      type: single
      text: |
        `r1` 에서 `show ip ospf neighbor` 를 보니 State 가 `Full/Backup`, `r2` 에서 보니
        `Full/DR` 입니다. 통신은 됩니다. 이 화면이 말해 주는 것은?
      choices:
        - "그 링크를 broadcast 로 보고 있어 대표를 뽑은 것입니다. `ip ospf network point-to-point` 를 안 걸었습니다"
        - "둘 중 하나가 area 를 잘못 넣어 한쪽만 대표가 된 것입니다. area 부터 맞춰야 합니다"
        - "cost 가 서로 달라 우선순위가 갈린 것입니다. 양쪽 cost 를 같게 맞춰야 합니다"
        - "인접이 아직 다 서지 않은 중간 상태입니다. 잠시 기다리면 양쪽 다 `Full/-` 이 됩니다"
      answer: [0]
      explain: |
        State 칸의 `/` 뒤가 붙어 있으면 그 선을 **broadcast 로 보고 있다**는 뜻입니다.
        `/-` 는 "대표를 안 뽑는 선" 입니다.
        이 랩의 라우터 간 링크는 전부 `/30` 이라 붙을 수 있는 것이 둘뿐입니다 —
        뽑을 이유가 없으므로 인터페이스에 `ip ospf network point-to-point` 를 적어 알려 줍니다.
        고장은 아니지만 선출이 한 번씩 돌고, 장애 때 볼 것이 하나 늘어납니다 (2.6).

    - id: q5
      type: single
      text: |
        router-id 를 루프백 주소(`{{ loopback.r1 }}` 등)로 못 박는 이유로 맞는 것은?
      choices:
        - "루프백이 가장 작은 주소라 OSPF 가 그것을 먼저 고르기 때문입니다"
        - "router-id 는 통신에 쓰이므로 어느 포트가 죽어도 닿는 주소여야 하기 때문입니다"
        - "정해 주지 않으면 장비가 아무 주소나 골라 쓰고, 그 포트가 내려가면 이름이 바뀌기 때문입니다"
        - "area 0 에는 루프백을 넣어야 한다는 것이 표준의 요구사항이기 때문입니다"
      answer: [2]
      explain: |
        router-id 는 지도 위의 **이름표**이지 통신에 쓰는 주소가 아닙니다.
        이름이 바뀌면 지도가 통째로 다시 그려지고 인접이 전부 다시 섭니다.
        루프백은 물리 포트가 아니라 내려갈 일이 없으므로 이름표로 알맞습니다 (2.4).

    - id: q6
      type: single
      text: |
        사용자망 쪽 인터페이스(`r1` 의 `eth1.10`)에 `ip ospf passive` 를 걸었습니다.
        무엇이 어떻게 되는가?
      choices:
        - "그 대역이 광고 대상에서 빠집니다. 사용자망은 밖에 알릴 필요가 없기 때문입니다"
        - "그 대역은 광고되고, Hello 만 나가지 않습니다"
        - "그 대역으로 오는 트래픽만 받고 나가는 트래픽은 막습니다"
        - "그 포트의 cost 가 최대값이 되어 경로 계산에서 마지막으로 밀립니다"
      answer: [1]
      explain: |
        광고는 그대로입니다 — 안 하면 아무도 그 대역을 모릅니다. **Hello 만 멈춥니다.**
        이유는 둘입니다. 라우터가 없는 곳에 보내는 것은 낭비이고,
        누군가 사용자망에 라우터를 꽂아 인접을 맺는 것을 막습니다.
        적는 자리는 `router ospf` 절이 아니라 **인터페이스 절**입니다 — FRR 8 부터
        `passive-interface` 는 deprecated 입니다 (2.7).

    - id: q7
      type: single
      text: |
        6.2 에서 `r1` 의 `eth2`(주 경로) cost 만 10 에서 200 으로 올렸습니다.
        `pc1` → `web` 은 `r3` 를 경유하게 됐습니다. **`web` → `pc1` 방향**은 어떻게 되는가?
      choices:
        - "같이 `r3` 를 경유합니다. cost 는 링크 양쪽에 함께 적용되기 때문입니다"
        - "돌아올 경로가 없어져 통신이 끊깁니다"
        - "OSPF 가 LSA 로 알려 반대편 cost 도 자동으로 맞춥니다"
        - "바뀌지 않습니다. cost 는 나가는 방향에만 적용되므로 비대칭 경로가 됩니다"
      answer: [3]
      explain: |
        cost 는 **그 인터페이스에서 나가는 방향**의 비용입니다. 한쪽만 바꾸면 경로가 비대칭이 됩니다.
        비대칭 자체가 장애는 아닙니다. 다만 방화벽·NAT 처럼 **상태를 기억하는 장비**가 경로에
        있으면 한쪽 방향만 지나가 세션이 깨집니다. 그래서 실무에서는 양쪽을 함께 조정합니다 (2.5 · 6.2).

    - id: q8
      type: single
      text: |
        `r1` 에서 `r2` 와의 인접은 `Full` 입니다. 그런데 `show ip route` 를 보면
        Site-B 로 가는 경로가 `r3` 를 거치고 있습니다.
        **cost 는 양쪽 다 설계값 그대로입니다.** 무엇이 일어난 것인가?
      choices:
        - "`r2` 너머의 링크가 끊겨, 지도상 `r2` 를 통한 경로가 유효하지 않게 됐습니다"
        - "출력이 낡은 것입니다. `show` 를 다시 쳐 보면 `r2` 로 돌아와 있습니다"
        - "`r2` 와의 cost 가 내부적으로 재계산돼 백업이 더 싸진 것입니다"
        - "인접이 `Full` 인데 경로가 다른 것은 있을 수 없어 두 출력이 서로 모순입니다"
      answer: [0]
      explain: |
        **인접 상태와 경로 선택은 다른 이야기입니다.**
        인접은 "이 이웃과 대화가 되는가", 경로는 "지도 전체를 보고 계산한 결과" 입니다.
        이웃이 살아 있어도 그 너머가 끊겼으면 그쪽으로 보내지 않습니다.
        지문이 **cost 는 설계값 그대로**라고 못 박은 것은 그 가능성을 지우기 위한 것입니다 (2.9 · 6.3).

    - id: q9
      type: single
      text: |
        3.7 에서 정적 경로를 걷어내기 **전에는**, 네 라우터가 다 `Full` 이 된 뒤에도
        `pc1` → `web` 트래픽이 계속 정적 경로로 갔습니다. 왜인가?
      choices:
        - "OSPF 가 아직 수렴 중이라 계산이 끝나지 않았기 때문입니다"
        - "정적 경로(AD 1)가 OSPF(AD 110)를 이기기 때문입니다"
        - "같은 목적지에 경로가 둘이면 먼저 들어온 쪽이 남기 때문입니다"
        - "정적 경로가 요약 대역이라 더 긴 prefix 로 취급되기 때문입니다"
      answer: [1]
      explain: |
        AD 가 낮은 쪽이 이깁니다 (M3 에서 본 그 규칙입니다).
        그래서 "OSPF 를 켰는데 왜 예전 경로로 가지?" 가 생기고, 원인이 OSPF 설정 안에 없기 때문에
        **가장 찾기 어려운 부류**가 됩니다.
        전환 작업에서는 정적을 걷어내는 것이 OSPF 를 켜는 것과 **같은 작업 단위**입니다 (2.8 · 3.7).

    - id: q10
      type: single
      text: |
        6.1 에서 `r1` 의 `eth2` 를 내리자 패킷 두어 개만 빠지고 곧 `r3` 로 넘어갔습니다.
        6.3 에서 **상대(`r2`)만 죽였을 때는** 훨씬 오래 걸렸습니다. 그 차이의 이유는?
      choices:
        - "내 포트가 죽으면 즉시 알고, 상대만 죽으면 Dead timer 만료를 기다리기 때문입니다"
        - "포트를 내리면 LSA 가 먼저 나가고, 상대가 죽으면 그것을 만들어 줄 장비가 없기 때문입니다"
        - "내 포트를 내리면 경로가 하나 남고, 상대가 죽으면 두 경로를 다시 계산해야 하기 때문입니다"
        - "포트를 내리는 것은 계획된 변경이라 OSPF 가 미리 준비해 두기 때문입니다"
      answer: [0]
      explain: |
        감지 방법이 둘이고, 걸리는 시간이 다릅니다.
        내 쪽 포트가 죽으면 즉시, 링크는 UP 인데 상대만 조용하면 Dead timer({{ routing.ospf.timers.dead }}초)입니다.
        실무에서 무서운 것은 두 번째입니다 — 중간에 L2 스위치가 있으면 상대가 죽어도 내 포트는
        UP 으로 남고, 그동안 트래픽은 블랙홀로 들어갑니다 (2.9 · 6.3).

    - id: q11
      type: single
      text: "IGP(OSPF)와 EGP(BGP)의 구분으로 가장 정확한 것은?"
      choices:
        - "IGP 는 수렴이 빠르고 EGP 는 느립니다. 속도 차이로 나눈 구분입니다"
        - "IGP 는 IPv4 용, EGP 는 IPv6 용이라 다루는 주소 체계에 따라 나뉩니다"
        - "IGP 는 조직(AS) 안에서 빠른 길을, BGP 는 AS 사이에서 정책으로 경로를 정합니다"
        - "둘 다 최적 경로를 계산하며 이름과 표준 번호만 다른 같은 부류입니다"
      answer: [2]
      explain: |
        OSPF 는 "가장 빠른 길" 을 찾습니다. BGP 는 "**어느 길로 보낼 것인가**" 라는 정책을 다룹니다
        (계약 · 비용 · 경유 거부). 사내에는 정책이랄 것이 없어 BGP 를 쓰는 일이 드뭅니다.
        인터넷 경로는 전부 BGP 로 오갑니다 (2.10).

    - id: q12
      type: short
      text: |
        라우터 간 링크에 `ip ospf network point-to-point` 를 걸어 두면
        `show ip ospf neighbor` 의 State 칸은 무엇으로 보이는가? (화면 그대로)
      answer: ["Full/-", "full/-", "Full / -", "FULL/-"]
      explain: |
        `/-` 는 "대표(DR)를 안 뽑는 선" 이라는 뜻입니다.
        여기에 `DR` 이나 `Backup` 이 찍혀 있으면 그 선을 아직 broadcast 로 보고 있는 것입니다 (2.6 · 3.3).

checks:
  required: true
  items:
    - id: ospf-neighbors-r1
      kind: state
      title: "r1 의 OSPF 인접 2개(r2 · r3)가 모두 Full 인가 ★"
      host: r1
      run: "vtysh -c 'show ip ospf neighbor' | grep -c Full"
      expect: "2"
      hint: |
        인접이 안 서면 **순서대로** 볼 것 — ① Area ② 서브넷·마스크 ③ MTU ④ 인증·타이머
          vtysh -c 'show ip ospf neighbor'          현재 상태
          vtysh -c 'show ip ospf interface eth2'    area · cost · MTU · 타이머
        실습에서 내린 링크를 되돌리지 않았을 수도 있다: sudo ip link set eth2 up

    - id: ospf-neighbors-r4
      kind: state
      title: "r4 의 OSPF 인접 2개(r2 · r3)가 모두 Full 인가"
      host: r4
      run: "vtysh -c 'show ip ospf neighbor' | grep -c Full"
      expect: "2"
      hint: "반대편 끝도 봐야 합니다. 한쪽만 Full 인 상태는 존재하지 않습니다 — 양쪽 다 확인해 주세요."

    - id: ospf-learned
      kind: config
      title: "Site-B 대역을 OSPF(O)로 학습했는가 ★"
      host: r1
      run: "vtysh -c 'show ip route ospf'"
      expect_all: ["{{ cidr.vlan40 }}", "{{ p2p['r1-r2'].addresses.r2 }}"]
      hint: |
        정적으로 적어 준 것이 아니라 **배워 온** 경로여야 합니다.
        아무것도 안 나오면 인접부터 확인해 주세요.

    - id: no-static-left
      kind: config
      title: "손으로 넣은 정적 경로가 남아 있지 않은가 ★"
      host: r1
      run: "vtysh -c 'show ip route static'"
      expect_none: ["{{ zone['site-b'] }}", "blackhole"]
      hint: |
        정적(AD 1)이 남아 있으면 OSPF(AD 110)를 이겨서 **링크가 끊겨도 우회하지 않습니다.**
        sudo vtysh -c "conf t" -c "no ip route {{ zone['site-b'] }} {{ p2p['r1-r2'].addresses.r2 }}"
        또는 sudo systemctl restart frr (설정 파일 기준 원복)

    - id: primary-cost
      kind: config
      title: "주 경로 cost 가 설계값(10)인가"
      host: r1
      run: "vtysh -c 'show ip ospf interface eth2' | grep -oE 'Cost: [0-9]+'"
      # 부분 문자열로 비교하면 100 이 10 으로 통과한다. 줄 전체를 정확히 맞춘다.
      expect_regex: "(?m)^Cost: {{ p2p['r1-r2'].ospf_cost }}$"
      hint: |
        6.2 에서 올린 cost 를 되돌리지 않았을 수 있습니다.
        sudo vtysh -c "conf t" -c "interface eth2" -c "ip ospf cost {{ p2p['r1-r2'].ospf_cost }}"

    - id: backup-cost
      kind: config
      title: "백업 경로 cost 가 설계값(100)인가"
      host: r1
      run: "vtysh -c 'show ip ospf interface eth3' | grep -oE 'Cost: [0-9]+'"
      expect_regex: "(?m)^Cost: {{ p2p['r1-r3'].ospf_cost }}$"
      hint: |
        백업이 주 경로보다 싸면 평상시에도 백업으로 흐릅니다.
        sudo vtysh -c "conf t" -c "interface eth3" -c "ip ospf cost {{ p2p['r1-r3'].ospf_cost }}"

    - id: backup-mtu
      kind: config
      title: "6.4 에서 줄인 백업 링크 MTU 를 되돌렸는가"
      host: r1
      run: "cat /sys/class/net/eth3/mtu"
      expect: "1500"
      hint: |
        sudo ip link set eth3 mtu 1500
        MTU 가 다르면 인접이 ExStart/Exchange 에서 멈춥니다. 주 경로가 살아 있으면 **증상이 보이지 않는다** —
        이중화가 조용히 죽어 있는 상태로 다음 모듈에 갑니다.

    - id: p2p-network-type
      kind: config
      title: "라우터 간 링크를 point-to-point 로 알려 줬는가"
      host: r1
      run: "vtysh -c 'show ip ospf interface eth2' | grep -o 'Network Type [A-Z]*'"
      expect: "Network Type POINTOPOINT"
      hint: |
        BROADCAST 로 남아 있으면 인접 State 가 `Full/DR` · `Full/Backup` 으로 보입니다 (2.6).
        sudo vtysh -c "conf t" -c "interface eth2" -c "ip ospf network point-to-point"
        **양쪽 다** 걸어야 합니다. 한쪽만 걸면 인접이 아예 안 섭니다.

    - id: user-net-passive
      kind: config
      title: "사용자망으로 Hello 가 나가지 않는가 (passive)"
      host: r1
      run: "vtysh -c 'show ip ospf interface eth1.10' | grep -c 'Passive'"
      expect_regex: "^[1-9]"
      hint: |
        라우터가 없는 곳에 Hello 를 보낼 이유가 없고, 누가 라우터를 꽂아 인접을 맺는 것도 막습니다.
        sudo vtysh -c "conf t" -c "interface eth1.10" -c "ip ospf passive"
        `router ospf` 절의 `passive-interface` 는 FRR 8 부터 deprecated 입니다 (2.7).

    - id: primary-path
      kind: state
      title: "평상시 트래픽이 주 경로(r2)를 지나는가 ★"
      host: pc1
      run: "traceroute -n -w1 -q1 -m6 {{ ip.web }}"
      expect_all:
        - "{{ p2p['r1-r2'].addresses.r2 }}"
        - "{{ p2p['r2-r4'].addresses.r4 }}"
        - "{{ ip.web }}"
      expect_none:
        - "{{ p2p['r1-r3'].addresses.r3 }}"
        - "{{ p2p['r3-r4'].addresses.r4 }}"
      hint: |
        백업(r3)을 지나고 있다면 주 경로가 죽었거나 cost 가 뒤집힌 것입니다.
        r1 에서 show ip ospf neighbor 와 show ip ospf interface eth2 를 봐 주세요.

    - id: cross-site-http
      kind: connectivity
      title: "pc1 → web HTTP 응답이 오는가"
      host: pc1
      run: "curl -sS -m5 -i http://{{ ip.web }}/health"
      expect_all: ["200", "X-Lab-Node: web", "ok"]
      hint: "경로가 바뀌어도 통신은 유지돼야 합니다. 끊겼다면 수렴이 끝나지 않았거나 경로가 없습니다."

written:
  items:
    - id: static-to-ospf
      title: "정적 경로였다면 — OSPF 와 무엇이 다른가 ★"
      kind: text
      review: optional
      auto_pass: true
      min_chars: 300
      prompt: |
        지금 이 랩은 라우터 4대가 OSPF 로 서로를 배우고 있습니다.
        **OSPF 없이 정적 경로만으로** 같은 도달성을 만든다고 가정하고 비교해 적을 것.
        교과서 정의가 아니라 **이 랩에서 직접 본 것**을 근거로 씁니다.

          1. 설정량 — 정적이라면 라우터마다 몇 줄이 필요한가, 지금은 무엇을 적었는가
          2. 링크를 끊었을 때 — 정적이라면 어떻게 되는가, 실제로는 어떻게 됐는가
          3. 수렴 — 몇 개의 패킷을 잃었는가, 무엇으로 측정했는가
          4. cost — 경로를 의도대로 바꿔 본 결과와, 그때 **반대 방향**은 어떻게 됐는가
          5. 정적 경로가 남아 있는 채로 OSPF 를 켜면 어느 쪽이 쓰이는가, 그 이유는
      rubric:
        - key: 설정량
          desc: "설정 방식의 차이를 구체적으로 적었는가"
          any: ["정적", "static", "줄", "직접 적", "손으로", "자동"]
        - key: 장애대응
          desc: "링크 장애 시 동작 차이를 적었는가"
          any: ["링크", "끊", "장애", "우회", "백업", "down"]
        - key: 수렴측정
          desc: "수렴을 숫자나 관측으로 말했는가"
          any: ["패킷", "손실", "수렴", "convergence", "개를 잃", "개 잃", "ms", "재수렴"]
        - key: cost
          desc: "cost 로 경로를 유도한 경험을 적었는가"
          any: ["cost", "코스트", "비용", "경로 유도", "우선"]
        - key: 전환주의
          desc: "전환 시 주의점(AD·정적 잔여 등)을 짚었는가"
          any: ["AD", "distance", "정적을 지", "정적 경로를 걷", "남아 있", "우선순위", "110", "이긴다"]

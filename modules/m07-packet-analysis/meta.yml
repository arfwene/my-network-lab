id: m07
title: "패킷 분석 — tcpdump 심화"
stage: m7
duration: "3시간"
competencies: [H1, H2, H3, H4, A2]
summary: "필터 문법이 아니라 캡처 지점 선정이 실력의 본질입니다. 여러 지점에서 동시에 떠서 패킷이 사라지는 구간을 특정합니다."
objectives:
  - "문제를 좁히기 위해 어디서 캡처해야 하는지 스스로 결정할 수 있습니다 (H1) ★"
  - "BPF 필터를 조합해 필요한 패킷만 추출할 수 있습니다 (H2)"
  - "다중 지점 동시 캡처로 패킷이 소실되는 구간을 특정할 수 있습니다 (H3)"
  - "pcap 을 저장·전달하고 Wireshark 로 스트림을 재구성해 해석할 수 있습니다 (H4)"
  - "캡처한 프레임에서 Ethernet / IP / TCP / 페이로드의 경계를 바이트 단위로 지목할 수 있습니다 (A2)"

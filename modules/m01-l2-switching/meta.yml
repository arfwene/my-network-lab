id: m01
title: "랜선 한 가닥부터 — L1/L2와 스위칭"
stage: m1
duration: "3시간"
competencies: [B1, B2, B4, B6, A3]
summary: "링크가 살아 있다는 것부터 시작해, 스위치가 MAC 을 학습하고 플러딩하는 과정을 패킷으로 직접 확인합니다."
objectives:
  - "인터페이스 상태와 카운터를 읽고 물리 계층 이상 여부를 1차 판정할 수 있습니다 (B1)"
  - "스위치의 MAC 학습·플러딩·에이징을 설명하고 MAC 테이블로 다음 홉 포트를 예측할 수 있습니다 (B2)"
  - "ARP 동작을 설명하고 ARP 테이블을 근거로 L2 도달성을 판정할 수 있습니다 (B4)"
  - "브로드캐스트 도메인과 충돌 도메인을 구분할 수 있습니다"
  - "L2 루프가 왜 치명적인지 설명하고 STP 의 역할을 말할 수 있습니다 (B6)"

# M1 평가 — 퀴즈(개념) + 검사(실습을 실제로 했는가 · 뒷정리를 했는가)
quiz:
  pass_score: 100
  questions:
    - id: q1
      type: single
      text: |
        인터페이스 상태가 아래와 같습니다. 무엇을 의심해야 하는가?
        `eth1  DOWN  52:54:00:11:00:01 <NO-CARRIER,BROADCAST,MULTICAST,UP>`
      choices:
        - "관리자가 인터페이스를 내려 둔 상태입니다. 설정에서 admin down 을 풉니다"
        - "IP 주소가 배정되지 않았습니다. 주소와 마스크를 넣습니다"
        - "켜져 있는데 상대가 없습니다. 케이블·트랜시버·상대 포트를 봅니다"
        - "기본 경로가 없습니다. 게이트웨이를 향하는 경로를 넣습니다"
      answer: [2]
      explain: |
        UP 플래그는 있는데 NO-CARRIER 다 = 관리적으로는 켜져 있으나 물리적으로 상대가 없습니다.
        UP 플래그 자체가 없으면 그때가 "내가 껐다"는 뜻입니다. 이 구분이 실무 1차 판정입니다.

    - id: q2
      type: multi
      text: "스위치가 프레임을 **모든 포트로 내보내는** 경우를 모두 고르시오."
      choices:
        - "목적지 MAC 이 MAC 테이블에 있는 경우 — 그 포트로만 보냅니다"
        - "출발지 MAC 이 MAC 테이블에 없는 경우 — 학습만 하고 전달은 평소대로입니다"
        - "목적지 MAC 이 ff:ff:ff:ff:ff:ff 인 경우"
        - "목적지 MAC 이 MAC 테이블에 없는 경우"
      answer: [2, 3]
      explain: |
        브로드캐스트와 미학습 유니캐스트(unknown unicast)다.
        결과는 같지만 이유가 다릅니다. 출발지 MAC 은 학습에 쓰일 뿐 전달 판단에 쓰이지 않습니다.

    - id: q3
      type: single
      text: "ARP Request 는 브로드캐스트인데 ARP Reply 는 유니캐스트입니다. 왜인가?"
      choices:
        - "Request 시점에는 상대 MAC 을 모르지만, Reply 시점에는 요청 프레임에서 이미 알았기 때문"
        - "Reply 를 브로드캐스트로 보내면 스위치가 출발지 MAC 을 학습하지 못해 통신이 느려지기 때문"
        - "표준이 그렇게 정했을 뿐 기술적 이유는 없습니다. 브로드캐스트로 보내는 구현도 있습니다"
        - "이더넷에서 브로드캐스트는 요청에만 쓸 수 있고 응답 프레임에는 규격상 쓸 수 없기 때문"
      answer: [0]
      explain: "브로드캐스트는 비쌉니다. 꼭 필요할 때만 쓴다는 원칙이 그대로 드러나는 사례입니다."

    - id: q4
      type: single
      text: "`ip neigh show` 에 상대가 REACHABLE 로 보입니다. 이것으로 알 수 **없는** 것은?"
      choices:
        - "상대가 같은 L2 세그먼트에 살아 있습니다"
        - "상대가 ARP 에 응답했습니다"
        - "상대의 80번 포트가 열려 있습니다"
        - "상대의 MAC 주소"
      answer: [2]
      explain: "ip neigh 는 L2 도달성의 증거일 뿐입니다. 포트·서비스는 L4 이상에서 따로 확인해야 합니다."

    - id: q5
      type: single
      text: "L2 루프가 IP 라우팅 루프보다 위험한 이유는?"
      choices:
        - "L2 는 하드웨어로 처리돼 소프트웨어보다 훨씬 빠르게 순환하기 때문"
        - "이더넷 프레임에는 TTL 이 없어 프레임이 영원히 돌며 증식하기 때문"
        - "스위치는 라우터와 달리 루프를 감지하는 기능 자체가 없기 때문"
        - "MAC 주소는 재사용되므로 같은 주소가 여러 포트에서 학습되기 때문"
      answer: [1]
      explain: |
        IP 는 TTL 이 0 이 되면 스스로 끊깁니다. 이더넷에는 그 장치가 없습니다.
        스위치가 여러 포트로 복제하므로 기하급수적으로 늘어 몇 초 만에 망이 마비됩니다. → STP 가 필요한 이유.

    - id: q6
      type: short
      text: "L2 스위치 10대를 서로 연결했습니다. 브로드캐스트 도메인은 몇 개인가? (숫자만)"
      answer: ["1", "1개", "1 개", "한개", "한 개", "하나"]
      explain: |
        스위치를 아무리 늘려도 브로드캐스트 도메인은 나뉘지 않습니다.
        나누려면 VLAN(M2) 이나 라우터(M2) 가 필요합니다.

    # ── MAC 테이블로 다음 홉 예측 ────────────────────────────────────
    #    답이 포트 이름 하나로 정해지는 것들이다. 낼 곳이 없는 표로 두는 것보다
    #    여기서 바로 채점받는 편이 낫다.
    - id: q7
      type: short
      text: |
        `sw1` 의 MAC 테이블이 아래와 같습니다.
        `{{ mac.pc1 }} dev eth1` · `{{ mac.pc2 }} dev eth2`
        **eth1** 로 들어온 프레임의 목적지 MAC 이 `{{ mac.pc2 }}` 라면 어느 포트로 나가는가? (포트 이름만)
      answer: ["eth2"]
      explain: |
        목적지가 테이블에 있으므로 **그 포트로만** 보냅니다.
        이것이 스위치가 허브와 다른 점입니다 — 나머지 포트는 이 프레임을 보지 못합니다.

    - id: q8
      type: single
      text: |
        같은 테이블에서 **eth1** 로 브로드캐스트 프레임(`ff:ff:ff:ff:ff:ff`)이 들어왔습니다.
        sw1 은 어떻게 하는가?
      choices:
        - "들어온 eth1 을 뺀 나머지 **모든** 포트로 내보냅니다"
        - "테이블에 없는 주소이므로 버립니다"
        - "eth2 로만 보냅니다 — 브로드캐스트도 학습된 포트를 씁니다"
        - "라우터에게 넘겨 처리하게 합니다"
      answer: [0]
      explain: |
        브로드캐스트는 학습 대상이 아닙니다. 들어온 포트만 빼고 전부 내보냅니다.
        **이 범위가 곧 브로드캐스트 도메인**이고, 스위치를 아무리 늘려도 나뉘지 않습니다.

    - id: q9
      type: single
      text: |
        같은 테이블에서 **eth2** 로 들어온 프레임의 목적지 MAC 이 `{{ fake_mac }}` 입니다.
        테이블에 없는 주소일 때 sw1 은 어떻게 하는가?
      choices:
        - "들어온 eth2 를 뺀 나머지 모든 포트로 내보냅니다 (unknown unicast flooding)"
        - "버립니다. 모르는 주소로는 보내지 않습니다"
        - "ARP 로 먼저 물어본 뒤 보냅니다"
        - "eth1 로 보냅니다. 학습된 포트가 그쪽뿐이기 때문입니다"
      answer: [0]
      explain: |
        모르면 **버리는 것이 아니라 뿌립니다.**
        유니캐스트인데도 전 포트로 나가므로 캡처에서는 브로드캐스트처럼 보입니다 — 실습 2 에서 본 그 장면입니다.

    - id: q10
      type: short
      text: |
        같은 테이블에서 **eth3** 으로 들어온 프레임의 목적지 MAC 이 `{{ mac.pc1 }}` 이라면
        어느 포트로 나가는가? (포트 이름만)
      answer: ["eth1"]
      explain: |
        들어온 포트가 어디든 판단 기준은 **목적지 MAC 이 테이블에 있는가** 하나입니다.
        출발지 MAC 은 학습에만 쓰이고 전달 판단에는 쓰이지 않습니다.

    # ── 2.7 중복 IP · 실습 7 ────────────────────────────────────────────
    - id: q11
      type: single
      text: |
        같은 세그먼트에 같은 IP 를 쓰는 장비가 둘 생겼습니다. 가장 흔한 증상은?
      choices:
        - "**간헐적**으로 된다 안 된다 합니다 — 어느 쪽 ARP 응답이 마지막이었는지에 달렸습니다"
        - "둘 다 즉시 통신이 끊깁니다. 커널이 주소를 회수하기 때문입니다"
        - "스위치가 감지해서 나중에 켜진 쪽 포트를 차단합니다"
        - "링크가 내려갑니다. 물리 계층에서 먼저 걸립니다"
      answer: [0]
      explain: |
        ARP 에는 **검증 절차가 없습니다.** 물어보면 둘 다 답하고, 물어본 쪽 캐시에는 나중에 온 답이 남습니다.
        그래서 링크도 정상, 스위치 MAC 테이블도 정상인데 **통신만 오락가락**합니다.
        가장 아픈 경우는 게이트웨이 주소가 겹쳤을 때입니다 — 그 세그먼트의 바깥 통신 전부가 흔들립니다.

    - id: q12
      type: short
      text: |
        주소를 손으로 주기 전에 **"이 주소 쓰는 사람 있나"** 를 물어보는 명령입니다.
        빈칸에 들어갈 옵션은? (옵션 한 글자만, `-` 포함)
        `sudo arping ___ -c 2 -I eth1 10.0.0.5`
      answer: ["-D", "D", "-d"]
      explain: |
        `-D` 는 Duplicate Address Detection 입니다. 쓰는 사람이 있으면 **종료 코드 1** 과 함께
        그 장비의 MAC 을 알려 줍니다. IPv6 가 표준으로 하는 DAD(M5)를 IPv4 에서 손으로 하는 셈입니다.
        한 줄이면 끝나고, 안 치면 며칠을 잡아먹습니다.



checks:
  required: true
  items:
    - id: links-up
      kind: state
      title: "pc1·pc2 의 서비스망 링크가 살아 있는가"
      host: pc1
      run: "cat /sys/class/net/eth1/operstate"
      expect: "up"
      hint: "sudo ip link set eth1 up"

    - id: same-subnet-ping
      kind: connectivity
      title: "pc1 → pc2 같은 대역 통신이 되는가"
      host: pc1
      run: "ping -c2 -W2 {{ ip.pc2 }} >/dev/null && echo REACHABLE"
      expect: "REACHABLE"
      hint: "링크·주소·스위치 포트 순서로 확인해 주세요. bridge link show 도 봐 주세요."

    - id: switch-learned
      kind: state
      title: "sw1 이 pc1 과 pc2 의 MAC 을 학습했는가"
      host: sw1
      run: "bridge fdb show br br0 | grep -v permanent"
      expect_all: ["{{ mac.pc1 }}", "{{ mac.pc2 }}"]
      hint: |
        학습은 통신이 일어나야 생깁니다. pc1 에서 pc2 로 ping 을 한 번 보낸 뒤 다시 확인해 주세요.
        (에이징 타임이 지나면 사라집니다)

    - id: switch-ports
      kind: config
      title: "sw1 의 eth1·eth2 가 브리지에 연결돼 있는가"
      host: sw1
      run: "bridge link show"
      expect_all: ["eth1", "eth2"]
      hint: "sudo systemctl restart lab-switch 로 스위칭 설정을 다시 올릴 수 있습니다"

    - id: no-static-arp
      kind: config
      title: "실습에서 만든 정적 ARP 를 정리했는가"
      host: pc1
      run: "ip neigh show | grep -c PERMANENT || true"
      expect: "0"
      hint: |
        실습 4 에서 등록한 가짜 MAC 항목이 남아 있습니다.
        sudo ip neigh del {{ unused_ip.vlan10 }} dev eth1
        실습 뒤에 원래 상태로 되돌리는 것까지가 작업입니다.

# -----------------------------------------------------------------------------
# 서술 과제
#   자동 채점이 불가능하거나 부적절한 것만 여기 둔다.
#   review: optional  = 제출하면 다음 모듈로 넘어간다 (관리자는 나중에 몰아서 본다)
#   review: required  = 관리자 승인이 있어야 통과 (캡스톤 전용)
#   rubric 을 모두 충족하면 optional 항목은 자동 통과되어 검토 큐에 뜨지 않는다.
# -----------------------------------------------------------------------------
written:
  items:
    - id: cause
      title: "장애 원인 서술 — 어떻게 원인에 도달했는가"
      kind: text
      review: optional
      auto_pass: true          # 루브릭을 다 채우면 관리자가 볼 필요 없습니다
      min_chars: 120
      prompt: |
        이 모듈에서 주입한 장애 하나를 골라, 아래 순서로 적을 것.
        결론만 쓰지 말고 **무엇을 보고 그렇게 판단했는지**를 남깁니다.
          1. 증상 — 무엇이 안 됐는가
          2. 확인 — 어떤 명령으로 무엇을 봤는가
          3. 원인 — 그래서 원인은 무엇이었는가
          4. 조치 — 어떻게 고쳤고, 되돌렸는가
      rubric:
        - key: 증상
          desc: "무엇이 안 됐는지 구체적으로 적었는가"
          any: ["ping", "통신", "안 됨", "실패", "응답"]
        - key: 근거
          desc: "명령 결과로 근거를 댔는가 (추측이 아니라)"
          any: ["ip link", "ip neigh", "ip addr", "bridge", "tcpdump", "arp", "NO-CARRIER"]
        - key: 원인
          desc: "원인을 하나로 지목했는가"
          any: ["원인은", "원인이", "때문에", "때문이", "이유는", "이유가"]
        - key: 조치
          desc: "고친 방법과 되돌린 사실을 적었는가"
          any: ["복구", "삭제", "원복", "되돌", "다시 올", "다시 넣", "다시 붙", "up 으로"]

    - id: topo
      title: "L2 구간 구성도 그리기"
      kind: diagram
      review: optional
      auto_pass: false         # 그림은 사람이 봅니다. 다만 진행은 막지 않습니다
      min_chars: 40
      prompt: |
        지금까지 만진 L2 구간을 글자로 그릴 것.
        노드 · 인터페이스 이름 · 어느 포트가 어디에 붙었는지가 보이면 됩니다.
        예)  pc1 eth1 ─── eth1 sw1 eth2 ─── eth1 pc2

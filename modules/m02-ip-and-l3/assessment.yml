# M2 평가 — 퀴즈(계산·판단) + 검사(설정이 들어갔는가 · 뒷정리를 했는가) + 서술(설계 근거)
quiz:
  pass_score: 80
  questions:
    - id: q1
      type: short
      text: |
        어떤 대역을 `/26` 으로 잘랐다. 서브넷 하나에 **사용 가능한 호스트 주소**는 몇 개인가?
        (숫자만. 도구 없이 계산할 것)
      answer: ["62", "62개", "62 개"]
      explain: |
        /26 → 호스트 비트 32-26 = 6 → 2^6 = 64 개.
        여기서 네트워크 주소와 브로드캐스트 주소를 빼면 **62개**다.
        같이 외울 것: 블록 크기 = 256 - 마스크 옥텟값. /26 의 마스크는 255.255.255.192 → 블록 64.
        이 두 줄이면 서브네팅 계산의 9할이 끝난다.

    - id: q2
      type: single
      text: |
        `{{ ip.pc1 }}/24` 를 쓰는 PC 가 `{{ ip.pc2 }}` 로 패킷을 보낸다.
        PC 는 이 목적지가 **다른 대역**이라는 것을 어떻게 아는가?
      choices:
        - "패킷을 일단 게이트웨이로 보내고, 게이트웨이가 같은 대역이라고 알려 주면 그때 직접 보낸다"
        - "DNS 에 역질의를 보내 목적지가 자기와 같은 도메인·같은 대역에 속하는지 확인한다"
        - "자기 IP 와 마스크로 계산한 자기 네트워크 주소와, 목적지에 같은 마스크를 씌워 계산한 값을 비교한다"
        - "먼저 ARP 를 뿌려 보고, 정해진 시간 안에 응답이 돌아오지 않으면 다른 대역에 있다고 판단해 게이트웨이로 보낸다"
      answer: [2]
      explain: |
        전부 자기 안에서 계산한다. 아무에게도 묻지 않는다.
        그래서 **마스크를 잘못 주면 판단부터 틀어진다** — 같은 대역인 줄 알고 ARP 를 뿌리거나,
        다른 대역인 줄 알고 게이트웨이로 보낸다. M2 장애 주입의 절반이 여기서 나온다.

    - id: q3
      type: single
      text: |
        M1 에서 잘 통하던 pc1 과 pc2 사이가, VLAN 을 나누자 끊겼다.
        **링크는 양쪽 다 UP 이고 주소도 정상**이다. 무엇이 일어난 것인가?
      choices:
        - "VLAN 태그가 붙으면서 프레임 크기가 커져 MTU 를 넘어섰다"
        - "두 PC 의 MAC 주소가 서로 다른 VLAN 에 중복 학습됐다"
        - "브로드캐스트 도메인이 둘로 갈려 ARP 가 상대에게 닿지 못한다"
        - "VLAN 을 나누면 스위치가 MAC 테이블을 비우므로 학습이 다시 필요하다"
      answer: [2]
      explain: |
        VLAN 은 스위치 한 대를 논리적으로 여러 대처럼 쪼갠다.
        ARP Request 는 브로드캐스트이고, 브로드캐스트는 자기 VLAN 밖으로 나가지 못한다.
        상대 MAC 을 못 구하니 프레임을 만들 수조차 없다. → 이것을 넘겨주는 장비가 라우터다.

    - id: q4
      type: single
      text: |
        pc1(`{{ ip.pc1 }}`) 이 pc2(`{{ ip.pc2 }}`) 로 ping 을 보낼 때,
        **pc1 이 내보내는 프레임의 목적지 MAC** 은 무엇인가?
      choices:
        - "게이트웨이(r1) 의 MAC"
        - "pc2 의 MAC"
        - "ff:ff:ff:ff:ff:ff"
        - "스위치(sw1) 의 MAC"
      answer: [0]
      explain: |
        **이 랩 전체에서 가장 중요한 한 줄이다.**
        IP 목적지는 끝까지 pc2 다. 그러나 MAC 목적지는 "다음에 이 프레임을 받을 장비" 이고,
        다른 대역이면 그것은 게이트웨이다. → IP 는 그대로, MAC 만 홉마다 바뀐다.
        증거: pc1 의 `ip neigh` 에는 pc2 가 **끝내 등장하지 않는다.** 게이트웨이만 있다.

    - id: q5
      type: multi
      text: "다음 중 **사설 IP 대역(RFC1918)** 을 모두 고르시오."
      choices:
        - "100.64.0.0/10"
        - "169.254.0.0/16"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
      answer: [2, 3, 4]
      explain: |
        169.254/16 은 Link-local(APIPA) — DHCP 를 못 받았을 때 스스로 붙는 주소다. 사설 대역이 아니다.
        100.64/10 은 CGNAT 용으로 ISP 가 쓰는 공유 대역이다. 이것도 RFC1918 이 아니다.
        구분이 중요한 이유: **169.254 가 보이면 그 자체가 진단 결과**다 (아래 문항).

    - id: q6
      type: single
      text: |
        사용자 PC 의 IP 가 `169.254.13.77` 로 잡혀 있다. 가장 먼저 의심할 것은?
      choices:
        - "DHCP 응답을 받지 못했다 (서버 다운 · 릴레이 누락 · VLAN 오할당 · 링크 문제)"
        - "DNS 서버가 죽어 이름 해석에 실패하자 임시 주소로 대체된 것이다 (DNS 를 먼저 본다)"
        - "방화벽이 DHCP 포트를 막아 이미 받은 주소가 회수된 것이다 (정책을 먼저 본다)"
        - "라우팅 경로가 없어 기본 경로 대신 자동 생성된 주소가 붙은 것이다 (경로를 먼저 본다)"
      answer: [0]
      explain: |
        169.254 는 "주소를 못 받아서 스스로 붙인 주소"다. 원인은 항상 DHCP 경로에 있다.
        실무 순서: ① 링크 UP 인가 ② 포트 VLAN 이 맞는가 ③ 그 VLAN 에 DHCP 서버나 릴레이가 있는가.
        **이 주소를 보고 "인터넷이 안 되네요"로 넘어가면 30분을 버린다.**

    - id: q7
      type: single
      text: |
        DHCP 서버는 서버망에 있고, 사용자 PC 는 다른 VLAN 에 있다.
        릴레이(DHCP Relay / ip helper-address) 없이는 주소를 받지 못한다. 왜인가?
      choices:
        - "DHCP Discover 는 브로드캐스트이고, 브로드캐스트는 라우터를 넘지 못하기 때문"
        - "DHCP 는 TCP 라서 다른 대역과는 3-way handshake 를 맺을 수 없기 때문"
        - "DHCP 서버는 자기가 속한 대역 밖의 주소 풀은 할당할 수 없도록 규정돼 있기 때문"
        - "라우터가 기본적으로 67·68 번 포트를 차단하므로 방화벽 정책이 필요하기 때문"
      answer: [0]
      explain: |
        M1 에서 배운 "브로드캐스트는 세그먼트 안에서만"이 여기서 그대로 문제가 된다.
        릴레이는 라우터가 그 브로드캐스트를 받아 **유니캐스트로 서버에 대신 전달**해 주는 기능이다.
        DORA(Discover-Offer-Request-Ack) 중 Discover 와 Request 가 브로드캐스트다.

    - id: q8
      type: single
      text: |
        "ping 은 잘 되는데 파일 전송이나 웹 페이지 로딩만 특정 구간에서 멈춘다."
        가장 먼저 의심할 것은?
      choices:
        - "경로 상의 MTU 불일치 (+ ICMP 차단으로 PMTUD 실패)"
        - "구간 대역폭 부족 — 작은 패킷은 통과하고 큰 전송만 밀린다"
        - "DNS 응답 지연 — 첫 연결만 오래 걸리고 그 뒤는 정상이다"
        - "케이블 불량 — 큰 프레임에서만 CRC 오류가 나 재전송된다"
      answer: [0]
      explain: |
        ping 은 기본적으로 작은 패킷이라 어떤 MTU 도 통과한다. 큰 패킷만 걸린다.
        확인법: `ping -M do -s <크기>` 로 크기를 키우며 어디서 깨지는지 본다.
        더 나쁜 경우는 중간 장비가 ICMP 를 막아 "Frag needed" 통지조차 오지 않는 것 —
        그러면 송신자는 이유도 모른 채 재전송만 반복한다. **VPN·터널 구간의 단골 장애다.**

    - id: q9
      type: single
      text: |
        새 지사 네트워크를 설계한다. 사설 대역으로 `192.168.0.0/24` 를 쓰겠다는 제안이 왔다.
        가장 타당한 반대 근거는?
      choices:
        - "192.168 대역은 브로드캐스트 도메인이 커서 지사 규모가 커지면 성능이 나오지 않고 분할도 어렵다"
        - "공유기 기본값이라 전 세계에서 가장 많이 쓰인다. VPN 연동·재택 접속·회사 합병 때 거의 확실히 충돌한다"
        - "192.168 대역은 /24 하나뿐이라 부서별로 나누면 요약 광고를 할 수가 없다"
        - "일부 라우터는 192.168 대역을 예약 대역으로 인식해 요약 광고 대상에서 제외한다"
      answer: [1]
      explain: |
        사설 주소는 조직마다 자유롭게 쓰므로 **겹칠 수 있다**는 것이 유일한 실질 리스크다.
        겹치면 VPN 으로 붙는 순간 어느 쪽 10.x 인지 라우팅이 결정할 수 없다.
        그래서 설계자의 첫 번째 일은 "잘 안 쓰는 대역을 고르는 것"이다.
        이 프로젝트는 그 검사를 `tools/validate-site.py` 의 forbidden 목록으로 자동화했다.

    - id: q10
      type: short
      text: |
        `{{ zone['site-a'] }}` 한 줄로 광고하면 `{{ cidr.vlan10 }}` 과 `{{ cidr.vlan20 }}` 을 모두 포함한다.
        이렇게 여러 대역을 하나로 묶어 광고하는 것을 무엇이라 하는가? (한국어 또는 영어 한 단어)
      answer: ["요약", "경로 요약", "요약 경로", "집약", "경로 집약", "주소 집약", "서머리",
                "summarization", "route summarization", "summary", "route summary",
                "aggregation", "supernetting"]
      explain: |
        요약(summarization)이 되려면 **인접한 대역끼리 같은 구역에 모여 있어야** 한다.
        그래서 주소 설계는 "빈 곳에 아무거나 꽂기"가 아니라 순서와 배치의 문제다.
        요약이 되면 코어 라우팅 테이블이 작아지고, 지사에 VLAN 을 추가해도 코어를 건드리지 않는다.
        → 과제 1 의 채점 기준이 바로 이것이다.

checks:
  required: true
  items:
    - id: r1-vlan-gateway
      kind: config
      title: "r1 에 VLAN10 · VLAN20 게이트웨이 주소가 올라와 있는가"
      host: r1
      run: "ip -br addr show | grep -E 'eth1[.](10|20)'"
      expect_all: ["{{ gw.vlan10 }}", "{{ gw.vlan20 }}"]
      hint: |
        서브인터페이스(router-on-a-stick)다. `ip -br addr show` 에 eth1.10 / eth1.20 이 보여야 한다.
        없으면 sudo netplan apply 로 되돌린다.

    - id: r1-forwarding
      kind: state
      title: "r1 이 실제로 패킷을 넘겨주는 상태인가 (IP 포워딩)"
      host: r1
      run: "cat /proc/sys/net/ipv4/ip_forward"
      expect: "1"
      hint: |
        주소가 있고 경로가 있어도 포워딩이 꺼져 있으면 라우터가 아니라 그냥 호스트다.
        sudo sysctl -w net.ipv4.ip_forward=1

    - id: sw1-trunk
      kind: config
      title: "sw1 의 트렁크가 VLAN 10·20 을 태그로 실어 나르는가"
      host: sw1
      run: "bridge vlan show dev eth3"
      expect_all: ["{{ vlans[10].id }}", "{{ vlans[20].id }}", "{{ vlans[999].id }}"]
      # 태그된 채로 실려야 한다. 둘 중 하나가 native(untagged) 로 바뀌면 그 VLAN 만 조용히 끊긴다.
      expect_none: ["{{ vlans[10].id }} PVID", "{{ vlans[20].id }} PVID"]
      hint: |
        eth3 는 r1 로 가는 트렁크다. 10 과 20 은 **태그된 채로**, 999(native) 는 untagged 로 보여야 한다.
        하나라도 빠지면 그 VLAN 만 게이트웨이에 닿지 못한다.
        sudo systemctl restart lab-switch 로 스위칭 설정을 다시 올릴 수 있다.

    - id: pc1-default-route
      kind: config
      title: "pc1 의 기본 경로가 VLAN10 게이트웨이를 향하는가"
      host: pc1
      run: "ip route show default"
      expect: "default via {{ gw.vlan10 }}"
      hint: "sudo netplan apply. 실습 2 에서 지운 기본 경로를 되돌리지 않았을 수 있다."

    - id: pc2-default-route
      kind: config
      title: "pc2 의 기본 경로가 VLAN20 게이트웨이를 향하는가"
      host: pc2
      run: "ip route show default"
      expect: "default via {{ gw.vlan20 }}"
      hint: "sudo netplan apply"

    - id: cross-subnet-ping
      kind: connectivity
      title: "pc1 → pc2 다른 대역 통신이 되는가"
      host: pc1
      run: "ping -c2 -W2 {{ ip.pc2 }} >/dev/null && echo REACHABLE"
      expect: "REACHABLE"
      hint: |
        순서대로 볼 것.
          ① ip route show default   — 게이트웨이가 있는가
          ② ping {{ gw.vlan10 }}    — 게이트웨이까지는 가는가 (여기서 막히면 VLAN·마스크 문제)
          ③ r1 에서 ip -br addr     — 반대편 게이트웨이도 살아 있는가
          ④ pc2 의 기본 경로        — 돌아오는 길이 있는가

    - id: mac-differs
      kind: state
      title: "pc1 은 pc2 의 MAC 을 모른 채 통신하는가 (다른 대역의 증거)"
      host: pc1
      run: "ping -c1 -W2 {{ ip.pc2 }} >/dev/null 2>&1; ip neigh show dev eth1"
      expect: "{{ gw.vlan10 }}"
      expect_none: ["{{ ip.pc2 }}"]
      hint: |
        다른 대역이면 ARP 상대는 게이트웨이뿐이다. pc2 의 주소가 ARP 테이블에 있다면
        실습 중에 정적 항목을 넣어 둔 것이다. sudo ip neigh del {{ ip.pc2 }} dev eth1 로 정리할 것.

    - id: pc2-no-leftover
      kind: config
      title: "실습 1 에서 pc2 에 임시로 붙인 VLAN10 주소를 정리했는가"
      host: pc2
      run: "ip -br addr show eth1"
      expect: "{{ ip.pc2 }}"
      expect_none: ["{{ unused_ip.vlan10 }}"]
      hint: |
        sudo ip addr del {{ unused_ip.vlan10 }}/24 dev eth1
        실습 뒤에 원래 상태로 되돌리는 것까지가 작업이다.

    - id: mtu-restored
      kind: config
      title: "실습 5 에서 줄인 r1 의 MTU 를 되돌렸는가"
      host: r1
      run: "cat /sys/class/net/eth1.20/mtu"
      expect: "1500"
      hint: |
        sudo ip link set eth1.20 mtu 1500
        MTU 를 줄여 놓은 채 다음 모듈로 가면, M3 에서 원인 모를 "큰 전송만 실패"를 만나게 된다.

# -----------------------------------------------------------------------------
# 서술 과제
#   review: optional  = 제출하면 다음 모듈로 넘어간다 (관리자는 나중에 몰아서 본다)
#   auto_pass: true   = 루브릭을 모두 충족하면 자동 통과 — 검토 큐에 뜨지 않는다
# -----------------------------------------------------------------------------
written:
  items:
    - id: addr-design
      title: "주소 설계안 — 무엇을 근거로 그렇게 잘랐는가 ★"
      kind: text
      review: optional
      auto_pass: true
      min_chars: 300
      prompt: |
        tasks.md 의 [과제 1] 요구사항에 맞춰 작성한 **주소 설계안**을 여기에 붙여 넣을 것.
        표는 그대로 붙여 넣어도 되고, 아래 다섯 가지가 글 안에 드러나기만 하면 된다.

          1. 사용할 사설 대역과 **그 대역을 고른 이유** (중복 회피 관점)
          2. 구역(사이트)별 배분 — 왜 그 크기로 잘랐는가
          3. 부서별 서브넷과 마스크 — 필요 호스트 수와 증설 여지를 어떻게 반영했는가
          4. **요약(summarization)** — 각 사이트를 몇 번의 광고로 표현할 수 있는가
          5. 관리망·P2P 링크 등 부속 대역의 처리

        > 결론표만 내지 말 것. 채점은 표가 아니라 **"왜 그렇게 잘랐는가"** 를 본다.
      rubric:
        - key: 대역선정
          desc: "사설 대역을 명시하고 RFC1918 안에서 골랐는가"
          any: ["RFC1918", "사설", "10.", "172.16", "172.1", "private"]
        - key: 중복회피
          desc: "왜 그 대역인지 — 중복 리스크를 근거로 댔는가"
          any: ["중복", "충돌", "VPN", "합병", "192.168", "겹", "흔하"]
        - key: 요약
          desc: "요약 가능하게 배치했는가"
          any: ["요약", "집약", "summar", "인접", "묶", "광고"]
        - key: 증설여지
          desc: "증설 여지를 계산에 넣었는가"
          any: ["증설", "여유", "예비", "확장", "30%", "30 %", "reserved"]
        - key: 마스크근거
          desc: "마스크를 호스트 수 근거로 정했는가"
          any: ["/2", "/3", "마스크", "prefix", "호스트 수", "개까지"]

    - id: topo
      title: "L3 구성도 그리기 — 대역 경계가 보이게"
      kind: diagram
      review: optional
      auto_pass: false          # 그림은 사람이 본다. 다만 진행은 막지 않는다
      min_chars: 60
      prompt: |
        지금 랩의 L3 구조를 글자로 그릴 것. **어디가 대역의 경계인지**가 보이면 된다.
        노드 · 인터페이스 · VLAN 번호 · 대역 · 게이트웨이 주소를 넣는다.

        예)
          pc1 {{ ipc.pc1 }} ─ VLAN10 ─┐
                                        sw1 ─(trunk 10,20)─ r1
          pc2 {{ ipc.pc2 }} ─ VLAN20 ─┘        eth1.10 {{ gw.vlan10 }}
                                                eth1.20 {{ gw.vlan20 }}

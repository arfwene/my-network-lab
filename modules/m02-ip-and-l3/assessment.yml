# M2 평가 — 퀴즈(계산·판단) + 검사(설정이 들어갔는가 · 뒷정리를 했는가) + 서술(설계 근거)
quiz:
  pass_score: 100
  questions:

    - id: q1
      type: single
      text: |
        `{{ ip.pc1 }}/24` 를 쓰는 PC 가 `{{ ip.pc2 }}` 로 패킷을 보냅니다.
        PC 는 이 목적지가 **다른 대역**이라는 것을 어떻게 아는가?
      choices:
        - "패킷을 일단 게이트웨이로 보내고, 게이트웨이가 같은 대역이라고 알려 주면 그때 직접 보냅니다"
        - "DNS 에 역질의를 보내 목적지가 자기와 같은 도메인·같은 대역에 속하는지 확인합니다"
        - "자기 IP 와 마스크로 계산한 자기 네트워크 주소와, 목적지에 같은 마스크를 씌워 계산한 값을 비교합니다"
        - "먼저 ARP 를 뿌려 보고, 정해진 시간 안에 응답이 돌아오지 않으면 다른 대역에 있다고 판단해 게이트웨이로 보냅니다"
      answer: [2]
      explain: |
        전부 자기 안에서 계산합니다. 아무에게도 묻지 않습니다.
        그래서 **마스크를 잘못 주면 판단부터 틀어진다** — 같은 대역인 줄 알고 ARP 를 뿌리거나,
        다른 대역인 줄 알고 게이트웨이로 보냅니다. M2 장애 주입의 절반이 여기서 나옵니다.

    # ── 3.2 · 3.3 직접 만들면서 본 화면을 그대로 지문으로 쓴다 ──────
    - id: q2
      type: single
      text: |
        3.2 에서 `sw1` 에 VLAN 을 켜자 통신이 끊겼습니다. 이때 두 PC 는 **아직 같은 대역**이고
        링크도 양쪽 다 UP 입니다. `pc1` 에서 확인하니 이렇게 나옵니다.
        `ip neigh show dev eth1` → `{{ ip_at('pc2', 'm1') }} dev eth1  FAILED`
        `FAILED` 가 뜬 이유로 맞는 것은?
      choices:
        - "VLAN 태그가 붙으면서 프레임이 커져 MTU 를 넘어섰습니다"
        - "ARP Request 가 브로드캐스트라 `pc2` 의 VLAN 까지 가지 못했습니다"
        - "`pc2` 의 주소가 이미 다른 대역으로 바뀌어 같은 대역이 아닙니다"
        - "`sw1` 이 VLAN 을 켜면서 MAC 테이블을 비워 학습이 다시 필요합니다"
      answer: [1]
      explain: |
        `FAILED` 는 **ARP 응답이 오지 않았다**는 뜻입니다. 주소가 틀린 것도, 프레임이 큰 것도 아닙니다.
        ARP Request 는 브로드캐스트이고 브로드캐스트는 자기 VLAN 밖으로 나가지 못합니다 —
        `pc2` 는 질문 자체를 듣지 못했습니다.
        케이블도 그대로, 스위치도 한 대 그대로, 링크도 전부 UP 인데 **논리적으로 다른 네트워크**가 된 것입니다.
        이것이 "브로드캐스트 도메인을 나눴다" 의 실체입니다 (3.2).

    - id: q3
      type: single
      text: |
        3.3 에서 `pc2` 의 주소를 개발부 대역으로 옮겼습니다. 같은 `ping` 인데 답이 바뀝니다.
        `3.2 직후` → `Destination Host Unreachable`
        `3.3 직후` → `Network is unreachable`
        이 둘의 차이로 맞는 것은?
      choices:
        - "앞은 상대가 꺼진 것이고, 뒤는 상대 방화벽이 막은 것입니다"
        - "앞은 스위치가 돌려준 것이고, 뒤는 라우터가 돌려준 것입니다"
        - "앞은 패킷이 나갔다 실패한 것이고, 뒤는 나가지도 못한 것입니다"
        - "앞은 커널이 길을 못 찾은 것이고, 뒤는 상대가 응답을 안 한 것입니다"
      answer: [2]
      explain: |
        `Destination Host Unreachable` 은 **같은 대역**으로 판단해 ARP 까지 갔는데 응답이 없던 경우입니다.
        `Network is unreachable` 은 **다른 대역**인데 갈 길(기본 경로)이 없어 커널이
        패킷을 만들지도 않은 것입니다. 앞은 나갔다 실패했고, 뒤는 나가지도 못했습니다.
        이 둘을 뭉뚱그리면 엉뚱한 곳을 팝니다 (3.3).

    - id: q4
      type: single
      text: |
        pc1(`{{ ip.pc1 }}`) 이 pc2(`{{ ip.pc2 }}`) 로 ping 을 보낼 때,
        **pc1 이 내보내는 프레임의 목적지 MAC** 은 무엇인가?
      choices:
        - "게이트웨이(r1) 의 MAC"
        - "pc2 의 MAC"
        - "ff:ff:ff:ff:ff:ff"
        - "스위치(sw1) 의 MAC"
      answer: [0]
      explain: |
        **이 랩 전체에서 가장 중요한 한 줄입니다.**
        IP 목적지는 끝까지 pc2 입니다. 그러나 MAC 목적지는 "다음에 이 프레임을 받을 장비" 이고,
        다른 대역이면 그것은 게이트웨입니다. → IP 는 그대로, MAC 만 홉마다 바뀝니다.
        증거: pc1 의 `ip neigh` 에는 pc2 가 **끝내 등장하지 않습니다.** 게이트웨이만 있습니다.

    - id: q5
      type: multi
      text: "다음 중 **사설 IP 대역(RFC1918)** 을 모두 고르시오."
      choices:
        - "100.64.0.0/10"
        - "169.254.0.0/16"
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"
      answer: [2, 3, 4]
      explain: |
        169.254/16 은 Link-local(APIPA) — DHCP 를 못 받았을 때 스스로 붙는 주소입니다. 사설 대역이 아닙니다.
        100.64/10 은 CGNAT 용으로 ISP 가 쓰는 공유 대역입니다. 이것도 RFC1918 이 아닙니다.
        구분이 중요한 이유: **169.254 가 보이면 그 자체가 진단 결과**다 (아래 문항).

    - id: q6
      type: single
      text: |
        사용자 PC 의 IP 가 `169.254.13.77` 로 잡혀 있습니다. 가장 먼저 의심할 것은?
      choices:
        - "DHCP 응답을 받지 못했습니다 (서버 다운 · 릴레이 누락 · VLAN 오할당 · 링크 문제)"
        - "DNS 서버가 죽어 이름 해석에 실패하자 임시 주소로 대체된 것입니다 (DNS 를 먼저 봅니다)"
        - "방화벽이 DHCP 포트를 막아 이미 받은 주소가 회수된 것입니다 (정책을 먼저 봅니다)"
        - "라우팅 경로가 없어 기본 경로 대신 자동 생성된 주소가 붙은 것입니다 (경로를 먼저 봅니다)"
      answer: [0]
      explain: |
        169.254 는 "주소를 못 받아서 스스로 붙인 주소"다. 원인은 항상 DHCP 경로에 있습니다.
        실무 순서: ① 링크 UP 인가 ② 포트 VLAN 이 맞는가 ③ 그 VLAN 에 DHCP 서버나 릴레이가 있는가.
        **이 주소를 보고 "인터넷이 안 되네요"로 넘어가면 30분을 버립니다.**

    - id: q7
      type: single
      text: |
        DHCP 서버는 서버망에 있고, 사용자 PC 는 다른 VLAN 에 있습니다.
        릴레이(DHCP Relay / ip helper-address) 없이는 주소를 받지 못합니다. 왜인가?
      choices:
        - "DHCP Discover 는 브로드캐스트이고, 브로드캐스트는 라우터를 넘지 못하기 때문"
        - "DHCP 는 TCP 라서 다른 대역과는 3-way handshake 를 맺을 수 없기 때문"
        - "DHCP 서버는 자기가 속한 대역 밖의 주소 풀은 할당할 수 없도록 규정돼 있기 때문"
        - "라우터가 기본적으로 67·68 번 포트를 차단하므로 방화벽 정책이 필요하기 때문"
      answer: [0]
      explain: |
        M1 에서 배운 "브로드캐스트는 세그먼트 안에서만"이 여기서 그대로 문제가 됩니다.
        릴레이는 라우터가 그 브로드캐스트를 받아 **유니캐스트로 서버에 대신 전달**해 주는 기능입니다.
        DORA(Discover-Offer-Request-Ack) 중 Discover 와 Request 가 브로드캐스트입니다.

    # ── 서브네팅 계산 ────────────────────────────────────────────────
    #    답이 주소 하나 · 숫자 하나로 정해지는 것들이다.
    #    VLSM 설계(과제 2-8)는 답이 여럿이라 과제에 남겨 둔다.

    - id: q8
      type: short
      text: "`172.20.14.200/28` 의 **브로드캐스트 주소**는? (주소만)"
      answer: ["172.20.14.207"]
      explain: |
        `/28` 은 블록 크기 16 입니다. `200 ÷ 16 = 12…8` 이므로 구간은 `192~207`,
        네트워크 `172.20.14.192` · 브로드캐스트 `172.20.14.207` 입니다.

    - id: q9
      type: short
      text: |
        아래 네 대역을 **한 줄로 요약**하면? (CIDR 표기로)
        `10.30.8.0/24` `10.30.9.0/24` `10.30.10.0/24` `10.30.11.0/24`
      answer: ["10.30.8.0/22"]
      explain: |
        연속한 네 개의 `/24` 는 `/22` 하나로 묶입니다(`8, 9, 10, 11`).
        요약이 되려면 **개수가 2의 거듭제곱**이고 **시작이 그 경계**여야 합니다 — `8` 은 4의 배수라 가능합니다.

    - id: q10
      type: single
      text: |
        아래 설정을 받은 PC 가 통신하지 못합니다. 이유는?
        `주소 10.40.5.130/26` · `게이트웨이 10.40.5.1`
      choices:
        - "게이트웨이가 이 PC 의 서브넷 밖입니다. `/26` 의 한 구간은 `.128~.191` 입니다"
        - "게이트웨이가 `.1` 이라 이 PC 가 속한 `/26` 구간의 첫 주소가 아닙니다"
        - "`10.40.5.130` 이 이 구간의 브로드캐스트 주소라 호스트가 쓸 수 없습니다"
        - "`/26` 은 호스트가 62개뿐이라 `.130` 은 쓸 수 있는 번호 범위를 넘습니다"
      answer: [0]
      explain: |
        게이트웨이는 **같은 서브넷 안**에 있어야 합니다.
        밖에 있으면 PC 는 그 주소를 이웃으로 보지 않으므로 ARP 부터 실패하고, 한 발도 나가지 못합니다.
        현장에서 가장 흔한 오설정이고, 증상은 "게이트웨이 ping 도 안 됩니다" 로 나타납니다.

    # ── 6.4 ④⑤ PMTUD 블랙홀과 MSS clamp ─────────────────────────────
    - id: q11
      type: single
      text: |
        경로 중간에 MTU 1400 구간이 있고, 그 라우터가 보내는 `Frag needed` 통지가 차단돼 있습니다.
        어떤 증상이 나타나는가?
      choices:
        - "`ping` 도 되고 연결도 맺어지는데 큰 데이터 전송만 멈춥니다"
        - "즉시 `Network is unreachable` 이 뜹니다"
        - "모든 통신이 크기와 상관없이 똑같이 느려집니다"
        - "연결 자체가 맺어지지 않습니다 (타임아웃)"
      answer: [0]
      explain: |
        작은 패킷(ping · handshake)은 1400 을 넘지 않아 그대로 통과합니다.
        큰 패킷만 버려지는데 **알려 주는 사람이 없어** 송신자는 계속 같은 크기로 재전송합니다.
        이것이 **PMTUD 블랙홀**이고, 원인을 찾는 데 며칠이 걸리는 종류의 장애입니다.

    - id: q12
      type: single
      text: |
        3.4 에서 `sw1` 의 `{{ port.sw1.r1 }}` 를 트렁크로 만들었습니다. `bridge vlan show` 에
        VLAN {{ vlans[10].id }}·{{ vlans[20].id }} 가 태그로 올라와 있는 것도 확인했습니다.
        그런데 `pc1` → `{{ gw.vlan10 }}` 이 여전히 안 됩니다. 무엇이 빠졌는가?
      choices:
        - "`r1` 쪽에 그 태그를 받을 서브인터페이스가 없습니다. 트렁크는 양 끝이 다 있어야 합니다"
        - "native VLAN 을 {{ vlans[999].id }} 로 둔 것이 잘못입니다. 1 로 되돌려야 합니다"
        - "`sw1` 에도 게이트웨이 주소를 줘야 트렁크가 동작합니다"
        - "트렁크로 만든 뒤에는 `pc1` 의 액세스 포트를 다시 지정해야 합니다"
      answer: [0]
      explain: |
        트렁크는 **링크의 성질**이지 스위치만의 설정이 아닙니다. 한 링크의 양쪽 끝이
        각각 이름을 달리 부를 뿐입니다 — 스위치 쪽은 트렁크 포트, 라우터 쪽은 서브인터페이스.
        Cisco 로 치면 `switchport mode trunk` 와 `encapsulation dot1Q 10` 이 한 짝입니다.
        3.4 만 하고 3.5 를 안 하면 태그는 붙어서 가는데 받는 쪽이 그 태그를 모릅니다 (3.5).

checks:
  required: true
  items:
    - id: r1-vlan-gateway
      kind: config
      title: "r1 에 VLAN10 · VLAN20 게이트웨이 주소가 올라와 있는가"
      host: r1
      run: "ip -br addr show | grep -E 'eth1[.](10|20)'"
      expect_all: ["{{ gw.vlan10 }}", "{{ gw.vlan20 }}"]
      hint: |
        서브인터페이스(router-on-a-stick)다. `ip -br addr show` 에 eth1.10 / eth1.20 이 보여야 합니다.
        없으면 3.6 의 기본 경로를 다시 넣습니다.

    - id: r1-forwarding
      kind: state
      title: "r1 이 실제로 패킷을 넘겨주는 상태인가 (IP 포워딩)"
      host: r1
      run: "cat /proc/sys/net/ipv4/ip_forward"
      expect: "1"
      hint: |
        주소가 있고 경로가 있어도 포워딩이 꺼져 있으면 라우터가 아니라 그냥 호스트입니다.
        sudo sysctl -w net.ipv4.ip_forward=1

    - id: sw1-trunk
      kind: config
      title: "sw1 의 트렁크가 VLAN 10·20 을 태그로 실어 나르는가"
      host: sw1
      run: "bridge vlan show dev eth3"
      expect_all: ["{{ vlans[10].id }}", "{{ vlans[20].id }}", "{{ vlans[999].id }}"]
      # 태그된 채로 실려야 한다. 둘 중 하나가 native(untagged) 로 바뀌면 그 VLAN 만 조용히 끊긴다.
      expect_none: ["{{ vlans[10].id }} PVID", "{{ vlans[20].id }} PVID"]
      hint: |
        eth3 는 r1 로 가는 트렁큽니다. 10 과 20 은 **태그된 채로**, 999(native) 는 untagged 로 보여야 합니다.
        하나라도 빠지면 그 VLAN 만 게이트웨이에 닿지 못합니다.
        sudo systemctl restart lab-switch 로 스위칭 설정을 다시 올릴 수 있습니다.

    - id: pc1-default-route
      kind: config
      title: "pc1 의 기본 경로가 VLAN10 게이트웨이를 향하는가"
      host: pc1
      run: "ip route show default"
      expect: "default via {{ gw.vlan10 }}"
      hint: "6.1 에서 지운 기본 경로를 되돌리지 않았을 수 있습니다. 3.6 의 명령을 다시 칩니다."

    - id: pc2-default-route
      kind: config
      title: "pc2 의 기본 경로가 VLAN20 게이트웨이를 향하는가"
      host: pc2
      run: "ip route show default"
      expect: "default via {{ gw.vlan20 }}"
      hint: "3.5 에서 만든 서브인터페이스의 MTU 를 1500 으로 되돌립니다."

    - id: cross-subnet-ping
      kind: connectivity
      title: "pc1 → pc2 다른 대역 통신이 되는가"
      host: pc1
      run: "ping -c2 -W2 {{ ip.pc2 }} >/dev/null && echo REACHABLE"
      expect: "REACHABLE"
      hint: |
        순서대로 봐 주세요.
          ① ip route show default   — 게이트웨이가 있는가
          ② ping {{ gw.vlan10 }}    — 게이트웨이까지는 가는가 (여기서 막히면 VLAN·마스크 문제)
          ③ r1 에서 ip -br addr     — 반대편 게이트웨이도 살아 있는가
          ④ pc2 의 기본 경로        — 돌아오는 길이 있는가

    - id: mac-differs
      kind: state
      title: "pc1 은 pc2 의 MAC 을 모른 채 통신하는가 (다른 대역의 증거)"
      host: pc1
      run: "ping -c1 -W2 {{ ip.pc2 }} >/dev/null 2>&1; ip neigh show dev eth1"
      expect: "{{ gw.vlan10 }}"
      expect_none: ["{{ ip.pc2 }}"]
      hint: |
        다른 대역이면 ARP 상대는 게이트웨이뿐입니다. pc2 의 주소가 ARP 테이블에 있다면
        실습 중에 정적 항목을 넣어 둔 것입니다. sudo ip neigh del {{ ip.pc2 }} dev eth1 로 정리해 주세요.

    - id: pc2-no-leftover
      kind: config
      title: "3.3 에서 pc2 의 주소를 개발부 대역으로 옮겼는가"
      host: pc2
      run: "ip -br addr show eth1"
      expect: "{{ ip.pc2 }}"
      expect_none: ["{{ ip_at('pc2', 'm1') }}"]
      hint: |
        sudo ip addr del {{ ip_at('pc2', 'm1', true) }} dev eth1
        실습 뒤에 원래 상태로 되돌리는 것까지가 작업입니다.

    - id: mtu-restored
      kind: config
      title: "6.4 에서 줄인 r1 의 MTU 를 되돌렸는가"
      host: r1
      run: "cat /sys/class/net/eth1.20/mtu"
      expect: "1500"
      hint: |
        sudo ip link set eth1.20 mtu 1500
        MTU 를 줄여 놓은 채 다음 모듈로 가면, M3 에서 원인 모를 "큰 전송만 실패"를 만나게 됩니다.

# -----------------------------------------------------------------------------
# 서술 과제
#   review: optional  = 제출하면 다음 모듈로 넘어간다 (관리자는 나중에 몰아서 본다)
#   auto_pass: true   = 루브릭을 모두 충족하면 자동 통과 — 검토 큐에 뜨지 않는다
# -----------------------------------------------------------------------------
written:
  items:
    - id: addr-design
      title: "주소 설계안 — 무엇을 근거로 그렇게 잘랐는가 ★"
      kind: text
      review: optional
      auto_pass: true
      min_chars: 300
      prompt: |
        tasks.md 의 [과제 1] 요구사항에 맞춰 작성한 **주소 설계안**을 여기에 붙여 넣을 것.
        표는 그대로 붙여 넣어도 되고, 아래 다섯 가지가 글 안에 드러나기만 하면 됩니다.

          1. 사용할 사설 대역과 **그 대역을 고른 이유** (중복 회피 관점)
          2. 구역(사이트)별 배분 — 왜 그 크기로 잘랐는가
          3. 부서별 서브넷과 마스크 — 필요 호스트 수와 증설 여지를 어떻게 반영했는가
          4. **요약(summarization)** — 각 사이트를 몇 번의 광고로 표현할 수 있는가
          5. 관리망·P2P 링크 등 부속 대역의 처리

        > 결론표만 내지 말 것. 채점은 표가 아니라 **"왜 그렇게 잘랐는가"** 를 봅니다.
      rubric:
        - key: 대역선정
          desc: "사설 대역을 명시하고 RFC1918 안에서 골랐는가"
          any: ["RFC1918", "사설", "10.", "172.16", "172.1", "private"]
        - key: 중복회피
          desc: "왜 그 대역인지 — 중복 리스크를 근거로 댔는가"
          any: ["중복", "충돌", "VPN", "합병", "192.168", "겹", "흔하"]
        - key: 요약
          desc: "요약 가능하게 배치했는가"
          any: ["요약", "집약", "summar", "인접", "묶", "광고"]
        - key: 증설여지
          desc: "증설 여지를 계산에 넣었는가"
          any: ["증설", "여유", "예비", "확장", "30%", "30 %", "reserved"]
        - key: 마스크근거
          desc: "마스크를 호스트 수 근거로 정했는가"
          any: ["/2", "/3", "마스크", "prefix", "호스트 수", "개까지"]

    - id: topo
      title: "L3 구성도 그리기 — 대역 경계가 보이게"
      kind: diagram
      review: optional
      auto_pass: false          # 그림은 사람이 봅니다. 다만 진행은 막지 않습니다
      min_chars: 60
      prompt: |
        지금 랩의 L3 구조를 글자로 그릴 것. **어디가 대역의 경계인지**가 보이면 됩니다.
        노드 · 인터페이스 · VLAN 번호 · 대역 · 게이트웨이 주소를 넣습니다.

        예)
          pc1 {{ ipc.pc1 }} ─ VLAN10 ─┐
                                        sw1 ─(trunk 10,20)─ r1
          pc2 {{ ipc.pc2 }} ─ VLAN20 ─┘        eth1.10 {{ gw.vlan10 }}
                                                eth1.20 {{ gw.vlan20 }}

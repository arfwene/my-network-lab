id: m02
title: "IP 주소와 L3 의 등장"
stage: m2
duration: "4시간"
competencies: [C1, C2, C5, C6, C7, C8, B3, B5, D1]
summary: "브로드캐스트 도메인을 VLAN 으로 쪼개 통신을 끊어 보고, 게이트웨이로 다시 잇습니다. 그 과정에서 목적지 MAC 이 바뀌는 순간을 캡처로 확인합니다."
objectives:
  - "서브넷 마스크/CIDR 을 도구 없이 계산해 네트워크·브로드캐스트·사용 가능 범위를 도출할 수 있습니다 (C1)"
  - "요약 가능한 IP 주소 설계안을 작성하고 사설 대역 선정 근거를 댈 수 있습니다 (C2, C8)"
  - "사설 IP 와 공인 IP 를 구분하고 특수 대역이 뜻하는 바를 진단 단서로 쓸 수 있습니다 (C7)"
  - "브로드캐스트 도메인을 VLAN 으로 분할하고 트렁크로 연장할 수 있습니다 (B3)"
  - "같은 대역 통신과 다른 대역 통신에서 목적지 MAC 이 어떻게 달라지는지 캡처로 증명할 수 있습니다 (D1)"
  - "VLAN 미할당·마스크 오류·게이트웨이 오설정의 증상을 예측하고 진단할 수 있습니다 (B5)"
  - "DHCP DORA 와 릴레이가 필요한 이유를 설명할 수 있습니다 (C6)"
  - "MTU 불일치의 전형적 증상(ping 은 되는데 큰 전송만 실패)을 재현하고 진단할 수 있습니다 (C5)"

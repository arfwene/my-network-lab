---
# M3-01 : r2 의 Site-A 리턴 경로 삭제
#   증상  : pc1 -> web 무응답. r1 과 r4 의 경로는 정상이다.
#   정답  : 가운데 라우터(r2)에 Site-A 로 돌아가는 경로가 없다.
#           web 에서 캡처하면 요청은 도착하고 응답도 나간다 -> 리턴 경로 문제.
#           절단 지점은 r2 다 (r4 까지는 응답이 갔다가 r2 에서 버려진다).
#   노림수: 실습 4 에서 배운 절차를 **다른 지점**에 적용해 보게 한다. (D3)
- name: "scenario m03-01 :: 가운데 라우터의 리턴 경로 누락"
  hosts: r2
  become: true
  gather_facts: false
  vars:
    site_a: "{{ ipv4.summary['site-a'].cidr }}"
    nh: "{{ ipv4.p2p['r1-r2'].addresses.r1 }}"
  tasks:
    - name: 리턴 경로 삭제
      ansible.builtin.command: >-
        vtysh -c "conf t" -c "no ip route {{ site_a }} {{ nh }}"
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: 리턴 경로 복구
      ansible.builtin.command: >-
        vtysh -c "conf t" -c "ip route {{ site_a }} {{ nh }}"
      changed_when: true
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r2 에서 ' ~ site_a ~ ' 경로를 지웠다. 교육생에게는 "pc1 에서 web 이 안 된다"고만 알릴 것.'
             if scenario_action | default('break') == 'break'
             else 'r2 리턴 경로 복구 완료 (' ~ site_a ~ ' via ' ~ nh ~ ').' }}

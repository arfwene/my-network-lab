---
# M4-02 : 주 경로(r1-r2)의 MTU 불일치
#   증상  : 통신은 되는데 traceroute 가 백업(r3) 경유로 나온다. 주 경로 링크는 UP.
#   한줄  : 트래픽이 백업(r3)으로 돌아감
#   목표  : 평상시 트래픽이 주 경로(r2)를 지난다
#   정답  : r1 의 eth2 MTU 가 1400 이라 DBD 교환에서 막힌다.
#           show ip ospf neighbor 의 State 가 ExStart/Exchange 에서 멈춰 있다.
#   노림수: **상태 이름이 원인을 말해 준다.** ExStart 를 보면 곧장 MTU 를 본다. (D5, C5)
- name: "scenario m04-02 :: 주 경로 MTU 불일치"
  hosts: r1
  become: true
  gather_facts: false
  vars:
    bad_mtu: 1400
    good_mtu: 1500
  tasks:
    - name: MTU 를 낮추고 인접을 다시 맺게 한다
      ansible.builtin.shell: |
        ip link set eth2 mtu {{ bad_mtu }}
        ip link set eth2 down && sleep 1 && ip link set eth2 up
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: MTU 복구
      ansible.builtin.shell: |
        ip link set eth2 mtu {{ good_mtu }}
        ip link set eth2 down && sleep 1 && ip link set eth2 up
      changed_when: true
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r1 의 eth2 MTU 를 ' ~ bad_mtu ~ ' 로 낮췄다. 인접이 ExStart 에서 멈추고 트래픽은 백업으로 돈다.'
             if scenario_action | default('break') == 'break'
             else 'r1 eth2 MTU 복구 완료 (' ~ good_mtu ~ '). 인접이 Full 로 돌아오는 데 몇 초 걸린다.' }}

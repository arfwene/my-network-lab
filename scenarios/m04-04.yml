---
# M4-04 : Hello 타이머 불일치 (r3-r4)
#   증상  : 백업 경로의 인접이 서지 않는다. Area·주소·MTU 는 전부 정상이다.
#           통신은 정상 (주 경로가 살아 있다) — m04-01 과 증상이 거의 같다.
#   한줄  : 백업 경로 인접이 안 섬
#   목표  : 백업 경로(r3↔r4)의 인접이 Full 이다
#   정답  : r3 의 eth2 Hello 간격이 5초라 r4(10초)와 맞지 않는다.
#           show ip ospf interface 의 "Timer intervals configured" 줄을 양쪽에서 비교하면 보인다.
#   노림수: 같은 증상, 다른 원인. 체크리스트를 순서대로 밟아야만 구분된다. (D5)
- name: "scenario m04-04 :: Hello 타이머 불일치"
  hosts: r3
  become: true
  gather_facts: false
  vars:
    bad_hello: 5
  tasks:
    - name: Hello 간격을 어긋나게 한다
      ansible.builtin.command: >-
        vtysh -c "conf t" -c "interface eth2"
        -c "ip ospf hello-interval {{ bad_hello }}"
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: Hello 간격 복구
      ansible.builtin.command: >-
        vtysh -c "conf t" -c "interface eth2"
        -c "no ip ospf hello-interval"
      changed_when: true
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r3 의 eth2(→r4) Hello 간격을 ' ~ bad_hello ~ '초로 바꿨다. m04-01 과 증상이 비슷하니 체크리스트를 순서대로 밟게 할 것.'
             if scenario_action | default('break') == 'break'
             else 'r3 eth2 Hello 간격 복구 완료 (기본 ' ~ routing.ospf.timers.hello ~ '초).' }}

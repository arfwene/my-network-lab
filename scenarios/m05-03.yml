---
# M5-03 : 둘 다 자기가 MASTER 라고 한다
#   증상  : 통신이 되다 말다 한다. 두 라우터가 다 Master 라고 말한다.
#   한줄  : 스플릿 브레인 — 같은 주소를 둘이 동시에 든다
#   목표  : r1 만 MASTER, r3 는 BACKUP
#   정답  : sw1 의 r3 쪽 트렁크에서 VLAN 이 빠졌다. 광고가 서로 안 닿아
#           각자 상대가 죽은 줄 안다. show vrrp 의 Advertisements Rx 가 0.
#   노림수: VRRP 문제로 보이지만 원인은 L2 다. 증상이 난 계층에서만 찾지 말 것.
- name: "scenario m05-03 :: 둘 다 MASTER (스플릿 브레인)"
  hosts: sw1
  become: true
  gather_facts: false
  vars:
    trunk: "{{ lab_interfaces | selectattr('peer', 'defined') | selectattr('peer', 'equalto', 'r3') | first }}"
    vids: ["{{ ipv4.segments.vlan10.vlan }}", "{{ ipv4.segments.vlan20.vlan }}"]
  tasks:
    - name: 백업 게이트웨이 쪽 트렁크에서 사용자 VLAN 을 뺀다
      ansible.builtin.command: bridge vlan del dev {{ trunk.name }} vid {{ item }}
      loop: "{{ vids }}"
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: 트렁크 허용 VLAN 복구
      ansible.builtin.command: bridge vlan add dev {{ trunk.name }} vid {{ item }}
      loop: "{{ vids }}"
      changed_when: true
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'sw1 의 r3 쪽 트렁크에서 사용자 VLAN 을 뺐다. 두 라우터가 서로의 광고를 못 받아 둘 다 MASTER 가 된다.'
             if scenario_action | default('break') == 'break'
             else 'sw1 트렁크 복구 완료. show vrrp 로 Master 하나 · Backup 하나를 확인할 것.' }}

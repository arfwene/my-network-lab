---
# M1-03 : pc1 에 잘못된 정적 ARP 등록
#   증상  : 링크 정상, sw1 의 MAC 테이블 정상. 그런데 pc1 -> pc2 ping 무응답.
#           `ip neigh` 에는 상대가 버젓이 등록돼 있다 (PERMANENT).
#   정답  : ARP 항목의 MAC 이 실제 pc2 의 MAC 과 다르다.
#           프레임이 엉뚱한 MAC 으로 나가 아무도 받지 않는다.
#   노림수: ip neigh 에 항목이 있다고 정상이 아니다. **값**을 확인해야 한다. (B4)
- name: "scenario m01-03 :: 잘못된 정적 ARP"
  hosts: pc1
  become: true
  gather_facts: false
  vars:
    target_ip: "{{ (hostvars['pc2'].lab_interfaces | selectattr('ipv4', 'defined') | first).ipv4.split('/')[0] }}"
  tasks:
    - name: 잘못된 MAC 으로 정적 ARP 등록
      ansible.builtin.command: "ip neigh replace {{ target_ip }} lladdr 52:54:00:de:ad:99 dev eth1 nud permanent"
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: 정적 ARP 제거
      ansible.builtin.command: "ip neigh del {{ target_ip }} dev eth1"
      changed_when: true
      failed_when: false
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'pc1 의 ARP 테이블에 pc2(' ~ target_ip ~ ') 를 가짜 MAC 으로 박아뒀다. 링크도 스위치도 정상이다.'
             if scenario_action | default('break') == 'break'
             else 'pc1 ARP 복구 완료. ip neigh flush 도 함께 권장.' }}

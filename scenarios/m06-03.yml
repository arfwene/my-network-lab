---
# M6-03 : IPv6 주소 중복 -> DAD 실패
#   증상  : pc1 의 IPv6 주소가 설정에는 있는데 전혀 동작하지 않는다.
#           ip -6 addr show eth1 에 `dadfailed` 라는 낯선 표시가 붙어 있다.
#   한줄  : pc1 IPv6 주소에 dadfailed
#   목표  : pc1 의 IPv6 주소가 살아나고 통신이 된다
#   정답  : 같은 세그먼트의 r1 이 pc1 과 같은 IPv6 주소를 갖고 있다.
#           IPv6 는 주소를 쓰기 전에 DAD(중복 검사)를 하고, 중복이면 그 주소를 포기한다.
#   노림수: IPv4 에 없던 종류의 장애. IPv4 였다면 둘 다 쓰다가 간헐 장애가 났을 것이다. (C4)
#   ※ 두 개의 play 로 나뉜다 — 중복을 만든 뒤 pc1 이 DAD 를 다시 하도록 링크를 재기동한다.
- name: "scenario m06-03 :: (1/2) r1 에 pc1 의 주소를 중복 배정"
  hosts: r1
  become: true
  gather_facts: false
  vars:
    dup: "{{ ipv6.segments.vlan10.hosts.pc1 }}"
  tasks:
    - name: 중복 주소 추가
      ansible.builtin.command: "ip -6 addr add {{ dup }}/64 dev eth1.10"
      changed_when: true
      failed_when: false
      when: scenario_action | default('break') == 'break'

    - name: 중복 주소 제거
      ansible.builtin.command: "ip -6 addr del {{ dup }}/64 dev eth1.10"
      changed_when: true
      failed_when: false
      when: scenario_action | default('break') != 'break'

- name: "scenario m06-03 :: (2/2) pc1 이 DAD 를 다시 하게 한다"
  hosts: pc1
  become: true
  gather_facts: false
  tasks:
    - name: 링크 재기동 (DAD 는 주소를 붙일 때 한 번만 한다)
      ansible.builtin.shell: |
        # M6 는 **직접 만드는 단계**다. pc1 의 IPv6 주소는 교육생이 3.2 에서 손으로
        # 붙인 것이라 netplan 에는 없다. 그대로 링크를 내렸다 올리고 netplan apply
        # 를 하면 그 주소가 통째로 사라진다. 그러면
        #   · 주입했을 때의 증상이 `dadfailed` 가 아니라 "주소가 아예 없다" 가 되고
        #   · [복구] 를 눌러도 주소가 돌아오지 않아 검사가 3/9 에서 멈춘다
        # 그래서 지금 붙어 있는 글로벌 주소를 적어 두었다가 그대로 다시 붙인다.
        # 다시 붙이는 순간 DAD 가 한 번 더 돌아, 이 시나리오가 보여 주려는 것이
        # 그대로 성립한다.
        saved=$(ip -6 -o addr show dev eth1 scope global | awk '{print $4}')
        # 기본 경로도 마찬가지다 (3.6 에서 손으로 넣는다). 링크가 내려가면 함께 사라진다.
        gw=$(ip -6 route show default dev eth1 | awk '{print $3}' | head -1)
        ip link set eth1 down
        sleep 2
        ip link set eth1 up
        sleep 3
        netplan apply || true
        sleep 2
        for a in $saved; do ip -6 addr add "$a" dev eth1 2>/dev/null || true; done
        sleep 3
        if [ -n "$gw" ]; then ip -6 route replace default via "$gw" dev eth1 2>/dev/null || true; fi
      changed_when: true

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r1 에 pc1 과 같은 IPv6 주소를 붙이고 pc1 링크를 재기동했다. pc1 의 주소가 dadfailed 가 된다.'
             if scenario_action | default('break') == 'break'
             else 'pc1 IPv6 주소 복구 완료. ip -6 addr show eth1 에 dadfailed 가 없어야 한다.' }}

---
# M3-02 : r1 의 next-hop 을 존재하지 않는 이웃으로 변경
#   증상  : pc1 -> web 무응답. r1 에 Site-B 경로가 **분명히 있다**.
#   정답  : 그 경로에 `>*` 가 없다. next-hop(r3 쪽 주소)이 이 단계에는 존재하지 않아
#           경로를 해석할 수 없고, 따라서 커널에 올라가지 않는다.
#   노림수: "테이블에 있다"와 "쓰인다"는 다르다. show ip route 를 읽을 줄 아는가. (D2)
- name: "scenario m03-02 :: 경로는 있는데 쓰이지 않는다"
  hosts: r1
  become: true
  gather_facts: false
  vars:
    site_b: "{{ ipv4.summary['site-b'].cidr }}"
    good: "{{ ipv4.p2p['r1-r2'].addresses.r2 }}"
    bad: "{{ ipv4.p2p['r1-r3'].addresses.r3 }}"
  tasks:
    - name: next-hop 을 없는 이웃으로 바꾼다
      ansible.builtin.command: >-
        vtysh -c "conf t"
        -c "no ip route {{ site_b }} {{ good }}"
        -c "ip route {{ site_b }} {{ bad }}"
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: next-hop 복구
      ansible.builtin.command: >-
        vtysh -c "conf t"
        -c "no ip route {{ site_b }} {{ bad }}"
        -c "ip route {{ site_b }} {{ good }}"
      changed_when: true
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r1 의 ' ~ site_b ~ ' next-hop 을 ' ~ bad ~ ' (M4 에서야 생기는 이웃) 로 바꿨다. 경로는 보이지만 쓰이지 않는다.'
             if scenario_action | default('break') == 'break'
             else 'r1 next-hop 복구 완료 (' ~ good ~ ').' }}

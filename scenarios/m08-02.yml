---
# M8-02 : DNS 서버 중지
#   증상  : 이름으로는 아무것도 안 된다. IP 로는 전부 정상이다.
#   한줄  : 이름으로는 아무것도 안 됨
#   목표  : 이름 해석이 된다
#   정답  : 판별표의 첫 줄 — 이름 해석 X / IP 직접 O = DNS 문제.
#           dig 가 응답 없이 타임아웃 난다.
#   노림수: 두 줄의 명령으로 범위를 반 가르는 훈련. (F1)
- name: "scenario m08-02 :: DNS 서버 장애"
  hosts: dns
  become: true
  gather_facts: false
  tasks:
    - name: named 중지 / 기동
      ansible.builtin.systemd:
        name: named
        state: "{{ 'stopped' if scenario_action | default('break') == 'break' else 'started' }}"

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'dns 노드의 named 를 내렸다. 교육생에게는 "이름으로 아무것도 안 된다" 고만 알릴 것.'
             if scenario_action | default('break') == 'break'
             else 'named 복구 완료.' }}

---
# M10-04 : FTP 서버가 사설 주소를 밖에 알려 준다
#   증상  : 외부에서 FTP 접속(21)은 되는데 전송만 안 된다. **내부에서는 정상.**
#   한줄  : 외부 FTP 전송만 안 됨
#   목표  : 외부에서 FTP 파일 전송이 된다
#   정답  : vsftpd 의 pasv_address 가 빠져 227 응답에 사설 IP 가 실려 나간다.
#           외부 클라이언트는 그 주소로 갈 방법이 없다 (사설은 라우팅되지 않는다).
#   노림수: NAT 는 헤더만 바꾼다. 본문에 주소를 실어 나르는 프로토콜의 대가. (F5) ★
- name: "scenario m10-04 :: 227 응답에 사설 IP 가 실린다"
  hosts: ftp
  become: true
  gather_facts: false
  tasks:
    - name: pasv_address 주석 처리 / 복구
      ansible.builtin.replace:
        path: /etc/vsftpd.conf
        regexp: "^{{ '#' if scenario_action | default('break') != 'break' else '' }}pasv_address="
        replace: "{{ '' if scenario_action | default('break') != 'break' else '#' }}pasv_address="

    - name: vsftpd 재시작
      ansible.builtin.systemd:
        name: vsftpd
        state: restarted

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'ftp 의 pasv_address 를 껐다. **내부에서는 정상** 이라는 점이 결정적 단서다 — 그 대비를 짚어 줄 것.'
             if scenario_action | default('break') == 'break'
             else 'ftp pasv_address 복구 완료 (grep pasv_address /etc/vsftpd.conf).' }}

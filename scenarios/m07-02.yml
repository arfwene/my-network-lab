---
# M7-02 : nginx 중지
#   증상  : HTTP 접속이 **즉시** Connection refused.
#   한줄  : HTTP 가 즉시 refused
#   목표  : pc1 에서 web 의 HTTP 가 응답한다
#   정답  : 감별표 ③ — 포트를 듣는 서비스가 없다. 캡처에 SYN -> RST.
#   노림수: "즉시 거부" 가 **네트워크는 완벽하다**는 증거임을 말할 수 있는가. (E3)
- name: "scenario m07-02 :: 서비스가 안 떠 있다"
  hosts: web
  become: true
  gather_facts: false
  tasks:
    - name: nginx 중지
      ansible.builtin.systemd:
        name: nginx
        state: "{{ 'stopped' if scenario_action | default('break') == 'break' else 'started' }}"

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'web 의 nginx 를 내렸다. 교육생이 "즉시 거부 = 네트워크는 정상" 까지 말하는지 볼 것.'
             if scenario_action | default('break') == 'break'
             else 'web nginx 복구 완료.' }}

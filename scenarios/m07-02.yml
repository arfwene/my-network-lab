---
# M7-02 : r4 에서 특정 출발지의 HTTP 만 버린다
#   증상  : **pc1 에서만** web 의 HTTP 가 안 된다. ping 은 정상이고 pc2 는 멀쩡하다.
#   한줄  : pc1 에서만 HTTP 안 됨
#   목표  : pc1 에서 web 의 HTTP 가 응답한다
#   정답  : r4 의 forward 체인에서 pc1 출발 tcp/80 이 DROP 된다.
#           r4 의 **들어오는 인터페이스에는 보이는데 나가는 인터페이스에는 안 보인다**.
#   노림수: 다중 지점 캡처 + 이등분. 한 장비에서도 양쪽을 봐야 한다는 것. (H1, H3) ★
- name: "scenario m07-02 :: 어느 구간에서 사라진다"
  hosts: r4
  become: true
  gather_facts: false
  vars:
    src: "{{ ipv4.segments.vlan10.hosts.pc1 }}"
  tasks:
    - name: forward 체인에 DROP 규칙 추가
      ansible.builtin.shell: |
        nft add table inet labbreak
        nft add chain inet labbreak forward '{ type filter hook forward priority 0; }'
        nft add rule inet labbreak forward ip saddr {{ src }} tcp dport 80 drop
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: 규칙 제거
      ansible.builtin.command: "nft delete table inet labbreak"
      changed_when: true
      failed_when: false
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r4 에서 ' ~ src ~ ' 출발 HTTP 만 버리게 했다. ping 과 pc2 는 정상이다. show 명령 금지 규칙을 반드시 붙일 것.'
             if scenario_action | default('break') == 'break'
             else 'r4 방화벽 규칙 제거 완료 (nft list ruleset 으로 확인).' }}

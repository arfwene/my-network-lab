---
# M6-01 : pc1 의 IPv6 기본 경로 삭제
#   증상  : IPv4 는 전부 정상. IPv6 만 게이트웨이 밖으로 못 나간다.
#           ping6 <게이트웨이> 는 되고, ping6 <web> 은 안 된다.
#   한줄  : IPv6 만 밖으로 못 나감
#   목표  : pc1 에서 web 으로 IPv6 통신이 된다
#   정답  : ip -6 route show default 가 비어 있다. IPv4 기본 경로와는 별개다.
#   노림수: dual-stack 은 라우팅 테이블이 두 벌이다. 한쪽만 죽을 수 있다. (C4)
- name: "scenario m06-01 :: IPv6 기본 경로 누락"
  hosts: pc1
  become: true
  gather_facts: false
  vars:
    gw6: "{{ ipv6.segments.vlan10.gateway }}"
  tasks:
    - name: IPv6 기본 경로 삭제
      ansible.builtin.command: "ip -6 route del default"
      changed_when: true
      failed_when: false
      when: scenario_action | default('break') == 'break'

    - name: IPv6 기본 경로 복구
      ansible.builtin.command: "ip -6 route replace default via {{ gw6 }} dev eth1"
      changed_when: true
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'pc1 의 IPv6 기본 경로를 지웠다. IPv4 는 멀쩡하므로 "IPv6 만 안 된다"고만 알릴 것.'
             if scenario_action | default('break') == 'break'
             else 'pc1 IPv6 기본 경로 복구 완료 (via ' ~ gw6 ~ ').' }}

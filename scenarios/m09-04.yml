---
# M9-04 : FTP Passive 모드 비활성화
#   증상  : FTP 접속(21)은 되는데 파일 목록·전송만 안 된다.
#   한줄  : FTP 접속은 되고 전송만 안 됨
#   목표  : FTP 로 파일 목록과 전송이 된다
#   정답  : 데이터 채널 문제다. vsftpd 의 pasv_enable 이 꺼져 있어
#           클라이언트가 PASV 를 요청해도 거부된다. Active(`curl -P -`)로는 성공한다.
#   노림수: FTP 는 연결이 **두 개**라는 것. M10 의 NAT 실습 예고편. (F4)
- name: "scenario m09-04 :: FTP 데이터 채널 장애"
  hosts: ftp
  become: true
  gather_facts: false
  tasks:
    - name: Passive 모드 끄기 / 켜기
      ansible.builtin.replace:
        path: /etc/vsftpd.conf
        regexp: "^pasv_enable=(YES|NO)$"
        replace: "pasv_enable={{ 'NO' if scenario_action | default('break') == 'break' else 'YES' }}"

    - name: vsftpd 재시작
      ansible.builtin.systemd:
        name: vsftpd
        state: restarted

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'vsftpd 의 Passive 를 껐다. 21 은 응답하지만 전송이 안 된다. Active(curl -P -)로는 되는 것을 발견하면 대성공.'
             if scenario_action | default('break') == 'break'
             else 'vsftpd Passive 복구 완료 (pasv_enable=YES).' }}

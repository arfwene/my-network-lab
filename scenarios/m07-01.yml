---
# M7-01 : r2 의 출력 인터페이스에 패킷 손실 주입 (netem)
#   증상  : 통신은 된다. 그런데 "가끔 느리다". ping 으로는 잘 안 드러난다.
#   한줄  : 통신은 되는데 가끔 느림
#   목표  : pc1 → web 에 손실·지연이 없다
#   정답  : 중간 구간에서 패킷이 버려지고 있고, TCP 가 재전송으로 메우고 있다.
#           캡처에서 **같은 seq 가 반복**되는 것으로만 보인다.
#   노림수: "안 된다" 가 아니라 "느리다" 를 캡처로 진단하기. (H1, H3)
#   ※ sch_netem 커널 모듈이 필요하다. 없는 환경이면 m06-01 로 대체할 것.
- name: "scenario m07-01 :: 중간 구간 패킷 손실"
  hosts: r2
  become: true
  gather_facts: false
  vars:
    loss: "30%"
  tasks:
    - name: 손실 주입
      ansible.builtin.command: "tc qdisc replace dev eth2 root netem loss {{ loss }}"
      changed_when: true
      when: scenario_action | default('break') == 'break'

    - name: 손실 제거
      ansible.builtin.command: "tc qdisc del dev eth2 root"
      changed_when: true
      failed_when: false
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'r2 의 eth2 에 ' ~ loss ~ ' 손실을 걸었다. 교육생에게는 "가끔 느리다" 로만 알리고 show 명령을 금지할 것.'
             if scenario_action | default('break') == 'break'
             else 'r2 eth2 손실 제거 완료 (tc qdisc show dev eth2 로 확인).' }}

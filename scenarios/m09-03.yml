---
# M9-03 : 클라이언트의 이름 서버 설정 오류
#   증상  : 이름 해석이 **느리게** 실패한다 (타임아웃). IP 는 정상.
#           m09-02 와 증상이 비슷하다.
#   한줄  : 이름 해석이 느리게 실패
#   목표  : 이름 해석이 지체 없이 된다
#   정답  : pc1 의 /etc/resolv.conf 가 없는 주소를 가리킨다.
#           `dig @<진짜 DNS>` 는 되는데 그냥 `dig` 는 안 된다 — 이 차이가 결정적이다.
#   노림수: 서버 문제와 클라이언트 문제를 가르는 한 가지 확인법. (F1)
- name: "scenario m09-03 :: 클라이언트 DNS 설정 오류"
  hosts: pc1
  become: true
  gather_facts: false
  vars:
    bad: "{{ dns.server.split('.')[:3] | join('.') }}.99"
  tasks:
    - name: resolv.conf 를 없는 서버로 바꾼다
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        follow: false
        mode: "0644"
        content: |
          # 장애 주입 (m09-03)
          search {{ lab_domain }}
          nameserver {{ bad }}
      when: scenario_action | default('break') == 'break'

    - name: resolv.conf 복구
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        follow: false
        mode: "0644"
        content: |
          # 자동 생성 (Ansible / roles/host)
          search {{ lab_domain }}
          nameserver {{ dns.server }}
          nameserver {{ dns.server_v6 }}
      when: scenario_action | default('break') != 'break'

    - name: 안내
      ansible.builtin.debug:
        msg: >-
          {{ 'pc1 의 nameserver 를 ' ~ bad ~ ' 로 바꿨다. m09-02 와 증상이 비슷하니 dig @<서버> 와 dig 의 차이를 스스로 찾게 할 것.'
             if scenario_action | default('break') == 'break'
             else 'pc1 resolv.conf 복구 완료 (' ~ dns.server ~ ').' }}

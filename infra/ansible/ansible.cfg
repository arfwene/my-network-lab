[defaults]
inventory            = inventory/lab1
roles_path           = roles
host_key_checking    = False
# yaml 콜백은 ansible-core 2.17+ 에서 community.general 로 이동했다.
# 추가 컬렉션 없이 동작하도록 기본 콜백을 쓴다.
stdout_callback      = default
interpreter_python   = /usr/bin/python3
retry_files_enabled  = False
# 랩은 13대다. 기본값 5로는 세 번에 나눠 돌아 그만큼 느려진다 —
# 한 번에 다 붙을 만큼 올린다. 랩 노드는 전부 같은 Proxmox 안의 작은 VM 이다.
forks                = 15
display_skipped_hosts = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s

---
# networkctl reload 는 .network 파일만 다시 읽는다. networkd 를 재시작하면
# 관리망까지 함께 흔들려 ansible 접속이 끊길 수 있다.
- name: reload networkd
  ansible.builtin.command: networkctl reload
  changed_when: true
  failed_when: false
  notify: restart lab-switch

- name: restart lab-switch
  # systemd 모듈은 실패했을 때 "Job for lab-switch.service failed" 한 줄만 준다.
  # 왜 죽었는지는 그 노드의 journal 에만 남는다 — 콘솔 화면만 보는 사람에게는
  # 아무 말도 안 한 것과 같다. 스크립트는 이미 이유를 적어 두었으므로 같이 꺼내 온다.
  ansible.builtin.shell: |
    systemctl daemon-reload
    systemctl restart lab-switch && exit 0
    echo "---- lab-switch 가 남긴 말 ----" >&2
    journalctl -u lab-switch -n 20 --no-pager >&2
    exit 1
  changed_when: true

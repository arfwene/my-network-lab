---
# FRRouting — vtysh 는 Cisco IOS 명령을 거의 그대로 쓴다.
#   show ip route / show ip ospf neighbor / show running-config
- name: FRR 데몬 활성화
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: "^{{ item }}="
    line: "{{ item }}=yes"
  loop: [zebra, staticd, ospfd, ospf6d, vrrpd]
  notify: restart frr

- name: vtysh 통합 설정 사용
  ansible.builtin.lineinfile:
    path: /etc/frr/vtysh.conf
    line: "service integrated-vtysh-config"
    create: true
    mode: "0640"
    owner: frr
    group: frrvty

# VRRP (M5) — vrrpd 는 **가상 MAC 을 단 macvlan** 을 보고 붙는다.
#   가상 IP 를 인터페이스에 직접 붙이지 않는 이유가 이것이다. 장애가 나서
#   BACKUP 이 MASTER 가 되면 IP 뿐 아니라 **MAC 까지 그대로 넘어가므로**,
#   단말의 ARP 캐시를 건드리지 않아도 통신이 이어진다.
- name: VRRP 가상 MAC 인터페이스 생성
  ansible.builtin.shell: |
    set -e
    dev={{ item.vrrp.device }}
    vip={{ item.vrrp.virtual_ip }}/{{ item.ipv4.split('/')[1] }}
    if ! ip link show "$dev" >/dev/null 2>&1; then
      ip link add "$dev" link {{ item.name }} address {{ item.vrrp.virtual_mac }} \
         type macvlan mode bridge
      echo created
    fi
    # 가상 IP 는 **양쪽 다** 이 장치에 붙인다. vrrpd 는 주소를 옮기지 않고
    # 이 장치를 올렸다 내렸다 한다 — BACKUP 인 쪽은 내려가 있어 주소가 겹치지
    # 않는다. FRR 문서가 정한 방식이다.
    ip addr replace "$vip" dev "$dev"
    ip link set "$dev" up
  register: vrrp_dev
  changed_when: "'created' in vrrp_dev.stdout"
  loop: "{{ lab_interfaces | selectattr('active') | selectattr('vrrp', 'defined') | list }}"
  loop_control: {label: "{{ item.name }} -> {{ item.vrrp.device }}"}
  notify: restart frr

- name: 설정에 없는 VRRP 인터페이스 제거
  ansible.builtin.shell: |
    keep="{{ lab_interfaces | selectattr('active') | selectattr('vrrp', 'defined')
             | map(attribute='vrrp.device') | join(' ') }}"
    for d in /sys/class/net/*; do
      i=$(basename "$d")
      grep -q '^DEVTYPE=macvlan$' "$d/uevent" 2>/dev/null || continue
      case " $keep " in *" $i "*) continue ;; esac
      ip link del "$i" 2>/dev/null || true
      echo "removed $i"
    done
  register: vrrp_prune
  changed_when: "'removed' in vrrp_prune.stdout"
  notify: restart frr

- name: frr.conf 배포
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: restart frr

- name: 랩 계정을 frr 그룹에 추가 (sudo 없이 vtysh 조회)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: [frr, frrvty]
    append: true

- name: FRR 활성화
  ansible.builtin.systemd:
    name: frr
    enabled: true
    state: started

# 여기서 handler 를 먼저 돌린다. 아래 대기가 **재시작된 뒤의** 상태를 봐야 한다.
- name: FRR 재시작을 먼저 끝낸다
  ansible.builtin.meta: flush_handlers

- name: OSPF 인접이 설 때까지 기다린다
  # "설정을 올렸다" 와 "프로토콜이 수렴했다" 는 다른 말이다. OSPF 는 DR 선출과
  # DBD 교환에 수십 초가 걸린다. 그 사이에 [검증] 을 누르면 멀쩡한 랩이
  # ExStart 로 잡혀 떨어진다 — 실제로 M4 검사 9개 중 5개가 그렇게 떨어졌다.
  # 적용 버튼이 "끝났다" 고 말하려면 여기까지 끝나 있어야 한다.
  #
  # 인접이 아직 하나도 없는 단계(M3 이하 · edge)는 기다릴 것이 없으므로 통과시킨다.
  # 머리글 앞에 빈 줄이 붙어 나오므로 IP 로 시작하는 줄만 본다.
  # IPv6(OSPFv3)도 함께 본다. M6 부터는 이쪽이 안 서면 IPv6 통신이 통째로 죽는데,
  # IPv4 만 보고 "수렴했다" 고 넘어가면 검증이 또 이른 판정을 하게 된다.
  ansible.builtin.shell: |
    rows=$(vtysh -c 'show ip ospf neighbor' 2>/dev/null | awk '$1 ~ /^[0-9]+\./')
    if [ -n "$rows" ] && printf '%s\n' "$rows" | grep -qv Full; then exit 1; fi
    r6=$(vtysh -c 'show ipv6 ospf6 neighbor' 2>/dev/null | awk '$1 ~ /^[0-9]+\./')
    if [ -n "$r6" ] && printf '%s\n' "$r6" | grep -qv Full; then exit 1; fi
    # 정적 경로도 RIB 에 올라와 있어야 한다. 설정 파일에 적은 수만큼 보여야
    # "적용이 끝났다" 고 말할 수 있다. M3 검사가 갓 만든 랩에서만 r2·r4 의
    # 경로 항목에서 떨어지던 것이 이것이었다 — 두 번째로 돌리면 통과한다.
    #
    # 덤으로 **조용히 거부된 설정**도 여기서 걸린다. FRR 은 이해 못 한 줄을
    # 오류 없이 버리는데(줄 끝 주석이 그랬다), 그러면 이 수가 안 맞는다.
    want=$(grep -cE '^ip route ' /etc/frr/frr.conf 2>/dev/null || echo 0)
    if [ "$want" -gt 0 ]; then
      got=$(vtysh -c 'show ip route static' 2>/dev/null | grep -cE '^S' || echo 0)
      [ "$got" -ge "$want" ] || exit 1
    fi
    exit 0
  register: ospf_conv
  until: ospf_conv.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false

---
# 모든 노드 공통: 인터페이스 명명 · 관리망 · 헬퍼

- name: 단계 인덱스 계산
  ansible.builtin.set_fact:
    stage_idx: "{{ stages.index(config_stage | default(lab_stage)) }}"
    ipv6_enabled: "{{ stages.index(config_stage | default(lab_stage)) >= stages.index('m6') }}"

- name: 호스트명 설정 (랩 번호는 게스트 안에서 보이지 않는다 — 교재 일관성)
  ansible.builtin.hostname:
    name: "{{ node }}"

- name: /etc/hosts 에 자기 이름 등록
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ node }}.{{ lab_domain }} {{ node }}"

# cloud-init 이 매 부팅마다 netplan 을 덮어쓰면 우리 설정이 날아간다.
- name: cloud-init 의 네트워크 관리 비활성화
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

- name: cloud-init 이 만든 netplan 제거
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: netplan apply

# 설계에 포트가 하나 더 생기면(M5 의 sw1 eth4 · r3 eth3) Proxmox 가 NIC 을
# 꽂아 주지만, 이름은 부팅 때 정해진다 — 돌고 있는 노드에서는 ens21 처럼
# 원래 이름 그대로 나타난다. 그러면 netplan 도 스위치 스크립트도 그 포트를
# 못 찾는다. MAC 으로 짝을 지어 여기서 이름을 맞춰 준다. 재부팅이 필요 없다.
- name: 새로 꽂힌 포트의 이름을 설계대로 맞춘다
  ansible.builtin.shell: |
    set -e
    want="{{ item.name }}"; mac="{{ item.mac }}"
    cur=$(ip -o link | awk -v m="$mac" '$0 ~ m {sub(":$","",$2); print $2; exit}')
    [ -z "$cur" ] && exit 0
    [ "$cur" = "$want" ] && exit 0
    ip link set "$cur" down
    ip link set "$cur" name "$want"
    ip link set "$want" up
    echo "renamed $cur -> $want"
  register: nic_rename
  changed_when: "'renamed' in nic_rename.stdout"
  loop: "{{ lab_interfaces | selectattr('active') | selectattr('mac') | list }}"
  loop_control: {label: "{{ item.name }}"}

# 설계가 말하는 물리 포트가 게스트에 아예 없으면 **여기서 멈춘다.**
#
#   [랩 생성] 은 단계와 상관없이 **항상 전체 토폴로지**를 꽂는다 (gen-tfvars 는
#   m11 로 돈다). 그래서 모듈이 올라간다고 다시 누를 일은 없다. 이 자리에 걸리는
#   경우는 하나뿐이다 — **설계가 바뀐 뒤** 그 전에 만들어 둔 랩을 계속 쓰는 것.
#   실제로 320af1b 가 r3–sw1 링크를 더하면서 sw1 eth4 · r3 eth3 이 생겼고,
#   그 전에 만든 VM 에는 그 NIC 이 없다. 그 상태로 [이 모듈 적용] 을 누르면:
#
#       RUNNING HANDLER [switch : restart lab-switch]
#       fatal: [sw1]: Unable to restart service lab-switch: Job for ... failed
#
#   스위치 스크립트가 없는 포트를 30초 기다린 뒤 죽은 것인데, **무엇이 없어서인지는
#   노드의 journal 에만 있다.** 화면만 보는 사람은 두 시간을 헤맨다.
#   그래서 포트가 없다는 사실을 맨 앞에서, 이름을 대고, 다음에 누를 버튼과 함께 말한다.
- name: 설계에 있는 포트가 실제로 꽂혀 있는가
  ansible.builtin.shell: |
    miss=
    for w in {{ lab_interfaces | selectattr('active') | selectattr('mac')
                | map(attribute='name') | join(' ') }}; do
      [ -e "/sys/class/net/$w" ] || miss="$miss $w"
    done
    [ -n "$miss" ] && echo "없음:$miss"
    exit 0
  register: nic_have
  changed_when: false

- name: 없는 포트가 있으면 멈춘다 (Terraform 이 아직 안 꽂았다)
  ansible.builtin.assert:
    that: "'없음:' not in nic_have.stdout"
    fail_msg: >-
      {{ node }} 에 설계가 말하는 포트가 없다 —
      {{ nic_have.stdout | replace('없음:', '') | trim }}.
      이 랩을 만든 뒤에 설계가 바뀌어 NIC 이 늘어난 것이다. NIC 을 꽂는 일은
      Ansible 이 아니라 Terraform 이 한다. 콘솔에서 [랩 생성] 을 한 번 누른 뒤
      [이 모듈 적용] 을 다시 누를 것 — [랩 생성] 은 이미 있는 랩을 지우지 않고
      모자란 것만 채운다. 평소에는(설계가 그대로면) 다시 누를 일이 없다.
    quiet: true

- name: netplan 설정 배포
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: /etc/netplan/50-lab.yaml
    mode: "0600"
  notify: netplan apply

# 반대로, 설정에 **있는데 없는** VLAN 서브인터페이스는 netplan 을 다시 돌려 되살린다.
#
#   만드는 것은 netplan 의 일이다. 그런데 netplan 은 파일이 바뀔 때만 handler 로
#   돌기 때문에, 파일은 그대로인데 장치나 주소만 사라진 상태에서는 아무도
#   되살리지 않는다. 그러면 뒤따르는 역할이 이렇게 죽는다:
#
#       failed: [r3] (item=eth3.10 -> eth3.10-10)
#       stderr: Cannot find device "eth3.10"
#
#   장치를 지우는 길은 여럿이다 — 아래 정리 작업, 초기화 플레이북, 교육생의 손.
#   지우는 쪽이 여기 있으니 되살리는 쪽도 여기 있는 편이 맞다.
#   **손으로 ip link add 를 하지는 않는다.** 그러면 장치는 생기고 주소는 안 붙어,
#   더 알아보기 어려운 상태가 된다 (실제로 그렇게 만들어 봤다). 주인에게 맡긴다.
- name: 설정에 있는 VLAN 서브인터페이스가 실제로 다 있는가
  ansible.builtin.shell: |
    miss=
    {% for i in lab_interfaces | selectattr('active') | selectattr('parent') %}
    if [ ! -e /sys/class/net/{{ i.name }} ]; then
      miss="$miss {{ i.name }}"
    {% if i.ipv4 %}
    elif ! ip -br addr show {{ i.name }} 2>/dev/null | grep -q '{{ i.ipv4 }}'; then
      miss="$miss {{ i.name }}(주소)"
    {% endif %}
    fi
    {% endfor %}
    [ -n "$miss" ] && echo "없음:$miss"
    exit 0
  register: vlan_missing
  changed_when: "'없음:' in vlan_missing.stdout"
  notify: netplan apply

# 설정에서 빠진 VLAN 서브인터페이스를 직접 지운다.
#
#   단계를 **거슬러 올라갈 때** 필요하다. M2 의 [이 모듈 적용] 은 config_stage 를
#   m1 로 낮춰 r1 의 eth1.10 · eth1.20 을 설정에서 뺀다. 그런데 netplan 이 이미
#   만들어 둔 가상 인터페이스를 지워 주리라 믿을 수 없다 — 판본에 따라 남는다.
#   남으면 초기 구성이어야 할 랩이 **목표 구성인 채로** 교육생 앞에 놓인다.
#
#   handler(netplan apply)는 이 뒤에 돌고, 새 설정에는 이 장치가 없으므로
#   다시 만들어지지 않는다. 목표 구성에서는 지울 것이 없어 아무 일도 하지 않는다.
- name: 설정에 없는 VLAN 서브인터페이스 제거
  ansible.builtin.shell: |
    keep="{{ lab_interfaces | selectattr('active') | selectattr('parent')
             | map(attribute='name') | join(' ') }}"
    for d in /sys/class/net/*.*; do
      i=$(basename "$d")
      [ -e "$d" ] || continue
      grep -q DEVTYPE=vlan "$d/uevent" 2>/dev/null || continue
      case " $keep " in *" $i "*) continue ;; esac
      ip link del "$i" 2>/dev/null || true
      echo "removed $i"
    done
  register: vlan_prune
  changed_when: "'removed' in vlan_prune.stdout"

# --- 접속 키 -----------------------------------------------------------------
#  tags: [keys] 가 붙은 세 작업만 키를 다룬다. 콘솔의 [지금 랩에 반영] 은
#  --tags keys 로 이것만 돌린다 — 키 한 줄 넣자고 랩 전체를 다시 설정하지 않는다.
#  cloud-init 은 VM 을 만들 때 한 번만 키를 넣는다. 교육생이 바뀔 때마다 VM 을 다시
#  만들 수는 없으므로, 여기서 매 설정 적용마다 다시 쓴다.
#  exclusive: 손으로 넣은 키는 지운다 — "랩 초기화"의 의미를 접속 경로까지 넓힌다.
# exclusive 로 쓰기 때문에, 관리자 키가 비어 있으면 **운영 서버 자신의 키까지 지운다.**
# 그러면 이 노드에는 두 번 다시 들어갈 수 없다 (SSH 로만 관리하므로 복구 수단이 없다).
# 여기서 멈추는 편이 낫다.
- name: 관리자 공개키가 있는지 확인 (없으면 잠금 사고가 난다)
  tags: [keys]
  ansible.builtin.assert:
    that: admin_ssh_keys | length > 0
    fail_msg: >-
      배포할 관리자 공개키가 없다. 이대로 authorized_keys 를 덮으면 이 노드에
      다시 접속할 수 없다. config/site.local.yml 의 access.ssh_public_keys 에
      운영 서버 공개키(~/.ssh/id_ed25519.pub)를 넣고 다시 실행할 것.
    quiet: true

- name: 랩 계정 authorized_keys (운영 서버 + 이 랩 교육생)
  tags: [keys]
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ (admin_ssh_keys + (trainee_ssh_keys | map(attribute='key') | list))
             | join('\n') }}"
    exclusive: true
    state: present

- name: 배포된 접속 키 확인용 목록
  tags: [keys]
  ansible.builtin.copy:
    dest: /etc/lab-authorized
    mode: "0644"
    content: |
      # 자동 생성 (roles/common). 이 노드에 접속할 수 있는 사람.
      # 고쳐도 다음 설정 적용 때 되돌아온다.
      운영 서버(Ansible)  : {{ admin_ssh_keys | length }} 개
      {% for t in trainee_ssh_keys %}
      {{ "%-18s"|format(t.username) }} : {{ t.name or "-" }}
      {% endfor %}
      {% if not trainee_ssh_keys %}
      교육생             : 없음 (콘솔에서 공개키를 등록하면 여기 나타난다)
      {% endif %}

- name: IP 포워딩 (라우터·경계 장비만)
  ansible.posix.sysctl:
    name: "{{ item.k }}"
    value: "{{ item.v }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - {k: net.ipv4.ip_forward,             v: "{{ 1 if node_role in ['router','edge'] else 0 }}"}
    - {k: net.ipv6.conf.all.forwarding,    v: "{{ 1 if node_role in ['router','edge'] else 0 }}"}
    # 역경로 검사(rp_filter)를 끈다. 우분투 기본값은 2(느슨) 인데, 그 상태에서는
    # **출발지로 가는 경로가 없는 패킷을 전달하기 전에 버린다.**
    #
    # M3 에서 traceroute 의 3번 홉이 * 로만 나오던 원인이 이것이었다. r4 는
    # ICMP time exceeded 를 분명히 보내는데(캡처로 확인), 돌아오는 길의 r1 이
    # 그것을 버렸다. r1 에게는 요약 경로(10.10.32.0/19)뿐이라 전송 구간
    # 10.10.64.8/30 으로 가는 경로가 없기 때문이다.
    #
    # rp_filter 는 호스트를 지키는 기능이지 이 교육과정의 주제가 아니다.
    # 그리고 실장비 라우터는 통과 트래픽에 이런 검사를 기본으로 걸지 않는다.
    # 켜 두면 진단 트래픽이 아무 말 없이 사라져 교육생이 없는 장애를 쫓는다.
    - {k: net.ipv4.conf.all.rp_filter,     v: "0"}
    - {k: net.ipv4.conf.default.rp_filter, v: "0"}
  loop_control: {label: "{{ item.k }}={{ item.v }}"}

- name: 이미 올라온 인터페이스에도 rp_filter 0 을 적용
  # all·default 를 바꿔도 **이미 만들어진** 인터페이스의 값은 안 바뀐다.
  # 부팅 때 만들어진 eth* 는 예전 값을 그대로 들고 있다.
  ansible.builtin.shell: |
    for f in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 0 > "$f" 2>/dev/null || true; done
  changed_when: true

- name: lab-whereami 헬퍼 배포 (내 인터페이스가 어느 링크에 붙어 있는가)
  # 접속 키만 올릴 때도 함께 깔린다. 온보딩을 마치면 교육생이 곧바로 SSH 로
  # 들어오는데, 그때 이게 없으면 `lab-whereami` 가 "command not found" 로 끝난다.
  # 스크립트는 지금 올라가 있는 주소를 읽으므로, 설정 전에 실행해도 거짓말하지
  # 않고 "아직 설정이 안 올라갔다" 고 알려 준다.
  tags: [keys]
  ansible.builtin.template:
    src: lab-whereami.j2
    dest: /usr/local/bin/lab-whereami
    mode: "0755"

- name: 로그인 배너 (지금 어느 단계인지 항상 보이게)
  # lab-whereami 와 같은 이유로 접속 키와 함께 깔린다. 배너가 말하는 것은
  # "이 랩이 어느 단계 기준으로 만들어졌는가" 이고, 실제로 올라갔는지는
  # lab-whereami 가 답한다 — 배너는 그쪽을 가리킨다.
  tags: [keys]
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    mode: "0644"

---
- name: 어떤 서비스를 올릴지 결정
  ansible.builtin.set_fact:
    svc_active: "{{ stages.index(config_stage | default(lab_stage)) >= stages.index(stage) }}"

# ---------------------------------------------------------------------------
#  nginx 만 config_stage 를 안 본다 (node_active).
#
#  교재 어디에도 nginx 를 올리라는 할 일이 없다. `web` 의 nginx 는 M3 의 목적지고,
#  `inet` 의 nginx 는 "남의 사이트"다 — 둘 다 교육생이 만드는 것이 아니라
#  **랩이 깔아 주는 배경**이다. 그런데 직접 만드는 단계에서는 [이 모듈 적용] 이
#  config_stage 를 한 칸 낮춰 올리므로, 그 배경이 자기 단계에 도달하지 못한다.
#
#    M3  config_stage=m2 < web 의 m3   → web 의 nginx 가 안 뜬다
#    M10 config_stage=m9 < inet 의 m10 → 외부 사이트가 안 뜬다
#
#  M10 3.5 는 `curl http://<외부 사이트>/` 가 200 이 되는 것으로 SNAT 를 증명하는데,
#  듣는 쪽이 없으면 RST 가 돌아온다. 검사 snat-outbound 도 같이 떨어진다.
#  높은 단계까지 갔던 랩을 되돌리면 nginx 가 살아 있어 안 보이던 것이라,
#  **새로 만든 랩에서만** 드러났다.
# ---------------------------------------------------------------------------
- block:
    # ---------------- nginx (web, inet) ----------------
    - name: nginx 사이트 설정
      ansible.builtin.template:
        src: nginx-lab.conf.j2
        dest: /etc/nginx/sites-available/lab.conf
        mode: "0644"
      notify: restart nginx

    - name: nginx 기본 사이트 제거
      ansible.builtin.file: {path: /etc/nginx/sites-enabled/default, state: absent}
      notify: restart nginx

    - name: nginx 사이트 활성화
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lab.conf
        dest: /etc/nginx/sites-enabled/lab.conf
        state: link
      notify: restart nginx

    - name: 콘텐츠 배포
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: nginx 활성화
      ansible.builtin.systemd: {name: nginx, enabled: true, state: started}
  when: "'nginx' in services and node_active"

- block:
    # ---------------- vsftpd (ftp) ----------------
    # passive 포트 범위를 고정해야 방화벽 정책을 쓸 수 있다 — M10 의 핵심
    - name: vsftpd 설정
      ansible.builtin.template:
        src: vsftpd.conf.j2
        dest: /etc/vsftpd.conf
        mode: "0644"
      notify: restart vsftpd

    # vsftpd 의 PAM 설정에는 pam_shells.so 가 들어 있다.
    # 로그인 셸이 /etc/shells 에 없으면 **비밀번호가 맞아도 530 으로 거부**된다.
    # ftpuser 는 SSH 로 못 들어오게 nologin 을 쓰므로, 그 셸을 목록에 등록해 준다.
    #   (셸을 /bin/bash 로 바꾸는 것은 반대 방향의 해결이다 — 계정에 실제 로그인 권한이 생긴다)
    - name: nologin 을 /etc/shells 에 등록 (FTP 로그인 전제 조건)
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: /usr/sbin/nologin
        state: present
        create: true
        mode: "0644"

    - name: FTP 테스트 계정
      ansible.builtin.user:
        name: "{{ service_ports.ftp.test_user }}"
        password: "{{ service_ports.ftp.test_password | password_hash('sha512', 'labsalt') }}"
        shell: /usr/sbin/nologin
        home: /srv/ftp
        create_home: true

    - name: FTP 테스트 파일
      ansible.builtin.copy:
        dest: /srv/ftp/hello.txt
        content: "my-network-lab FTP test file\n"
        owner: "{{ service_ports.ftp.test_user }}"
        mode: "0644"

    - name: vsftpd 활성화
      ansible.builtin.systemd: {name: vsftpd, enabled: true, state: started}
  when: "'vsftpd' in services and svc_active"

- block:
    # ---------------- bind9 (dns) ----------------
    - name: named 옵션
      ansible.builtin.template:
        src: named.conf.options.j2
        dest: /etc/bind/named.conf.options
        mode: "0644"
      notify: restart bind9

    - name: 존 선언
      ansible.builtin.template:
        src: named.conf.local.j2
        dest: /etc/bind/named.conf.local
        mode: "0644"
      notify: restart bind9

    - name: 정방향 존 파일
      ansible.builtin.template:
        src: db.zone.j2
        dest: "/etc/bind/db.{{ dns.zone }}"
        mode: "0644"
      notify: restart bind9

    - name: bind9 활성화
      ansible.builtin.systemd: {name: named, enabled: true, state: started}
  when: "'bind9' in services and svc_active"

# ---------------------------------------------------------------------------
#  단계를 내려갈 때는 **내려야 한다.**
#
#  위 블록들은 `svc_active`(= 그 단계 이상)일 때만 올린다. 내리는 갈래가 없으면,
#  한 번 M9·M10 까지 갔던 랩을 앞으로 되돌려도 서비스가 그대로 살아 있다.
#  M9 를 처음 여는 교육생이 이런 화면을 본다:
#
#      $ dig +short @10.10.40.13 web.lab.local A
#      10.10.40.11          <- 3장에서 만들 것이 이미 다 되어 있다
#
#  그러면 그 모듈이 통째로 사라진다. 랩을 물려받는 다음 기수도 같다.
#  파일까지 지우는 이유 — 서비스만 멈추면 [이 모듈 적용] 한 번에 되살아난다.
# ---------------------------------------------------------------------------
- block:
    - name: 아직 이 단계가 아니면 서비스를 내린다
      ansible.builtin.systemd: {name: "{{ item }}", state: stopped, enabled: false}
      loop: "{{ svc_units }}"
      failed_when: false

    - name: 아직 이 단계가 아니면 만들어 둔 설정도 지운다
      ansible.builtin.file: {path: "{{ item }}", state: absent}
      loop: "{{ svc_files }}"
  vars:
    svc_units: >-
      {{ (['vsftpd'] if 'vsftpd' in services else [])
       + (['named'] if 'bind9' in services else []) }}
    svc_files: >-
      {{ (['/etc/vsftpd.conf'] if 'vsftpd' in services else [])
       + (['/etc/bind/named.conf.local', '/etc/bind/db.' ~ dns.zone]
          if 'bind9' in services else []) }}
  when: not svc_active and (svc_units | length) > 0

---
# 인터넷 경계: NAT + stateful 방화벽 (M10)
- name: nftables 규칙 배포
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: "nft -c -f %s"
  notify: reload nftables
  when: stages.index(config_stage | default(lab_stage)) >= stages.index('m10')

- name: nftables 활성화
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: stages.index(config_stage | default(lab_stage)) >= stages.index('m10')

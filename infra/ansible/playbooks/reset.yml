---
# 랩 초기화 — 교육생이 망가뜨린 것을 그 모듈의 시작 상태로 되돌린다.
#   ansible-playbook -i inventory/lab1 playbooks/reset.yml -e lab_stage=m1
#
# "1분 안에 초기화된다"가 보장되어야 교육생이 실험을 두려워하지 않는다 (PLAN 설계원칙 4).
# 실습 중 손으로 만든 것(정적 ARP, 임시 브리지 포트, 추가 주소)까지 지워야
# "초기화했는데 왜 그대로죠?" 가 생기지 않는다.
- name: "my-network-lab :: 초기화"
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: 실행 중 설정 제거 (FRR)
      ansible.builtin.file: {path: /etc/frr/frr.conf, state: absent}
      when: node_role in ['router', 'edge']

    - name: 방화벽 규칙 비우기
      ansible.builtin.command: nft flush ruleset
      changed_when: true
      failed_when: false
      when: node_role == 'edge'

    - name: 스위치 브리지 삭제 (임시로 꽂은 포트까지 함께 사라진다)
      ansible.builtin.command: "ip link del {{ bridge_name_local }}"
      changed_when: true
      failed_when: false
      # 조건은 반드시 참/거짓이어야 한다. `and <문자열>` 은 그 문자열을
      # 돌려주므로 ansible-core 2.19 부터 거부당한다 — 길이로 비교한다.
      when: node_role == 'switch' and (bridge_name_local | default('', true) | length) > 0

    - name: 손으로 등록한 ARP/NDP 항목 제거
      # M1 실습과 m01-03 시나리오가 정적 ARP 를 남긴다. 이게 남으면 초기화가 무의미하다.
      ansible.builtin.shell: |
        ip neigh flush all || true
        ip -6 neigh flush all || true
      changed_when: true
      failed_when: false

    - name: 인터페이스 주소 비우기 (임시로 추가한 주소 제거)
      # 관리망은 **절대** 건드리지 않는다. 이름으로 고르면 안 된다 —
      # 설정이 아직 안 올라간 노드에서는 관리 NIC 도 eth0 로 보이고,
      # 그러면 `^eth` 에 걸려 초기화가 랩 전체를 잠가 버린다.
      # 실제로 그렇게 13대 중 11대가 접속 불능이 된 적이 있다.
      # 이름은 못 믿으므로 MAC 으로 가려낸다.
      ansible.builtin.shell: |
        for d in /sys/class/net/*; do
          i=$(basename "$d")
          [ "$i" = lo ] && continue
          [ "$(cat "$d/address" 2>/dev/null)" = "{{ mgmt_mac }}" ] && continue
          ip addr flush dev "$i" 2>/dev/null || true
        done
      changed_when: true
      failed_when: false

    - name: 임시로 만든 dummy/vlan 인터페이스 제거
      ansible.builtin.shell: |
        for i in $(ls /sys/class/net); do
          t=$(cat /sys/class/net/$i/uevent 2>/dev/null | grep -c DEVTYPE=vlan || true)
          case "$i" in
            eth*.*) ip link del "$i" 2>/dev/null || true ;;
          esac
        done
      changed_when: true
      failed_when: false

    - name: 링크 강제 up (교육생이 down 시킨 것 복구)
      ansible.builtin.shell: |
        for d in /sys/class/net/*; do
          i=$(basename "$d")
          [ "$i" = lo ] || ip link set "$i" up 2>/dev/null || true
        done
      changed_when: true
      failed_when: false

    - name: 관리망 주소 확인 (초기화가 접속 경로를 끊지 않았는지)
      # 마지막 그물. 위 작업들이 아무리 어긋나도 관리망만은 살아서 나가야 한다 —
      # "랩이 완전히 죽어도 이 경로로는 항상 접속된다" 가 이 랩의 전제이기 때문.
      ansible.builtin.shell: |
        m=""
        for d in /sys/class/net/*; do
          [ "$(cat "$d/address" 2>/dev/null)" = "{{ mgmt_mac }}" ] && m=$(basename "$d")
        done
        [ -n "$m" ] || exit 0
        ip link set "$m" up 2>/dev/null || true
        ip -4 addr show dev "$m" | grep -q "inet {{ mgmt_ip }}/" || \
          ip addr add {{ mgmt_ip }}/{{ mgmt_prefixlen }} dev "$m"
      changed_when: true
      failed_when: false

- name: 설정 재적용
  ansible.builtin.import_playbook: site.yml

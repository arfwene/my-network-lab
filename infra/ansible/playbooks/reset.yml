---
# 랩 초기화 — 교육생이 망가뜨린 것을 그 모듈의 시작 상태로 되돌린다.
#   ansible-playbook -i inventory/lab1 playbooks/reset.yml -e lab_stage=m1
#
# "1분 안에 초기화된다"가 보장되어야 교육생이 실험을 두려워하지 않는다 (PLAN 설계원칙 4).
# 실습 중 손으로 만든 것(정적 ARP, 임시 브리지 포트, 추가 주소)까지 지워야
# "초기화했는데 왜 그대로죠?" 가 생기지 않는다.
- name: "my-network-lab :: 초기화"
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: 실행 중 설정 제거 (FRR)
      ansible.builtin.file: {path: /etc/frr/frr.conf, state: absent}
      when: node_role in ['router', 'edge']

    - name: 방화벽 규칙 비우기
      ansible.builtin.command: nft flush ruleset
      changed_when: true
      failed_when: false
      when: node_role == 'edge'

    - name: 스위치 브리지 삭제 (임시로 꽂은 포트까지 함께 사라진다)
      ansible.builtin.command: "ip link del {{ bridge_name_local }}"
      changed_when: true
      failed_when: false
      # 조건은 반드시 참/거짓이어야 한다. `and <문자열>` 은 그 문자열을
      # 돌려주므로 ansible-core 2.19 부터 거부당한다 — 길이로 비교한다.
      when: node_role == 'switch' and (bridge_name_local | default('', true) | length) > 0

    - name: 손으로 등록한 ARP/NDP 항목 제거
      # M1 실습과 m01-03 시나리오가 정적 ARP 를 남긴다. 이게 남으면 초기화가 무의미하다.
      ansible.builtin.shell: |
        ip neigh flush all || true
        ip -6 neigh flush all || true
      changed_when: true
      failed_when: false

    - name: 인터페이스 주소 비우기 (임시로 추가한 주소 제거)
      # 관리망은 **절대** 건드리지 않는다. 이름으로 고르면 안 된다 —
      # 설정이 아직 안 올라간 노드에서는 관리 NIC 도 eth0 로 보이고,
      # 그러면 `^eth` 에 걸려 초기화가 랩 전체를 잠가 버린다.
      # 실제로 그렇게 13대 중 11대가 접속 불능이 된 적이 있다.
      # 이름은 못 믿으므로 MAC 으로 가려낸다.
      #  `ip addr flush` 를 그냥 쓰면 **링크로컬(fe80::)까지 지운다.** 커널은 그것을
      #  자동으로 되살리지 않고, netplan 은 설정에 적힌 전역 주소만 다시 넣는다.
      #  그러면 라우터 간 링크에 fe80:: 이 영영 없는 상태가 되고, 링크로컬로
      #  인접을 맺는 OSPFv3 가 이웃을 하나도 못 만든다 — M6 의 IPv6 통신이
      #  통째로 죽는데 IPv4 는 멀쩡해서 원인을 찾기가 아주 어렵다.
      #  지울 것만 지운다: IPv4 전부와 IPv6 의 전역 주소.
      ansible.builtin.shell: |
        for d in /sys/class/net/*; do
          i=$(basename "$d")
          [ "$i" = lo ] && continue
          [ "$(cat "$d/address" 2>/dev/null)" = "{{ mgmt_mac }}" ] && continue
          ip -4 addr flush dev "$i" 2>/dev/null || true
          ip -6 addr flush dev "$i" scope global 2>/dev/null || true
        done
      changed_when: true
      failed_when: false

    - name: 임시로 만든 dummy/vlan 인터페이스 제거
      ansible.builtin.shell: |
        for i in $(ls /sys/class/net); do
          t=$(cat /sys/class/net/$i/uevent 2>/dev/null | grep -c DEVTYPE=vlan || true)
          case "$i" in
            eth*.*) ip link del "$i" 2>/dev/null || true ;;
          esac
        done
      changed_when: true
      failed_when: false

    - name: 링크 강제 up (교육생이 down 시킨 것 복구)
      ansible.builtin.shell: |
        for d in /sys/class/net/*; do
          i=$(basename "$d")
          [ "$i" = lo ] || ip link set "$i" up 2>/dev/null || true
        done
      changed_when: true
      failed_when: false

    - name: 관리망 주소 확인 (초기화가 접속 경로를 끊지 않았는지)
      # 마지막 그물. 위 작업들이 아무리 어긋나도 관리망만은 살아서 나가야 한다 —
      # "랩이 완전히 죽어도 이 경로로는 항상 접속된다" 가 이 랩의 전제이기 때문.
      ansible.builtin.shell: |
        m=""
        for d in /sys/class/net/*; do
          [ "$(cat "$d/address" 2>/dev/null)" = "{{ mgmt_mac }}" ] && m=$(basename "$d")
        done
        [ -n "$m" ] || exit 0
        ip link set "$m" up 2>/dev/null || true
        ip -4 addr show dev "$m" | grep -q "inet {{ mgmt_ip }}/" || \
          ip addr add {{ mgmt_ip }}/{{ mgmt_prefixlen }} dev "$m"
      changed_when: true
      failed_when: false

    # -----------------------------------------------------------------------
    #  여기서 **살아 있는 상태**를 되살린다.
    #
    #  뒤에 오는 site.yml 은 파일이 바뀔 때만 적용한다(handler). 그런데 초기화가
    #  지우는 것은 파일이 아니라 그 파일이 만들어 둔 결과다 — 주소·브리지·규칙.
    #  그래서 파일은 그대로인데 장비는 비어 있고, site.yml 은 "바뀐 것 없음" 이라며
    #  지나간다. 실제로 [이 모듈 적용] 을 두 번 누르면 pc1 의 eth1 이 주소를 잃고
    #  ping 이 "Network is unreachable" 로 죽었다. 한 번은 되고 두 번째부터 깨지는
    #  초기화는 "1분 안에 되돌아온다" 는 이 랩의 약속을 지키지 못한다.
    #
    #  FRR 은 여기 없어도 된다 — 위에서 frr.conf 를 통째로 지우므로 site.yml 이
    #  파일을 다시 쓰고 handler 가 알아서 돈다.
    # -----------------------------------------------------------------------
    - name: 주소 다시 올리기 (netplan)
      ansible.builtin.command: netplan apply
      async: 60
      poll: 0
      changed_when: true
      failed_when: false
      register: reset_netplan

    - name: 재접속 대기
      ansible.builtin.wait_for_connection:
        delay: 3
        timeout: 120

    - name: netplan 이 끝나기를 기다린다
      # 아래에서 스위치를 다시 세우기 전에 netplan 이 끝나 있어야 한다.
      # 아니면 방금 꽂은 포트를 netplan 이 도로 떼어 간다.
      ansible.builtin.async_status:
        jid: "{{ reset_netplan.ansible_job_id }}"
      register: reset_np_done
      until: reset_np_done.finished
      retries: 30
      delay: 2
      failed_when: false
      when: reset_netplan.ansible_job_id is defined

    # 아직 이 단계에 등장하지 않은 장비에는 서비스도 파일도 없다.
    # sw2 는 m1 에서 스위치 역할을 받지 않는다 — 그런데도 재시작을 걸면
    # "Could not find the requested service" 로 초기화 전체가 멈춘다.
    - name: 되살릴 것이 깔려 있는가
      ansible.builtin.stat: {path: "{{ item }}"}
      register: reset_files
      loop:
        - /etc/systemd/system/lab-switch.service
        - /etc/nftables.conf

    - name: 링크로컬(fe80::)이 없는 인터페이스 되살리기
      # 예전 초기화가 지워 버린 노드를 고친다. disable_ipv6 을 껐다 켜면
      # 커널이 링크로컬을 다시 만든다. 이미 있는 인터페이스는 건드리지 않는다.
      ansible.builtin.shell: |
        for d in /sys/class/net/*; do
          i=$(basename "$d")
          [ "$i" = lo ] && continue
          [ "$(cat "$d/operstate" 2>/dev/null)" = up ] || continue
          [ -e "/proc/sys/net/ipv6/conf/$i/disable_ipv6" ] || continue
          ip -6 addr show dev "$i" scope link | grep -q inet6 && continue
          sysctl -qw "net.ipv6.conf.$i.disable_ipv6=1" 2>/dev/null || true
          sysctl -qw "net.ipv6.conf.$i.disable_ipv6=0" 2>/dev/null || true
        done
      changed_when: true
      failed_when: false

    - name: 스위치 브리지 다시 만들기
      # 위에서 브리지를 통째로 지웠다. 스크립트가 그대로면 site.yml 은
      # 아무것도 하지 않는다 — 포트 없는 랩이 그대로 남는다.
      ansible.builtin.systemd: {name: lab-switch, state: restarted}
      when: node_role == 'switch' and reset_files.results[0].stat.exists

    - name: 방화벽 규칙 다시 넣기 (그 단계에서 있어야 할 때만)
      # 위에서 `nft flush ruleset` 을 했다. nftables.conf 가 그대로면
      # site.yml 은 그냥 지나간다.
      #
      # 단계를 봐야 한다. 예전에 M10 까지 갔던 랩은 파일이 남아 있어서,
      # 그냥 다시 읽으면 **M10 시작 상태인데 방화벽이 이미 다 서 있다.**
      # 교재 3.1 은 `nft list ruleset` 이 비어 있다고 말하는 자리다.
      ansible.builtin.command: nft -f /etc/nftables.conf
      changed_when: true
      failed_when: false
      when:
        - node_role == 'edge'
        - reset_files.results[1].stat.exists
        - stages.index(config_stage | default(lab_stage)) >= stages.index('m10')

    - name: 아직 M10 이 아니면 경계 규칙 파일도 지운다
      ansible.builtin.file: {path: /etc/nftables.conf, state: absent}
      when:
        - node_role == 'edge'
        - stages.index(config_stage | default(lab_stage)) < stages.index('m10')

- name: 설정 재적용
  ansible.builtin.import_playbook: site.yml

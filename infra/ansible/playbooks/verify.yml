---
# 단계별 도달성 자동 검증.
#   ansible-playbook -i inventory/lab1 playbooks/verify.yml -e lab_stage=m4
# 각 모듈의 verify.sh 가 이 플레이북을 호출한다.
- name: "my-network-lab :: 검증"
  hosts: all
  become: true
  gather_facts: false
  vars:
    si: "{{ stages.index(lab_stage) }}"

  tasks:
    - name: 인터페이스가 전부 up 인가
      # 인터페이스 자체가 없을 수도 있다 (설정이 아직 안 올라간 노드).
      # cat 이 그냥 실패하면 모듈 오류로 터져 원인이 안 보인다 — 값으로 말하게 한다.
      ansible.builtin.shell: |
        cat /sys/class/net/{{ item.name }}/operstate 2>/dev/null || echo '없음(설정 미적용)'
      register: link_state
      changed_when: false
      failed_when: link_state.stdout != 'up'
      loop: "{{ lab_interfaces | selectattr('active') | selectattr('bridge_id') | list }}"
      loop_control: {label: "{{ inventory_hostname }}:{{ item.name }}"}

    # ---- M1 : 같은 대역 L2 통신 ----
    - name: "[M1] pc1 -> pc2 (같은 대역, L2)"
      ansible.builtin.command: >-
        ping -c2 -W2
        {{ (hostvars['pc2'].lab_interfaces | selectattr('ipv4', 'defined') | first).ipv4.split('/')[0] }}
      changed_when: false
      when: inventory_hostname == 'pc1' and si | int == stages.index('m1')

    # ---- M2 : VLAN 분리 후 라우터 경유 ----
    - name: "[M2+] pc1 -> pc2 (다른 대역, 라우터 경유)"
      ansible.builtin.command: ping -c2 -W2 {{ ipv4.segments.vlan20.hosts.pc2 }}
      changed_when: false
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m2')

    # ---- M3 : 사이트 간 통신 ----
    - name: "[M3+] pc1 -> web (사이트 간)"
      ansible.builtin.command: ping -c2 -W2 {{ ipv4.segments.vlan40.hosts.web }}
      changed_when: false
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m3')

    - name: "[M3+] pc1 -> web HTTP 응답"
      ansible.builtin.command: curl -sS -m5 -o /dev/null -w '%{http_code}' http://{{ ipv4.segments.vlan40.hosts.web }}/
      register: http
      changed_when: false
      failed_when: http.stdout != '200'
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m3')

    # ---- M4 : OSPF 인접 ----
    - name: "[M4+] OSPF 인접이 Full 인가"
      ansible.builtin.shell: vtysh -c 'show ip ospf neighbor' | grep -c Full
      register: ospf_nb
      changed_when: false
      failed_when: ospf_nb.stdout | int < 1
      when: node_role == 'router' and si | int >= stages.index('m4')

    # ---- M5 : IPv6 ----
    - name: "[M5+] pc1 -> web (IPv6)"
      ansible.builtin.command: ping6 -c2 -W2 {{ ipv6.segments.vlan40.hosts.web }}
      changed_when: false
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m5')

    # ---- M8 : DNS / FTP ----
    - name: "[M8+] DNS 이름 해석"
      ansible.builtin.command: dig +short @{{ dns.server }} web.{{ dns.zone }} A
      register: dig_out
      changed_when: false
      failed_when: ipv4.segments.vlan40.hosts.web not in dig_out.stdout
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m8')

    - name: "[M8+] FTP 제어 채널 응답"
      ansible.builtin.shell: |
        exec 3<>/dev/tcp/{{ ipv4.segments.vlan40.hosts.ftp }}/21 && head -1 <&3
      args: {executable: /bin/bash}
      register: ftp_banner
      changed_when: false
      failed_when: "'220' not in ftp_banner.stdout"
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m8')

    # ---- M9 : NAT ----
    - name: "[M9] pc1 -> 외부 사이트 (NAT 경유)"
      ansible.builtin.command: curl -sS -m5 -o /dev/null -w '%{http_code}' http://{{ public.ipv4.external_site.inet_loopback }}/
      register: ext
      changed_when: false
      failed_when: ext.stdout != '200'
      when: inventory_hostname == 'pc1' and si | int >= stages.index('m9')

    - name: "[M9] 외부 -> web 공개 IP (DNAT)"
      ansible.builtin.command: curl -sS -m5 -o /dev/null -w '%{http_code}' http://{{ public.ipv4.nat_pool.dnat[0].public }}/
      register: dnat
      changed_when: false
      failed_when: dnat.stdout != '200'
      when: inventory_hostname == 'inet' and si | int >= stages.index('m9')

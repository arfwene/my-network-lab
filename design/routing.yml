# =============================================================================
#  my-network-lab :: 라우팅 정책
# =============================================================================
#  주소는 ipam.yml, 배선은 topology.yml, "경로를 어떻게 정할 것인가"는 여기.
#  모듈 진행에 따라 정적 -> 동적으로 넘어가는 과정이 그대로 드러나도록 단계별로 나눴다.
# =============================================================================

# -----------------------------------------------------------------------------
# M3 : 정적 라우팅
#   이 시점의 토폴로지는 r1 - r2 - r4 단일 경로 (r3 는 아직 없다).
#   ※ 교육 포인트: 아래에서 한 줄만 빼면 "가는 길은 있는데 오는 길이 없는" 상태가 된다.
#     M3 장애 주입은 이 표에서 리턴 경로 한 줄을 지우는 것으로 구현한다.
# -----------------------------------------------------------------------------
#  주소를 직접 쓰지 않는다. "어느 구역으로 / 어느 링크의 누구를 거쳐"만 적는다.
#  실제 주소는 config/site.yml + design/ipam.yml 에서 계산된다 (tools/labdesign.py).
#    to.zone   : ipam 의 구역 요약 대역        to.default : 0.0.0.0/0
#    to.block  : site.yml 의 networks 키       via.link/node : P2P 링크의 상대 라우터
#    via.transit : 공인 회선 구간의 상대
static_m3:
  r1:
    - {to: {zone: site-b}, via: {link: r1-r2, node: r2}, desc: "Site-B 전체 -> r2"}
  r2:
    - {to: {zone: site-a}, via: {link: r1-r2, node: r1}, desc: "Site-A 전체 -> r1  (리턴 경로)"}
    - {to: {zone: site-b}, via: {link: r2-r4, node: r4}, desc: "Site-B 전체 -> r4"}
  r4:
    - {to: {zone: site-a}, via: {link: r2-r4, node: r2}, desc: "Site-A 전체 -> r2  (리턴 경로)"}

# -----------------------------------------------------------------------------
# M4 : OSPF
#   정적 경로를 전부 걷어내고 동적 라우팅으로 전환한다.
#   r3 경로의 cost 를 높게 둬서 평상시엔 r2 를 쓰고, r2 장애 시 r3 로 넘어가게 한다.
#   M5 에서 들어오는 r5 도 같은 모양이다 (r5-r2 가 10, r5-r3 가 100).
#   -> "수렴(convergence)"을 눈으로 보는 것이 M4 의 핵심 실험.
# -----------------------------------------------------------------------------
ospf:
  area: 0.0.0.0
  # r5 는 M5 에서 들어온다. 교재 3장이 손으로 켜는 것이라 여기 적어 두는 것은
  # **완성된 모습**이다 — 검증과 캡스톤이 이 목록을 기준으로 본다.
  routers: [r1, r2, r3, r4, r5]
  router_id_from: loopback        # router-id = 루프백 주소 (실무 관례)
  # 네트워크 광고 대상: 각 라우터가 자기 인터페이스 대역을 area 0 에 광고
  passive_interfaces:             # 사용자/서버망 쪽은 Hello 를 보낼 이유가 없다
    r1: [eth1.10, eth1.20]
    r5: [eth1.10, eth1.20]        # 백업 게이트웨이 쪽. 여기도 사용자망이다
    r4: [eth3]
  # 링크별 cost 는 ipam.yml 의 p2p.*.ospf_cost 가 소유한다 (주 경로 10 / 백업 100)
  timers:
    hello: 10
    dead: 40
  notes: |
    [Neighbor 가 안 맺힐 때 점검 순서 — D5 체크리스트]
      1) Area ID 일치        2) 서브넷/마스크 일치
      3) MTU 일치            4) 인증 · Hello/Dead 타이머 일치
    M4 장애 주입은 이 4가지를 하나씩 어긋나게 만드는 방식으로 구현한다.

# -----------------------------------------------------------------------------
# M6 : IPv6 (OSPFv3)
# -----------------------------------------------------------------------------
ospf6:
  area: 0.0.0.0
  # IPv6 는 이중화하지 않는다 (M6). r5 는 IPv4 게이트웨이 백업 전용이라
  # OSPFv3 에도 넣지 않는다 — 넣으면 M6 에서 "IPv6 는 왜 한 대뿐인가" 가 흐려진다.
  routers: [r1, r2, r3, r4]
  enable_on_interfaces: true

# -----------------------------------------------------------------------------
# M10 : 인터넷 경계
#   내부는 OSPF 로 기본 경로를 배포받고, 경계 밖은 정적으로 처리한다.
#   (실무에서도 인터넷 경계는 정적 default 또는 BGP 이며, IGP 로 풀지 않는다)
# -----------------------------------------------------------------------------
edge_routing_m9:
  r4:
    static:
      - {to: {default: true}, via: {link: r4-edge, node: edge}, desc: "인터넷 default -> edge"}
    ospf_default_originate: true   # 내부 라우터들이 default 를 OSPF 로 학습
  edge:
    static:
      - {to: {default: true},          via: {transit: inet},           desc: "ISP 방향 default"}
      - {to: {block: lab_block},       via: {link: r4-edge, node: r4}, desc: "사내 전체 -> r4"}
  inet:
    static:
      - {to: {block: public_service},  via: {transit: edge},           desc: "고객 공인 서비스 블록 -> edge (ISP 역할)"}
    note: |
      inet 은 사내 사설 대역(lab_block)으로 가는 경로를 갖지 않는다. 의도된 설계다.
      -> "사설 IP 는 인터넷에서 라우팅되지 않는다"(C7)를 라우팅 테이블로 증명하는 지점.
